<line x1="651" y1="560" x2="755" y2="560" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<text x="703.0" y="548.0" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="19" fill="#587086" font-weight="400" text-anchor="middle">去噪器</text>
<rect x="770" y="510" width="190" height="100" rx="16" fill="#e7f4ed" stroke="#aabccc" stroke-width="2"/>
<text x="865.0" y="550" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">…</text>
<line x1="966" y1="560" x2="1070" y2="560" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1018.0" y="548.0" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="19" fill="#587086" font-weight="400" text-anchor="middle">去噪器</text>
<rect x="1085" y="510" width="190" height="100" rx="16" fill="#e7f4ed" stroke="#aabccc" stroke-width="2"/>
<text x="1180.0" y="550" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">x₀</text>
<text x="55" y="726" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="start">一次训练更新只采一个噪声级别，不代表生成时只需要调用一次网络。</text>
</svg>