<text x="1215.0" y="295" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">与已知 ε 比较</text>
<text x="70" y="455" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="26" fill="#15304a" font-weight="700" text-anchor="start">生成时没有干净答案：从噪声开始逐步修正</text>
<rect x="140" y="510" width="190" height="100" rx="16" fill="#e7f4ed" stroke="#aabccc" stroke-width="2"/>
<text x="235.0" y="550" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">xT</text>
