<text x="535.0" y="295" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">用闭式加噪公式</text>
<line x1="665" y1="290" x2="740" y2="290" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="750" y="215" width="250" height="145" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
<text x="875.0" y="255" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">噪声预测</text>
<text x="875.0" y="295" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">εθ(x_t,t,条件)</text>
<line x1="1005" y1="290" x2="1080" y2="290" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1090" y="215" width="250" height="145" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
