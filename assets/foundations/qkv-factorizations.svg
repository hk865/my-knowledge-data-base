<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#2767b2"/></marker></defs><rect width="1400" height="760" fill="#fbfcfe"/>
<text x="55" y="65" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="34" fill="#15304a" font-weight="700" text-anchor="start">一个M 两个投影 共享W 是三种不同说法</text>
<text x="55" y="106" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="start">以下等价只讨论无偏置、无RoPE等中间变换的打分路径</text>
<rect x="65" y="185" width="1270" height="120" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
<text x="700.0" y="225" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">XWQ WKᵀXᵀ = XMXᵀ</text>
<text x="700.0" y="265" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">把给定WQ与WK相乘得到M，打分可以完全相同</text>
<rect x="65" y="365" width="385" height="240" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
<text x="257.5" y="405" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">独立 WQ / WK</text>
<text x="257.5" y="445" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">M = WQ WKᵀ</text>
<text x="257.5" y="476" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">rank(M) ≤ dk</text>
<text x="257.5" y="507" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">可非对称；不要求稀疏</text>
<rect x="505" y="365" width="385" height="240" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
<text x="697.5" y="405" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">任意单矩阵 M</text>
<text x="697.5" y="445" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">直接学习 d × d 矩阵</text>
<text x="697.5" y="476" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">可达到更高秩</text>
<text x="697.5" y="507" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">合法，但函数族可能变大</text>
<rect x="945" y="365" width="390" height="240" rx="16" fill="#e7f4ed" stroke="#aabccc" stroke-width="2"/>
<text x="1140.0" y="405" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">共享一个 W</text>
<text x="1140.0" y="445" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">M = WWᵀ</text>
<text x="1140.0" y="476" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">对称且半正定</text>
<text x="1140.0" y="507" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">比独立Q/K的限制更强</text>
<text x="55" y="726" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="start">低秩 ≠ 稀疏：[[3,4],[6,8]]全部非零，仍只有一个独立方向。</text>
</svg>