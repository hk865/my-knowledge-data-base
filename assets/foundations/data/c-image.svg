<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="white"/>
<text x="44" y="68.75999999999999" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="34" font-weight="700" fill="#182b3b">图像从文件变成 batch</text>
<text x="44" y="109.8" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" fill="#526578">CIFAR-10 的原始像素布局必须正确还原</text>
<rect x="44" y="208" width="350" height="235" rx="12" fill="#e8f1fc" stroke="#8b9bad" stroke-width="2"/>
<text x="62" y="247.36" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#182b3b">单张图像</text>
<text x="62" y="284.8" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" fill="#182b3b">3 个颜色通道</text>
<text x="62" y="316.8" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" fill="#182b3b">32×32 个像素</text>
<text x="62" y="348.8" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" fill="#182b3b">uint8 → float32</text>
<line x1="394" y1="324" x2="418" y2="324" stroke="#8b9bad" stroke-width="3"/>
<polygon points="418,324 406.5914266954251,330.2325320018546 406.5914266954251,317.7674679981454" fill="#8b9bad"/>
<rect x="424" y="208" width="350" height="235" rx="12" fill="#e4f4f0" stroke="#8b9bad" stroke-width="2"/>
<text x="442" y="247.36" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#182b3b">训练样本</text>
<text x="442" y="284.8" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" fill="#182b3b">训练变换后 [3,32,32]</text>
<text x="442" y="316.8" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" fill="#182b3b">标签 int64，取 0…9</text>
<text x="442" y="348.8" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" fill="#182b3b">验证关闭随机增强</text>
<line x1="774" y1="324" x2="798" y2="324" stroke="#8b9bad" stroke-width="3"/>
<polygon points="798,324 786.5914266954252,330.2325320018546 786.5914266954252,317.7674679981454" fill="#8b9bad"/>
<rect x="804" y="208" width="350" height="235" rx="12" fill="#fff4d7" stroke="#8b9bad" stroke-width="2"/>
<text x="822" y="247.36" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#182b3b">拼接成一批</text>
<text x="822" y="284.8" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" fill="#182b3b">输入 [B,3,32,32]</text>
<text x="822" y="316.8" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" fill="#182b3b">输出 [B,10]</text>
<text x="822" y="348.8" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="20" font-weight="400" fill="#182b3b">标签 [B]，直接算 CE</text>
<line x1="44" y1="637" x2="1156" y2="637" stroke="#d8e1e9" stroke-width="2"/>
<text x="44" y="674.52" font-family="Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" font-size="18" font-weight="400" fill="#526578">不要先 softmax 再交给期望 logits 的 cross_entropy</text>
</svg>