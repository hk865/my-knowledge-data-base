<polyline points="135,400 1250,400" fill="none" stroke="#aabccc" stroke-width="1" stroke-dasharray="6,5"/>
<rect x="145" y="535" width="480" height="120" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
<text x="385.0" y="575" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">训练 BPTT</text>
