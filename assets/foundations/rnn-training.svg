<text x="55" y="726" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="start">截断BPTT节省训练内存，但也截断学习信号；不等于部署时不能继续维护状态。</text>
