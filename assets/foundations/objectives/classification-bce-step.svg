<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7890a8"/></marker></defs><rect width="1600" height="900" fill="#fbfcfe"/><g font-family="Noto Sans CJK SC, sans-serif">
<text x="64" y="80" font-size="42" fill="#17324d" font-weight="700" text-anchor="start">步骤二 多标签不是把类别概率强行凑成1</text>
<text x="64" y="132" font-size="25" fill="#50657a" font-weight="400" text-anchor="start">例：有行人为真，有雨为假</text>
<rect x="64.0" y="192" width="456.0" height="245" rx="18" fill="#e7effa"/>
<text x="90.0" y="232" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">① 预测</text>
<text x="90.0" y="274" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">两项预测</text>
<text x="90.0" y="324" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">p行人 = 0.8</text>
<text x="90.0" y="366" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">p有雨 = 0.3</text>
<text x="90.0" y="408" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">总和1.1没有问题</text>
<path d="M528.0 314.5 L563.0 314.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="572.0" y="192" width="456.0" height="245" rx="18" fill="#dff3eb"/>
<text x="598.0" y="232" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">② 计分</text>
<text x="598.0" y="274" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">根据标签取概率</text>
<text x="598.0" y="324" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">y = (1,0)</text>
<text x="598.0" y="366" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">正项：−log0.8</text>
<text x="598.0" y="408" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">负项：−log0.7</text>
<path d="M1036.0 314.5 L1071.0 314.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1080.0" y="192" width="456.0" height="245" rx="18" fill="#fff1d6"/>
<text x="1106.0" y="232" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">③ 聚合</text>
<text x="1106.0" y="274" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">按两项平均</text>
<text x="1106.0" y="324" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">(0.223+0.357)/2</text>
<text x="1106.0" y="366" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">≈ 0.290</text>
<text x="1106.0" y="408" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">输出形状需与目标一致</text>
<rect x="64.0" y="502" width="456.0" height="245" rx="18" fill="#e7effa"/>
<text x="90.0" y="542" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">分清任务</text>
<text x="90.0" y="584" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">CE的竞争关系</text>
<text x="90.0" y="634" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">类别互斥时用softmax</text>
<text x="90.0" y="676" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">提高一类归一化概率</text>
<text x="90.0" y="718" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">会影响其他类</text>
<path d="M528.0 624.5 L563.0 624.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="572.0" y="502" width="456.0" height="245" rx="18" fill="#dff3eb"/>
<text x="598.0" y="542" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">分清模型</text>
<text x="598.0" y="584" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">BCE的二元概率</text>
<text x="598.0" y="634" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">各标签分别sigmoid</text>
<text x="598.0" y="676" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">不要求类别互斥</text>
<text x="598.0" y="718" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">仍可共享特征骨干</text>
<path d="M1036.0 624.5 L1071.0 624.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1080.0" y="502" width="456.0" height="245" rx="18" fill="#fce6e3"/>
<text x="1106.0" y="542" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">分清评价</text>
<text x="1106.0" y="584" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">阈值另作选择</text>
<text x="1106.0" y="634" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">训练loss不固定阈值</text>
<text x="1106.0" y="676" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">部署按验证集选阈值</text>
<text x="1106.0" y="718" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">同时检查精度与召回</text>
<text x="64" y="844" font-size="24" fill="#50657a" font-weight="400" text-anchor="start">BCEWithLogitsLoss合并sigmoid和BCE以提高数值稳定性</text>
</g></svg>