<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7890a8"/></marker></defs><rect width="1600" height="900" fill="#fbfcfe"/><g font-family="Noto Sans CJK SC, sans-serif">
<text x="64" y="80" font-size="42" fill="#17324d" font-weight="700" text-anchor="start">概率分类总图</text>
<text x="64" y="132" font-size="25" fill="#50657a" font-weight="400" text-anchor="start">输出空间决定归一化方式，目标分布决定损失含义</text>
<rect x="64.0" y="192" width="456.0" height="245" rx="18" fill="#e7effa"/>
<text x="90.0" y="232" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">情形 A</text>
<text x="90.0" y="274" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">互斥类别</text>
<text x="90.0" y="324" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">一张图只选一类</text>
<text x="90.0" y="366" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">C 个 logits → softmax</text>
<text x="90.0" y="408" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">概率总和为1</text>
<path d="M528.0 314.5 L563.0 314.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="572.0" y="192" width="456.0" height="245" rx="18" fill="#dff3eb"/>
<text x="598.0" y="232" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">训练</text>
<text x="598.0" y="274" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">硬标签交叉熵</text>
<text x="598.0" y="324" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">读取正确类概率 pᵧ</text>
<text x="598.0" y="366" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">ℓ = −log pᵧ</text>
<text x="598.0" y="408" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">类索引不是数值距离</text>
<path d="M1036.0 314.5 L1071.0 314.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1080.0" y="192" width="456.0" height="245" rx="18" fill="#fff1d6"/>
<text x="1106.0" y="232" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">测试</text>
<text x="1106.0" y="274" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">分类评价</text>
<text x="1106.0" y="324" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">argmax 后算准确率</text>
<text x="1106.0" y="366" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">需要时另查召回/校准</text>
<text x="1106.0" y="408" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">CE还关心自信程度</text>
<rect x="64.0" y="502" width="456.0" height="245" rx="18" fill="#e7effa"/>
<text x="90.0" y="542" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">情形 B</text>
<text x="90.0" y="584" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">多个二元判断</text>
<text x="90.0" y="634" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">多个标签可同时为真</text>
<text x="90.0" y="676" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">每类 logit → sigmoid</text>
<text x="90.0" y="718" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">概率不必加起来为1</text>
<path d="M528.0 624.5 L563.0 624.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="572.0" y="502" width="456.0" height="245" rx="18" fill="#dff3eb"/>
<text x="598.0" y="542" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">训练</text>
<text x="598.0" y="584" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">二元交叉熵 BCE</text>
<text x="598.0" y="634" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">正标签看 p</text>
<text x="598.0" y="676" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">负标签看 1−p</text>
<text x="598.0" y="718" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">按指定位置平均</text>
<path d="M1036.0 624.5 L1071.0 624.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1080.0" y="502" width="456.0" height="245" rx="18" fill="#fce6e3"/>
<text x="1106.0" y="542" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">扩展</text>
<text x="1106.0" y="584" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">软分布比较</text>
<text x="1106.0" y="634" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">CE(P,Q) = H(P)+KL</text>
<text x="1106.0" y="676" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">P固定时最优Q相同</text>
<text x="1106.0" y="718" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">KL方向不能颠倒</text>
<text x="64" y="844" font-size="24" fill="#50657a" font-weight="400" text-anchor="start">BCE按条件伯努利项建模；共享网络仍可利用现实标签之间的相关性</text>
</g></svg>