<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7890a8"/></marker></defs><rect width="1600" height="900" fill="#fbfcfe"/><g font-family="Noto Sans CJK SC, sans-serif">
<text x="64" y="80" font-size="42" fill="#17324d" font-weight="700" text-anchor="start">步骤二 更低的loss不能创造缺失的观测</text>
<text x="64" y="132" font-size="25" fill="#50657a" font-weight="400" text-anchor="start">理想化例子：姿态不变、无加速度、无外部定位</text>
<rect x="64.0" y="192" width="456.0" height="245" rx="18" fill="#e7effa"/>
<text x="90.0" y="232" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">情况 A</text>
<text x="90.0" y="274" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">轨迹A</text>
<text x="90.0" y="324" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">初速度：1 m/s</text>
<text x="90.0" y="366" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">经过1秒位移：1 m</text>
<text x="90.0" y="408" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">角速度为0</text>
<path d="M528.0 314.5 L563.0 314.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="572.0" y="192" width="456.0" height="245" rx="18" fill="#dff3eb"/>
<text x="598.0" y="232" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">输入一样</text>
<text x="598.0" y="274" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">相同IMU读数</text>
<text x="598.0" y="324" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">两者线加速度都为0</text>
<text x="598.0" y="366" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">同姿态下比力相同</text>
<text x="598.0" y="408" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">原始窗口无法区分</text>
<path d="M1036.0 314.5 L1071.0 314.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1080.0" y="192" width="456.0" height="245" rx="18" fill="#fff1d6"/>
<text x="1106.0" y="232" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">情况 B</text>
<text x="1106.0" y="274" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">轨迹B</text>
<text x="1106.0" y="324" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">初速度：2 m/s</text>
<text x="1106.0" y="366" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">经过1秒位移：2 m</text>
<text x="1106.0" y="408" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">角速度同样为0</text>
<rect x="64.0" y="502" width="456.0" height="245" rx="18" fill="#e7effa"/>
<text x="90.0" y="542" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">信息边界</text>
<text x="90.0" y="584" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">标签可以不同</text>
<text x="90.0" y="634" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">Δp_A 不等于 Δp_B</text>
<text x="90.0" y="676" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">更多拟合不消除歧义</text>
<text x="90.0" y="718" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">初速度或先验必须另来</text>
<path d="M528.0 624.5 L563.0 624.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="572.0" y="502" width="456.0" height="245" rx="18" fill="#dff3eb"/>
<text x="598.0" y="542" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">合理期待</text>
<text x="598.0" y="584" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">网络能学到什么</text>
<text x="598.0" y="634" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">训练分布中的运动先验</text>
<text x="598.0" y="676" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">统计上有用的条件预测</text>
<text x="598.0" y="718" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">不等于普适物理可观测</text>
<path d="M1036.0 624.5 L1071.0 624.5" stroke="#7890a8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1080.0" y="502" width="456.0" height="245" rx="18" fill="#fce6e3"/>
<text x="1106.0" y="542" font-size="22" fill="#50657a" font-weight="600" text-anchor="start">验证要求</text>
<text x="1106.0" y="584" font-size="30" fill="#17324d" font-weight="700" text-anchor="start">怎样检验边界</text>
<text x="1106.0" y="634" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">新轨迹/设备/运动类型</text>
<text x="1106.0" y="676" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">单列初始条件与失败</text>
<text x="1106.0" y="718" font-size="25" fill="#17324d" font-weight="400" text-anchor="start">不要只报窗口平均loss</text>
<text x="64" y="844" font-size="24" fill="#50657a" font-weight="400" text-anchor="start">限定为常用局部惯性模型；这里只演示初速度歧义，不处理地球自转等高级效应</text>
</g></svg>