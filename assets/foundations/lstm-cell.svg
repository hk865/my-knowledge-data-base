<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#2767b2"/></marker></defs><rect width="1400" height="760" fill="#fbfcfe"/>
<text x="55" y="65" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="34" fill="#15304a" font-weight="700" text-anchor="start">LSTM单元：一条可加性记忆通路</text>
<text x="55" y="106" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="start">上方横线是直接记忆路径；下方输入参与计算各门与候选</text>
<rect x="60" y="210" width="200" height="100" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
<text x="160.0" y="250" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">c_(t−1)</text>
<circle cx="430" cy="260" r="36" fill="#e7f4ed" stroke="#127c80" stroke-width="2"/>
<text x="430" y="269" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="27" fill="#15304a" font-weight="400" text-anchor="middle">×</text>
<circle cx="865" cy="260" r="36" fill="#e7f4ed" stroke="#127c80" stroke-width="2"/>
<text x="865" y="269" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="27" fill="#15304a" font-weight="400" text-anchor="middle">+</text>
<rect x="1120" y="210" width="210" height="100" rx="16" fill="#e7f4ed" stroke="#aabccc" stroke-width="2"/>
<text x="1225.0" y="250" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">c_t</text>
<line x1="265" y1="260" x2="385" y2="260" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="472" y1="260" x2="820" y2="260" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="905" y1="260" x2="1110" y2="260" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="330" y="440" width="200" height="110" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
<text x="430.0" y="480" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">f_t</text>
<text x="430.0" y="520" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">保留门</text>
<line x1="430" y1="434" x2="430" y2="303" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="615" y="465" width="180" height="115" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
<text x="705.0" y="505" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">i_t</text>
<text x="705.0" y="545" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">写入门</text>
<rect x="900" y="465" width="180" height="115" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
<text x="990.0" y="505" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">g_t</text>
<text x="990.0" y="545" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">候选内容</text>
<circle cx="865" cy="390" r="31" fill="#e7f4ed" stroke="#127c80" stroke-width="2"/>
<text x="865" y="399" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="27" fill="#15304a" font-weight="400" text-anchor="middle">×</text>
<line x1="710" y1="458" x2="830" y2="405" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="980" y1="458" x2="900" y2="405" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="865" y1="350" x2="865" y2="305" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1100" y="475" width="240" height="130" rx="16" fill="#eaf2fa" stroke="#aabccc" stroke-width="2"/>
<text x="1220.0" y="515" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">h_t</text>
<text x="1220.0" y="555" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="middle">o_t ⊙ tanh(c_t)</text>
<line x1="1220" y1="320" x2="1220" y2="465" stroke="#2767b2" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="570" width="490" height="90" rx="16" fill="#e7f4ed" stroke="#aabccc" stroke-width="2"/>
<text x="305.0" y="610" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="25" fill="#15304a" font-weight="700" text-anchor="middle">[x_t ; h_(t−1)]</text>
<text x="605" y="665" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="22" fill="#587086" font-weight="400" text-anchor="start">同一输入同时决定 f、i、o、g</text>
<text x="55" y="726" font-family="Noto Sans CJK SC,Noto Sans,sans-serif" font-size="20" fill="#587086" font-weight="400" text-anchor="start">直接通路的局部导数为diag(f)；总导数仍含门对旧状态的间接依赖。</text>
</svg>