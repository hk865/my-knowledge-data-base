<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#64748b"/></marker></defs><rect width="1600" height="1060" fill="#f8fafc"/>
<text x="60" y="69" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="bold" fill="#0f172a">Qwen2.5-1M：从 256K 训练到 1M 输入</text>
<text x="60" y="111" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="normal" fill="#334155">位置外推、长序列训练与稀疏推理协同；不是把上下文长度简单调大</text>
<text x="60" y="169" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="bold" fill="#1d4ed8">01  训练权重</text>
<rect x="60" y="192" width="460" height="253" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<rect x="60" y="192" width="460" height="52" rx="16" fill="#2563eb"/>
<text x="80" y="228" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="white">长上下文继续预训练</text>
<text x="80" y="283" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">中间 base：4K → 32K</text>
<text x="80" y="318" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">继续训练：64K → 128K → 256K</text>
<text x="80" y="353" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">后三阶段：75% 最长序列 + 25% 短序列</text>
<text x="80" y="388" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">自然长文 + 合成 FIM / 检索 / 重排</text>
<text x="80" y="423" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">RoPE base：1M → 5M → 10M</text>
<rect x="565" y="192" width="460" height="253" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<rect x="565" y="192" width="460" height="52" rx="16" fill="#2563eb"/>
<text x="585" y="228" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="white">分阶段监督微调</text>
<text x="585" y="283" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">SFT 1：≤32K 短指令</text>
<text x="585" y="318" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">SFT 2：短指令 + ≤256K 长指令</text>
<text x="585" y="353" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">在训练成本与长短任务能力间平衡</text>
<text x="585" y="388" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">训练长度上限是 256K</text>
<text x="585" y="423" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">1M 不是该阶段的训练序列长度</text>
<rect x="1070" y="192" width="470" height="253" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/>
<rect x="1070" y="192" width="470" height="52" rx="16" fill="#2563eb"/>
<text x="1090" y="228" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="white">短序列偏好优化</text>
<text x="1090" y="283" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">离线偏好优化，方法类似 DPO</text>
<text x="1090" y="318" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">只使用 ≤8K 序列</text>
<text x="1090" y="353" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">改善偏好对齐；不等于百万 token RL</text>
<text x="1090" y="388" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">论文未建立长 rollout 信用分配结论</text>
<text x="1090" y="423" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">输入窗口、生成长度、轨迹长度分开</text>
