<text x="60" y="505" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="bold" fill="#0f766e">02  固定权重：离线校准与在线推理</text>
<rect x="60" y="530" width="345" height="265" rx="16" fill="white" stroke="#0f766e" stroke-width="2"/>
<rect x="60" y="530" width="345" height="52" rx="16" fill="#0f766e"/>
<text x="80" y="566" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="white">位置外推</text>
<text x="80" y="621" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">DCA 重映射相对位置</text>
<text x="80" y="656" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">YaRN 注意力温度缩放</text>
<text x="80" y="691" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">把 256K 训练范围扩展到 1M</text>
<text x="80" y="726" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">改变位置坐标的处理方式</text>
<text x="80" y="761" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">不等于滑动窗口裁剪</text>
<rect x="435" y="530" width="345" height="265" rx="16" fill="white" stroke="#0f766e" stroke-width="2"/>
<rect x="435" y="530" width="345" height="52" rx="16" fill="#0f766e"/>
<text x="455" y="566" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="white">稀疏预填充</text>
<text x="455" y="621" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">修改 MInference 适配分块</text>
<text x="455" y="656" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">每块 32,768 token</text>
<text x="455" y="691" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">块末 64 个 query 选关键键</text>
<text x="455" y="726" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">选择坐标为 DCA 做平滑</text>
<text x="455" y="761" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">实际注意力仍用 DCA 坐标</text>
<rect x="810" y="530" width="345" height="265" rx="16" fill="white" stroke="#0f766e" stroke-width="2"/>
<rect x="810" y="530" width="345" height="52" rx="16" fill="#0f766e"/>
<text x="830" y="566" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="white">部署前：1M 稀疏校准</text>
<text x="830" y="621" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">无需重新训练模型权重</text>
<text x="830" y="656" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">检查稀疏注意力质量</text>
<text x="830" y="691" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">attention-mass recall 不足时</text>
<text x="830" y="726" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">增加稀疏 token 预算</text>
<text x="830" y="761" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">论文未公开具体阈值</text>
<rect x="1185" y="530" width="355" height="265" rx="16" fill="white" stroke="#0f766e" stroke-width="2"/>
<rect x="1185" y="530" width="355" height="52" rx="16" fill="#0f766e"/>
<text x="1205" y="566" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="white">系统执行</text>
<text x="1205" y="621" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">内核优化 + DCPP + TAG</text>
<text x="1205" y="656" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">分块 prefill / 流水线分配</text>
<text x="1205" y="691" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">分开管理执行与内存约束</text>
<text x="1205" y="726" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">输入窗口最高 1M</text>
<text x="1205" y="761" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="normal" fill="#334155">开源 7B / 14B 输出上限 8K</text>
