<text x="85" y="879" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="bold" fill="#0f172a">必须保留的三个边界</text>
<text x="85" y="919" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="normal" fill="#334155">DCA 位置分块 ≠ prefill 内存分块 ≠ 流水线调度分块；因果约束 j ≤ i 不变；稀疏键从可见历史中选择</text>
