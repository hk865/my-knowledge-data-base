<text x="180.0" y="267.91999999999996" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="24" fill="#172d42" font-weight="400" text-anchor="middle">N × (P²C)</text>
<text x="180.0" y="302.91999999999996" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="24" fill="#172d42" font-weight="400" text-anchor="middle">目标像素保留</text>
