<text x="500.0" y="267.91999999999996" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="24" fill="#172d42" font-weight="400" text-anchor="middle">随机置换 / 选择</text>
<text x="500.0" y="302.91999999999996" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="24" fill="#172d42" font-weight="400" text-anchor="middle">保留 (1 − m)N 个</text>
