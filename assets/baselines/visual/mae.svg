<text x="742.5" y="572.92" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="24" fill="#172d42" font-weight="400" text-anchor="middle">N × (P²C)</text>
<text x="742.5" y="607.92" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="24" fill="#172d42" font-weight="400" text-anchor="middle">由线性输出层产生</text>
