<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#556579"/></marker></defs><rect width="1600" height="1040" fill="#f8fafc"/><text x="50" y="62" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#24324a">DreamerV3 的两条训练路和一条执行路</text><text x="50" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">原创总览：真实经验教会模型预测；模型中的练习教会策略选择</text><rect x="50" y="150" width="440" height="220" rx="12" fill="#e8f2fd" stroke="#cdd7e3" stroke-width="2"/><text x="72" y="192" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">1 真实经验训练世界模型</text><text x="72" y="234" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">看到画面和库存，执行动作</text><text x="72" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">记录下一观测、奖励、终止信息</text><text x="72" y="302" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">编码状态并学习动作的后果</text><text x="72" y="336" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">用真实结果纠正预测</text><rect x="580" y="150" width="440" height="220" rx="12" fill="#eeeafa" stroke="#cdd7e3" stroke-width="2"/><text x="602" y="192" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">2 想象轨迹训练策略</text><text x="602" y="234" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">从真实片段的内部状态出发</text><text x="602" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">actor选动作，模型预测下一状态</text><text x="602" y="302" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">critic估计后续还能拿多少奖励</text><text x="602" y="336" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">更新actor与critic</text><rect x="1110" y="150" width="440" height="220" rx="12" fill="#e4f3eb" stroke="#cdd7e3" stroke-width="2"/><text x="1132" y="192" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">3 回到环境执行</text><text x="1132" y="234" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">新观测更新内部状态</text><text x="1132" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">actor直接选择动作</text><text x="1132" y="302" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">环境给出真正的结果</text><text x="1132" y="336" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">继续收集并学习</text><path d="M500 255L565 255" fill="none" stroke="#556579" stroke-width="3" marker-end="url(#a)"/><path d="M1030 255L1095 255" fill="none" stroke="#556579" stroke-width="3" marker-end="url(#a)"/><text x="60" y="437" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">世界模型不等于整个Dreamer：模型负责预测；actor负责行动；critic负责估值</text><rect x="50" y="495" width="1500" height="370" rx="12" fill="#fff" stroke="#cdd7e3" stroke-width="2"/><text x="80" y="541" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#24324a">同一采矿例子贯穿全文</text><rect x="80" y="578" width="425" height="175" rx="12" fill="#e8f2fd" stroke="#cdd7e3" stroke-width="2"/><text x="102" y="620" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">观测</text><text x="102" y="662" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">看见树与手中物品</text><text x="102" y="696" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">未必看得见身后环境</text><text x="102" y="730" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">观测不同于完整状态</text><rect x="587" y="578" width="425" height="175" rx="12" fill="#fff0d9" stroke="#cdd7e3" stroke-width="2"/><text x="609" y="620" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">行动与奖励</text><text x="609" y="662" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">动作：靠近树、采集、制作</text><text x="609" y="696" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">奖励：首次获得里程碑物品</text><text x="609" y="730" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">长期目标：最终拿到钻石</text><rect x="1093" y="578" width="425" height="175" rx="12" fill="#eeeafa" stroke="#cdd7e3" stroke-width="2"/><text x="1115" y="620" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">想象的边界</text><text x="1115" y="662" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">内部状态预测，不必画视频</text><text x="1115" y="696" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">未见过的后果可能预测错误</text><text x="1115" y="730" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">仍需真实交互校正</text><text x="80" y="817" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">本文从简化教学采矿过程讲起，再单独说明论文真实Minecraft环境的设置</text><text x="55" y="926" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#24324a">共享的是算法设置，不是一个权重模型直接玩遍所有任务</text><text x="55" y="974" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#66758c">依据 arXiv:2301.04104v1，2023；2025 Nature结果另行区分</text></svg>