<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#556579"/></marker></defs><rect width="1600" height="830" fill="#f8fafc"/><text x="50" y="62" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#24324a">同一动作块有两个不同的时间轴</text><text x="50" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">去噪发生在计算机里；执行动作才让环境时间向前走</text><rect x="50" y="145" width="360" height="170" rx="12" fill="#eee9fb" stroke="#cdd7e3" stroke-width="2"/><text x="72" y="187" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">计算时间  k</text><text x="72" y="229" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">固定这一次的观测条件</text><text x="72" y="263" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">随机动作 → 多次去噪</text><text x="72" y="297" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">产生完整动作块</text><path d="M430 230L500 230" fill="none" stroke="#556579" stroke-width="3" marker-end="url(#a)"/><rect x="520" y="145" width="1030" height="170" rx="12" fill="#e9f3fd" stroke="#cdd7e3" stroke-width="2"/><text x="542" y="187" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">环境时间  t</text><text x="542" y="229" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">看最近2次观测，预测16步；下面用每步0.1秒作教学算例</text><text x="542" y="263" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">若执行8步，约0.8秒后重新观测和生成，后8步不必照旧执行</text><text x="55" y="378" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#24324a">第1轮  t = 0</text><rect x="300" y="340" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="318" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">1</text><rect x="374" y="340" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="392" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">2</text><rect x="448" y="340" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="466" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">3</text><rect x="522" y="340" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="540" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">4</text><rect x="596" y="340" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="614" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">5</text><rect x="670" y="340" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="688" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">6</text><rect x="744" y="340" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="762" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">7</text><rect x="818" y="340" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="836" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">8</text><rect x="892" y="340" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="910" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">9</text><rect x="966" y="340" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="984" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">10</text><rect x="1040" y="340" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="1058" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">11</text><rect x="1114" y="340" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="1132" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">12</text><rect x="1188" y="340" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="1206" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">13</text><rect x="1262" y="340" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="1280" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">14</text><rect x="1336" y="340" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="1354" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">15</text><rect x="1410" y="340" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="1428" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">16</text><text x="300" y="449" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#287256">执行动作 1—8</text><text x="900" y="449" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#66758c">动作 9—16 仅为本轮预测</text><text x="55" y="545" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#24324a">第2轮  t = 8</text><rect x="300" y="505" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="312" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">9</text><rect x="374" y="505" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="386" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">10</text><rect x="448" y="505" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="460" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">11</text><rect x="522" y="505" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="534" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">12</text><rect x="596" y="505" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="608" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">13</text><rect x="670" y="505" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="682" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">14</text><rect x="744" y="505" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="756" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">15</text><rect x="818" y="505" width="66" height="65" rx="5" fill="#c7e8d9" stroke="#cdd7e3" stroke-width="2"/><text x="830" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">16</text><rect x="892" y="505" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="904" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">17</text><rect x="966" y="505" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="978" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">18</text><rect x="1040" y="505" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="1052" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">19</text><rect x="1114" y="505" width="66" height="65" rx="5" fill="#e1e7ef" stroke="#cdd7e3" stroke-width="2"/><text x="1126" y="546" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#24324a">20</text><text x="300" y="617" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">根据新观测重算；图中只显示新块前12个位置</text><path d="M863 470L330 493" fill="none" stroke="#556579" stroke-width="3" marker-end="url(#a)"/><text x="55" y="702" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#24324a">T_o 是看几帧，T_p 是预测几步，T_a 是实际执行几步，K 是去噪计算几轮</text><text x="55" y="751" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">示意图按未来动作起点绘制；真实实现必须核对观测窗口与动作切片的时间对齐</text></svg>