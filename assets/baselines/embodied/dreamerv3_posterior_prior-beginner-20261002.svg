<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#556579"/></marker></defs><rect width="1600" height="850" fill="#f8fafc"/><text x="50" y="62" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#24324a">看到新观测和纯想象时 状态从哪里来</text><text x="50" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">后验 q 利用真实观测修正；先验 p 只根据历史预测</text><rect x="50" y="155" width="410" height="210" rx="12" fill="#e8f2fd" stroke="#cdd7e3" stroke-width="2"/><text x="72" y="197" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">先更新记忆 h_t</text><text x="72" y="239" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">上一记忆 h_(t−1)</text><text x="72" y="273" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">上一潜变量 z_(t−1)</text><text x="72" y="307" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">上一动作 a_(t−1)</text><text x="72" y="341" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">共同推进当前记忆</text><rect x="565" y="155" width="480" height="210" rx="12" fill="#e4f3eb" stroke="#cdd7e3" stroke-width="2"/><text x="587" y="197" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">真实路线  q(z_t | h_t, x_t)</text><text x="587" y="239" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">还得到真正的新观测 x_t</text><text x="587" y="273" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">结合记忆估计当前潜变量</text><text x="587" y="307" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">训练及真实执行都使用这条路</text><rect x="565" y="435" width="480" height="210" rx="12" fill="#eeeafa" stroke="#cdd7e3" stroke-width="2"/><text x="587" y="477" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">想象路线  p(z_t | h_t)</text><text x="587" y="519" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">没有新的真实观测</text><text x="587" y="553" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">根据记忆采样预测的潜变量</text><text x="587" y="587" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">继续滚动下一步</text><path d="M470 260L550 260" fill="none" stroke="#556579" stroke-width="3" marker-end="url(#a)"/><path d="M255 380 L255 540 L550 540" fill="none" stroke="#556579" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M530 540L550 540" fill="none" stroke="#556579" stroke-width="3" marker-end="url(#a)"/><rect x="1150" y="270" width="400" height="280" rx="12" fill="#fff0d9" stroke="#cdd7e3" stroke-width="2"/><text x="1172" y="312" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">内部状态 s_t = (h_t, z_t)</text><text x="1172" y="354" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">奖励头：可能获得多少奖励</text><text x="1172" y="388" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">继续头：是否还会继续</text><text x="1172" y="422" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">解码器：还原观测作监督</text><text x="1172" y="456" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">actor：此时选什么动作</text><text x="1172" y="490" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">critic：未来总回报多少</text><path d="M1060 260L1130 360" fill="none" stroke="#556579" stroke-width="3" marker-end="url(#a)"/><path d="M1060 540L1130 470" fill="none" stroke="#556579" stroke-width="3" marker-end="url(#a)"/><text x="55" y="716" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">教学例：刚才看见树并执行采集，新库存告诉模型是否真的拿到木材</text><text x="55" y="768" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">想象中的“拿到了”只是预测；真实库存反馈才能纠正模型对动作后果的理解</text></svg>