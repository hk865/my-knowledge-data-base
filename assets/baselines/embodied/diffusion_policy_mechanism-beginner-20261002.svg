<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#596677"/></marker></defs><rect width="1800" height="1080" fill="#fafbfe"/><text x="60" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="42" font-weight="700" fill="#24324a">Diffusion Policy  |  从噪声生成一段可执行动作</text><text x="60" y="108" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#54647b">视觉条件模仿学习 · arXiv v5 (2024) · t 是环境时间，k 是去噪迭代，两个时间轴不能混用</text><rect x="35" y="147" width="1730" height="475" rx="18" fill="white" stroke="#dbe1eb"/><text x="60" y="194" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">训练路径  /  学到什么与监督从哪来</text><rect x="35" y="660" width="1730" height="355" rx="18" fill="white" stroke="#dbe1eb"/><text x="60" y="707" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">推理路径  /  每次新观测如何变成动作</text><rect x="60" y="225" width="350" height="175" rx="15" fill="#e7f2ff" stroke="#cbd3df" stroke-width="1.6"/><text x="82" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">示范轨迹片段</text><text x="82" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">观测历史 O_t</text><text x="82" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">专家动作序列 A⁰_t</text><text x="82" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">不需要奖励或价值函数</text><rect x="500" y="225" width="350" height="175" rx="15" fill="#fff0d9" stroke="#cbd3df" stroke-width="1.6"/><text x="522" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">随机加噪</text><text x="522" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">采样去噪级别 k</text><text x="522" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">给专家动作加高斯噪声</text><text x="522" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">得到 Aᵏ_t 与噪声标签 ε</text><rect x="940" y="225" width="350" height="175" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.6"/><text x="962" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">条件噪声预测器</text><text x="962" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">图像编码器提取 O_t</text><text x="962" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">CNN + FiLM 或 Transformer</text><text x="962" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">输入 O_t、Aᵏ_t、k</text><rect x="1380" y="225" width="350" height="175" rx="15" fill="#e4f4eb" stroke="#cbd3df" stroke-width="1.6"/><text x="1402" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">噪声回归监督</text><text x="1402" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">MSE(ε, εθ)</text><text x="1402" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">端到端训练视觉与策略</text><text x="1402" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">学条件动作分布 p(A | O)</text><path d="M415 313 L490 313" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M855 313 L930 313" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1295 313 L1370 313" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="60" y="742" width="350" height="175" rx="15" fill="#e7f2ff" stroke="#cbd3df" stroke-width="1.6"/><text x="82" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">最新观测历史</text><text x="82" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">图像与本体状态</text><text x="82" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">典型观测长度 T_o = 2</text><text x="82" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">每轮只编码一次观测</text><rect x="500" y="742" width="350" height="175" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.6"/><text x="522" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">初始化动作噪声</text><text x="522" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">采样 Aᴷ_t</text><text x="522" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">观测特征作为条件</text><text x="522" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">不生成未来图像</text><rect x="940" y="742" width="350" height="175" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.6"/><text x="962" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">反复去噪</text><text x="962" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">Aᴷ → … → A⁰</text><text x="962" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">生成 T_p 步动作序列</text><text x="962" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">T_p 通常为16（CNN）</text><rect x="1380" y="742" width="350" height="175" rx="15" fill="#fff0d9" stroke="#cbd3df" stroke-width="1.6"/><text x="1402" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">执行前 T_a 步</text><text x="1402" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">典型 T_a = 8</text><text x="1402" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">底层位置控制器跟踪</text><text x="1402" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">再观测，再生成下一段</text><path d="M415 830 L490 830" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M855 830 L930 830" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1295 830 L1370 830" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="65" y="452" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">为什么预测序列：把左绕 / 右绕等多个有效模式连成一致轨迹，减少逐步随机换模式</text><text x="65" y="498" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">监督来自示范，推理优化的是去噪采样过程；不显式求动力学约束下的任务代价最小值</text><text x="65" y="544" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">控制边界：动作块内为开环，块间反馈；真实机器人仍需要低层伺服、限速、碰撞与工作区约束</text><path d="M1555 923 L1555 968 L235 968 L235 925" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="675" y="958" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#54647b">环境推进后重新获得观测，形成反馈</text><text x="60" y="1050" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#66758c">原创解释图，据 Chi et al., arXiv:2303.04137v5，Sec.2–4 / Appendix A、D；主文DDIM 10步与附录16步需分别记录</text></svg>