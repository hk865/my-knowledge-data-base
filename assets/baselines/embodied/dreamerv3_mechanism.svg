<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#596677"/></marker></defs><rect width="1800" height="1080" fill="#fafbfe"/><text x="60" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="42" font-weight="700" fill="#24324a">DreamerV3  |  真实经验校准模型，想象经验改善策略</text><text x="60" y="108" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#54647b">潜在动力学强化学习 · arXiv v1 (2023) · 模型学习、策略学习、部署控制三个环节分开</text><rect x="35" y="147" width="1730" height="475" rx="18" fill="white" stroke="#dbe1eb"/><text x="60" y="194" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">训练路径  /  学到什么与监督从哪来</text><rect x="35" y="660" width="1730" height="355" rx="18" fill="white" stroke="#dbe1eb"/><text x="60" y="707" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">推理路径  /  每次新观测如何变成动作</text><rect x="60" y="225" width="350" height="175" rx="15" fill="#e7f2ff" stroke="#cbd3df" stroke-width="1.6"/><text x="82" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">真实交互与回放</text><text x="82" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">观测 x、动作 a</text><text x="82" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">奖励 r、继续标志 c</text><text x="82" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">连续片段来自当前经验</text><rect x="500" y="225" width="350" height="175" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.6"/><text x="522" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">RSSM 后验状态</text><text x="522" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">记忆 h + 离散潜变量 z</text><text x="522" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">q(z | h, x) 看真实观测</text><text x="522" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">先验 p(z | h) 学习预测</text><rect x="940" y="225" width="350" height="175" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.6"/><text x="962" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">潜空间想象轨迹</text><text x="962" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">从回放状态出发</text><text x="962" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">actor 采样动作，先验推进</text><text x="962" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">预测奖励与继续概率</text><rect x="1380" y="225" width="350" height="175" rx="15" fill="#e4f4eb" stroke="#cbd3df" stroke-width="1.6"/><text x="1402" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">Actor + Critic 更新</text><text x="1402" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">λ-return 连接短期与远期</text><text x="1402" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">critic 拟合回报分布</text><text x="1402" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">actor 提高回报并保留探索</text><path d="M415 313 L490 313" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M855 313 L930 313" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1295 313 L1370 313" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="60" y="742" width="350" height="175" rx="15" fill="#e7f2ff" stroke="#cbd3df" stroke-width="1.6"/><text x="82" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">真实新观测</text><text x="82" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">图像 / 本体感觉</text><text x="82" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">上一动作与内部记忆</text><text x="82" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">无需人工动作标签</text><rect x="500" y="742" width="350" height="175" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.6"/><text x="522" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">RSSM 状态估计</text><text x="522" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">更新 h</text><text x="522" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">用新观测得到后验 z</text><text x="522" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">状态 s = (h, z)</text><rect x="940" y="742" width="350" height="175" rx="15" fill="#fff0d9" stroke="#cbd3df" stroke-width="1.6"/><text x="962" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">Actor 直接选动作</text><text x="962" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">连续或离散动作分布</text><text x="962" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">不在部署时做树搜索</text><text x="962" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">不每步在线求解MPC</text><rect x="1380" y="742" width="350" height="175" rx="15" fill="#fff0d9" stroke="#cbd3df" stroke-width="1.6"/><text x="1402" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">环境执行</text><text x="1402" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">获得新观测与奖励</text><text x="1402" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">训练期间继续加入回放</text><text x="1402" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">部署动作进入真实系统</text><path d="M415 830 L490 830" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M855 830 L930 830" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1295 830 L1370 830" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="65" y="452" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">世界模型监督：观测重建 + 奖励 + 继续标志；KL balancing + free bits 对齐后验与先验</text><text x="65" y="498" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">稳定跨域训练：symlog / two-hot；分类分布 1% uniform mix；回报只缩小，不放大近零噪声</text><text x="65" y="544" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">边界：各任务分别训练；算法设置共享，但模型大小、训练比例与交互预算并非全部相同</text><path d="M1555 923 L1555 968 L235 968 L235 925" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="675" y="958" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#54647b">环境推进后重新获得观测，形成反馈</text><text x="60" y="1050" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#66758c">原创解释图，据 Hafner et al., arXiv:2301.04104v1，Fig.3 / Eq.3–12 / Appendix A–W；箭头表示数据流而非所有梯度流</text></svg>