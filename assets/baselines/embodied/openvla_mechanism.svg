<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#596677"/></marker></defs><rect width="1800" height="1080" fill="#fafbfe"/><text x="60" y="64" font-family="Noto Sans CJK SC, sans-serif" font-size="42" font-weight="700" fill="#24324a">OpenVLA  |  把图像与语言转换为机器人动作 token</text><text x="60" y="108" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#54647b">视觉语言动作模型 · arXiv v1 (2024) · 预训练VLM → 机器人动作微调 → 目标平台适配</text><rect x="35" y="147" width="1730" height="475" rx="18" fill="white" stroke="#dbe1eb"/><text x="60" y="194" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">训练路径  /  学到什么与监督从哪来</text><rect x="35" y="660" width="1730" height="355" rx="18" fill="white" stroke="#dbe1eb"/><text x="60" y="707" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">推理路径  /  每次新观测如何变成动作</text><rect x="60" y="225" width="350" height="175" rx="15" fill="#e7f2ff" stroke="#cbd3df" stroke-width="1.6"/><text x="82" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">机器人示范数据</text><text x="82" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">图像 + 任务语言</text><text x="82" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">连续末端控制动作</text><text x="82" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">OpenX 混合约970k轨迹</text><rect x="500" y="225" width="350" height="175" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.6"/><text x="522" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">双视觉编码 + 投影</text><text x="522" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">DINOv2 与 SigLIP</text><text x="522" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">patch 特征通道拼接</text><text x="522" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">MLP 映射到语言嵌入</text><rect x="940" y="225" width="350" height="175" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.6"/><text x="962" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">Llama 2 动作预测</text><text x="962" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">视觉token + 语言token</text><text x="962" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">按维自回归输出动作token</text><text x="962" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">基于 Prismatic VLM 微调</text><rect x="1380" y="225" width="350" height="175" rx="15" fill="#e4f4eb" stroke="#cbd3df" stroke-width="1.6"/><text x="1402" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">动作 token 交叉熵</text><text x="1402" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">每维256个离散桶</text><text x="1402" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">1%–99%分位范围量化</text><text x="1402" y="374" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">仅动作位置计算训练loss</text><path d="M415 313 L490 313" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M855 313 L930 313" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1295 313 L1370 313" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="60" y="742" width="350" height="175" rx="15" fill="#e7f2ff" stroke="#cbd3df" stroke-width="1.6"/><text x="82" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">单张图像 + 指令</text><text x="82" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">例如：把茄子放入锅</text><text x="82" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">原版没有多帧历史</text><text x="82" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">原版没有本体感觉输入</text><rect x="500" y="742" width="350" height="175" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.6"/><text x="522" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">VLM 融合表征</text><text x="522" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">双视觉特征与语言对齐</text><text x="522" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">语言指定目标物与任务</text><text x="522" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">跨机器人数据提供先验</text><rect x="940" y="742" width="350" height="175" rx="15" fill="#fff0d9" stroke="#cbd3df" stroke-width="1.6"/><text x="962" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">7维动作解码</text><text x="962" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">平移3维 + 旋转3维</text><text x="962" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">夹爪1维</text><text x="962" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">token → 连续控制量</text><rect x="1380" y="742" width="350" height="175" rx="15" fill="#fff0d9" stroke="#cbd3df" stroke-width="1.6"/><text x="1402" y="785" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="600" fill="#24324a">机器人控制器</text><text x="1402" y="827" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">执行单步相对动作</text><text x="1402" y="859" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">原版不输出动作块</text><text x="1402" y="891" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">新图像再次闭环查询</text><path d="M415 830 L490 830" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M855 830 L930 830" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1295 830 L1370 830" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="65" y="452" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">训练目标是示范动作预测：没有显式未来状态模型、任务奖励优化或在线规划器</text><text x="65" y="498" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">适配：目标任务10–150条示范；可全参或LoRA微调，控制频率与动作归一化必须匹配</text><text x="65" y="544" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">实验口径：存在部分成功分；LoRA / 量化表使用较小的SigLIP-only变体，不能泛化为所有硬件保证</text><path d="M1555 923 L1555 968 L235 968 L235 925" stroke="#596677" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="675" y="958" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#54647b">环境推进后重新获得观测，形成反馈</text><text x="60" y="1050" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#66758c">原创解释图，据 Kim et al., arXiv:2406.09246v1，Fig.2 / Sec.3、5 / Appendix A–C；不包含后续OpenVLA-OFT等扩展</text></svg>