<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#52647e"/></marker></defs><rect width="1440" height="920" fill="#f6f8fc"/><style>text{font-family:Noto Sans CJK SC,DejaVu Sans,sans-serif;fill:#172b4d} .title{font-size:34px;font-weight:700} .sub{font-size:18px;fill:#52647e} .head{font-size:24px;font-weight:700} .body{font-size:21px} .tiny{font-size:17px;fill:#52647e}</style><text x="52" y="62" class="title">ESKF：大运动留在名义状态，小误差留在切空间</text><text x="52" y="98" class="sub">原创机制图｜下图使用局部姿态误差：q_true = q ⊗ Exp(δθ)；IMU读数是估计输入，不是控制动作</text><rect x="50" y="150" width="355" height="176" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="189" class="head">IMU + 噪声模型</text><text x="72" y="226" class="body">比力 a_m、角速度 ω_m</text><text x="72" y="257" class="body">先减加速度／陀螺偏置</text><text x="72" y="288" class="body">统一单位、时间戳、坐标</text><rect x="475" y="150" width="460" height="176" rx="16" fill="#eaf2ff" stroke="#76a3e5" stroke-width="2"/><text x="497" y="189" class="head">名义状态非线性传播</text><text x="497" y="226" class="body">x = (p, v, q, b_a, b_g, g)</text><text x="497" y="257" class="body">v̇ = R(a_m − b_a) + g</text><text x="497" y="288" class="body">q ← q ⊗ Exp((ω_m − b_g) Δt)</text><rect x="995" y="150" width="395" height="176" rx="16" fill="#eaf7f1" stroke="#68aa8b" stroke-width="2"/><text x="1017" y="189" class="head">误差协方差传播</text><text x="1017" y="226" class="body">δx：18维；姿态误差3维</text><text x="1017" y="257" class="body">P⁻ = Φ P Φᵀ + Q_d</text><text x="1017" y="288" class="body">误差均值为0，P仍会增长</text><path d="M405 235 L475 235" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M935 235 L995 235" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="401" width="390" height="206" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="440" class="head">互补传感器到来</text><text x="72" y="477" class="body">GPS／视觉：y = h(x_true) + n</text><text x="72" y="508" class="body">残差 r = y − h(x)</text><text x="72" y="539" class="body">H必须对误差坐标求导</text><text x="72" y="570" class="body">观测质量决定哪些误差可见</text><rect x="500" y="401" width="430" height="206" rx="16" fill="#eaf2ff" stroke="#76a3e5" stroke-width="2"/><text x="522" y="440" class="head">误差更新 + 注入</text><text x="522" y="477" class="body">K = P Hᵀ (H P Hᵀ + V)⁻¹</text><text x="522" y="508" class="body">δx_hat = K r；更新 P</text><text x="522" y="539" class="body">位置、速度、偏置加误差</text><text x="522" y="570" class="body">姿态：q ← q ⊗ Exp(δθ_hat)</text><rect x="990" y="401" width="400" height="206" rx="16" fill="#fff4e3" stroke="#dbac5d" stroke-width="2"/><text x="1012" y="440" class="head">重置误差坐标</text><text x="1012" y="477" class="body">δx_hat ← 0</text><text x="1012" y="508" class="body">P ← G P Gᵀ，不能清零！</text><text x="1012" y="539" class="body">局部 Gθ ≈ I − ½[δθ_hat]×</text><text x="1012" y="570" class="body">真值不变，参考姿态已改变</text><path d="M440 500 L500 500" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M930 500 L990 500" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1190 326 L1190 366 L718 366 L718 401" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1390 500 L1412 500 L1412 127 L706 127 L706 150" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="682" width="645" height="140" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="721" class="head">换成全局误差时，必须成套改</text><text x="72" y="758" class="body">误差左乘；A、H、注入与重置一起改变</text><text x="72" y="789" class="body">只换四元数分量顺序，不能完成约定转换</text><rect x="755" y="682" width="635" height="140" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="777" y="721" class="head">教程验收：数学与数值一致性</text><text x="777" y="758" class="body">有限差分、单位检查、协方差与误差覆盖</text><text x="777" y="789" class="body">本教程没有新benchmark，不虚构精度排行榜</text><text x="52" y="886" class="tiny">依据 Solà，arXiv:1711.02508v1，§3–7与附录A–E；原创新绘，非原论文图复制。</text></svg>