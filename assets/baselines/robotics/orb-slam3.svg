<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#52647e"/></marker></defs><rect width="1440" height="920" fill="#f6f8fc"/><style>text{font-family:Noto Sans CJK SC,DejaVu Sans,sans-serif;fill:#172b4d} .title{font-size:34px;font-weight:700} .sub{font-size:18px;fill:#52647e} .head{font-size:24px;font-weight:700} .body{font-size:21px} .tiny{font-size:17px;fill:#52647e}</style><text x="52" y="62" class="title">ORB-SLAM3：让历史观测重新参与当前估计</text><text x="52" y="98" class="sub">原创机制图｜阅读顺序：传感器 → 联合估计 → Atlas → 重识别与融合；颜色区分估计、存储、恢复</text><rect x="50" y="150" width="320" height="178" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="189" class="head">输入与前提</text><text x="72" y="226" class="body">图像 → ORB 特征／像素</text><text x="72" y="257" class="body">IMU → 旋转、速度、位移</text><text x="72" y="288" class="body">已知标定、同步、噪声</text><rect x="425" y="150" width="495" height="178" rx="16" fill="#eaf2ff" stroke="#76a3e5" stroke-width="2"/><text x="447" y="189" class="head">联合几何估计</text><text x="447" y="226" class="body">变量：位姿、速度、偏置、地图点</text><text x="447" y="257" class="body">目标：惯性残差 + 鲁棒重投影</text><text x="447" y="288" class="body">跟踪两帧；局部 BA 使用共视帧</text><rect x="980" y="150" width="410" height="178" rx="16" fill="#eaf7f1" stroke="#68aa8b" stroke-width="2"/><text x="1002" y="189" class="head">Atlas 地图集合</text><text x="1002" y="226" class="body">活动地图 + 非活动地图</text><text x="1002" y="257" class="body">共享关键帧词袋数据库</text><text x="1002" y="288" class="body">输出：公制／尺度未定位姿</text><path d="M370 240 L425 240" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M920 240 L980 240" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="394" width="465" height="204" rx="16" fill="#eaf2ff" stroke="#76a3e5" stroke-width="2"/><text x="72" y="433" class="head">初始化：先拆开，再联合</text><text x="72" y="470" class="body">① 视觉 MAP → 尺度未定轨迹</text><text x="72" y="501" class="body">② 惯性 MAP → s、重力、偏置、v</text><text x="72" y="532" class="body">③ 联合 VI MAP → 精化状态</text><text x="72" y="563" class="body">双目固定 s=1；弱激励会退化</text><rect x="575" y="394" width="815" height="204" rx="16" fill="#fff4e3" stroke="#dbac5d" stroke-width="2"/><text x="597" y="433" class="head">新的数据关联不是仅做轨迹拼接</text><text x="597" y="470" class="body">词袋候选 → 3D 对齐 → 共视几何验证</text><text x="597" y="501" class="body">同地图：回环修正；跨地图：融合与焊接 BA</text><text x="597" y="532" class="body">融合重复点 + 增加跨会话观测 + 传播图修正</text><text x="597" y="563" class="body">未成熟单目用 Sim(3)；成熟公制地图用 SE(3)</text><path d="M285 394 L285 358 L640 358 L640 328" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1180 328 L1180 394" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="671" width="615" height="143" rx="16" fill="#fff4e3" stroke="#dbac5d" stroke-width="2"/><text x="72" y="710" class="head">跟踪丢失后的恢复</text><text x="72" y="747" class="body">短暂失明：IMU 预测并扩大视觉搜索</text><text x="72" y="778" class="body">长期失联：新建地图，重访后尝试融合</text><rect x="720" y="671" width="670" height="143" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="742" y="710" class="head">阅读实验时保留条件</text><text x="742" y="747" class="body">ATE 对齐自由度、真值覆盖、失败率必须一致</text><text x="742" y="778" class="body">EuRoC / TUM-VI 的结果不等于所有场景保证</text><path d="M575 500 L547 500 L547 648 L355 648 L355 671" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1390 485 L1412 485 L1412 128 L674 128 L674 150" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><text x="52" y="886" class="tiny">依据 Campos 等，arXiv:2007.11898v2，§III–VI；本图为结构重绘，不复刻原论文图。</text></svg>