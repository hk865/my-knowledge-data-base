<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#67778c"/></marker></defs>
<rect width="1600" height="1170" fill="#f7f9fc"/>
<g font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif">
<text x="64" y="68" font-size="38" font-weight="700" fill="#182841">PPO 的一次更新 谁给分 谁生成 谁负责约束</text>
<text x="64" y="114" font-size="23" font-weight="400" fill="#54657b">同一新回答送入 reference 和 RM；采样概率、参考概率与分数一起组成训练回报。</text>
<rect x="64" y="170" width="400" height="220" rx="16" fill="white" stroke="#087e83" stroke-width="2"/><rect x="64" y="170" width="400" height="54" rx="16" fill="#087e83"/><rect x="64" y="196" width="400" height="28" fill="#087e83"/><text x="86" y="207" font-size="27" font-weight="700" fill="#fff">Actor 当前策略 θ</text><text x="86" y="266" font-size="24" font-weight="400" fill="#182841">读提示 x → 逐 token 生成 y</text><text x="86" y="306" font-size="24" font-weight="400" fill="#182841">保留生成时的 log 概率</text><text x="86" y="346" font-size="24" font-weight="400" fill="#182841">最终要部署的模型</text>
<rect x="598" y="170" width="420" height="220" rx="16" fill="white" stroke="#315bba" stroke-width="2"/><rect x="598" y="170" width="420" height="54" rx="16" fill="#315bba"/><rect x="598" y="196" width="420" height="28" fill="#315bba"/><text x="620" y="207" font-size="27" font-weight="700" fill="#fff">Reference 参考策略</text><text x="620" y="266" font-size="24" font-weight="400" fill="#182841">PPO 起点的 SFT 策略</text><text x="620" y="306" font-size="24" font-weight="400" fill="#182841">整个 PPO 阶段冻结</text><text x="620" y="346" font-size="24" font-weight="400" fill="#182841">对同一回答算 log 概率</text>
<rect x="1135" y="170" width="400" height="220" rx="16" fill="white" stroke="#7853ad" stroke-width="2"/><rect x="1135" y="170" width="400" height="54" rx="16" fill="#7853ad"/><rect x="1135" y="196" width="400" height="28" fill="#7853ad"/><text x="1157" y="207" font-size="27" font-weight="700" fill="#fff">Reward model φ</text><text x="1157" y="266" font-size="24" font-weight="400" fill="#182841">读完整的 (x, y)</text><text x="1157" y="306" font-size="24" font-weight="400" fill="#182841">输出终端奖励 r</text><text x="1157" y="346" font-size="24" font-weight="400" fill="#182841">PPO 阶段冻结</text>
<rect x="64" y="486" width="700" height="215" rx="16" fill="white" stroke="#087e83" stroke-width="2"/><rect x="64" y="486" width="700" height="54" rx="16" fill="#087e83"/><rect x="64" y="512" width="700" height="28" fill="#087e83"/><text x="86" y="523" font-size="27" font-weight="700" fill="#fff">把奖励拆到 token 序列上</text><text x="86" y="582" font-size="24" font-weight="400" fill="#182841">每个 token：−β · ln(当前概率 / 参考概率)</text><text x="86" y="622" font-size="24" font-weight="400" fill="#182841">最后一个 token：再加整句 RM 分数</text><text x="86" y="662" font-size="24" font-weight="400" fill="#182841">沿序列累计后得到训练用回报</text>
<rect x="831" y="486" width="705" height="215" rx="16" fill="white" stroke="#b76213" stroke-width="2"/><rect x="831" y="486" width="705" height="54" rx="16" fill="#b76213"/><rect x="831" y="512" width="705" height="28" fill="#b76213"/><text x="853" y="523" font-size="27" font-weight="700" fill="#fff">Critic 价值模型 ψ</text><text x="853" y="582" font-size="24" font-weight="400" fill="#182841">看提示 + 已生成的前缀，预测未来回报</text><text x="853" y="622" font-size="24" font-weight="400" fill="#182841">实际/估计回报 − 价值基线 → 优势 A</text><text x="853" y="662" font-size="24" font-weight="400" fill="#182841">它参与学习；评分 RM 在此时不学习</text>
<line x1="264" y1="393" x2="264" y2="473" stroke="#67778c" stroke-width="3" marker-end="url(#arr)"/>
<line x1="720" y1="393" x2="575" y2="473" stroke="#67778c" stroke-width="3" marker-end="url(#arr)"/>
<polyline points="1336,393 1336,430 710,430 710,473" fill="none" stroke="#67778c" stroke-width="3" marker-end="url(#arr)"/>
<line x1="768" y1="593" x2="815" y2="593" stroke="#67778c" stroke-width="3" marker-end="url(#arr)"/>
<rect x="64" y="786" width="700" height="243" rx="16" fill="white" stroke="#315bba" stroke-width="2"/><rect x="64" y="786" width="700" height="54" rx="16" fill="#315bba"/><rect x="64" y="812" width="700" height="28" fill="#315bba"/><text x="86" y="823" font-size="27" font-weight="700" fill="#fff">Old policy 本轮采样快照</text><text x="86" y="882" font-size="24" font-weight="400" fill="#182841">记录刚才采样时每个 token 的概率</text><text x="86" y="922" font-size="24" font-weight="400" fill="#182841">用于比值 q = π_current / π_old</text><text x="86" y="962" font-size="24" font-weight="400" fill="#182841">采样批次更新后，下一轮会刷新</text><text x="86" y="1002" font-size="24" font-weight="400" fill="#182841">无需是第五个永久独立网络</text>
<rect x="831" y="786" width="705" height="243" rx="16" fill="white" stroke="#087e83" stroke-width="2"/><rect x="831" y="786" width="705" height="54" rx="16" fill="#087e83"/><rect x="831" y="812" width="705" height="28" fill="#087e83"/><text x="853" y="823" font-size="27" font-weight="700" fill="#fff">更新与下一轮</text><text x="853" y="882" font-size="24" font-weight="400" fill="#182841">用优势 A 和 clip(q, 0.8, 1.2) 更新 actor</text><text x="853" y="922" font-size="24" font-weight="400" fill="#182841">用回报目标更新 critic</text><text x="853" y="962" font-size="24" font-weight="400" fill="#182841">PPO-ptx 再加预训练文本的学习梯度</text><text x="853" y="1002" font-size="24" font-weight="400" fill="#182841">然后用更新后的 actor 重新采样</text>
<line x1="765" y1="895" x2="815" y2="895" stroke="#67778c" stroke-width="3" marker-end="url(#arr)"/>
<line x1="1183" y1="705" x2="1183" y2="773" stroke="#67778c" stroke-width="3" marker-end="url(#arr)"/>
<text x="64" y="1106" font-size="25" font-weight="400" fill="#182841">关键区别：reference 衡量“偏离训练起点多少”；old 衡量“偏离本轮采样行为多少”</text>
<text x="64" y="1150" font-size="21" font-weight="400" fill="#54657b">依据：[1] 式2与附录C.4；[6] PPO式7；概念流程图省略工程并行、批处理等细节</text>
</g></svg>