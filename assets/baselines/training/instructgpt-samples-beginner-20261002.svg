<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#67778c"/></marker></defs>
<rect width="1600" height="1050" fill="#f7f9fc"/>
<g font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif">
<text x="64" y="68" font-size="38" font-weight="700" fill="#182841">同一个问题 在三个阶段长成三种训练样本</text>
<text x="64" y="114" font-size="23" font-weight="400" fill="#54657b">原创教学样本；并非论文原始训练记录。只有偏好阶段需要在同一问题下比较回答。</text>
<rect x="64" y="159" width="1472" height="147" rx="16" fill="white" stroke="#087e83" stroke-width="2"/><rect x="64" y="159" width="1472" height="54" rx="16" fill="#087e83"/><rect x="64" y="185" width="1472" height="28" fill="#087e83"/><text x="86" y="196" font-size="27" font-weight="700" fill="#fff">贯穿例子 x</text><text x="86" y="255" font-size="24" font-weight="400" fill="#182841">通知：博物馆周二至周日 9:00—17:00 开放，周一闭馆。问：周一能去吗？请用一句话回答。</text>
<rect x="64" y="355" width="440" height="401" rx="16" fill="white" stroke="#315bba" stroke-width="2"/><rect x="64" y="355" width="440" height="54" rx="16" fill="#315bba"/><rect x="64" y="381" width="440" height="28" fill="#315bba"/><text x="86" y="392" font-size="27" font-weight="700" fill="#fff">SFT 看示范</text><text x="86" y="451" font-size="24" font-weight="400" fill="#182841">存储：(x, y*)</text><text x="86" y="491" font-size="24" font-weight="400" fill="#182841">y*：不能，博物馆周一闭馆。</text><text x="86" y="531" font-size="24" font-weight="400" fill="#182841">把人写的回答当作训练目标</text><text x="86" y="571" font-size="24" font-weight="400" fill="#182841">逐位置计算正确 token 的概率</text><text x="86" y="611" font-size="24" font-weight="400" fill="#182841">更新：生成模型参数 θ</text><text x="86" y="651" font-size="24" font-weight="400" fill="#182841">目标：更可能生成好示范</text>
<rect x="580" y="355" width="440" height="401" rx="16" fill="white" stroke="#7853ad" stroke-width="2"/><rect x="580" y="355" width="440" height="54" rx="16" fill="#7853ad"/><rect x="580" y="381" width="440" height="28" fill="#7853ad"/><text x="602" y="392" font-size="27" font-weight="700" fill="#fff">RM 看比较</text><text x="602" y="451" font-size="24" font-weight="400" fill="#182841">存储：(x, y_w, y_l)</text><text x="602" y="491" font-size="24" font-weight="400" fill="#182841">y_w：不能，博物馆周一闭馆。</text><text x="602" y="531" font-size="24" font-weight="400" fill="#182841">y_l：可以，周一 9 点开放。</text><text x="602" y="571" font-size="24" font-weight="400" fill="#182841">人只需说哪份更好</text><text x="602" y="611" font-size="24" font-weight="400" fill="#182841">更新：评分模型参数 φ</text><text x="602" y="651" font-size="24" font-weight="400" fill="#182841">目标：r(x,y_w) 高于 r(x,y_l)</text>
<rect x="1096" y="355" width="440" height="401" rx="16" fill="white" stroke="#087e83" stroke-width="2"/><rect x="1096" y="355" width="440" height="54" rx="16" fill="#087e83"/><rect x="1096" y="381" width="440" height="28" fill="#087e83"/><text x="1118" y="392" font-size="27" font-weight="700" fill="#fff">PPO 看自己新写的回答</text><text x="1118" y="451" font-size="24" font-weight="400" fill="#182841">存储：提示 x；在线生成 y</text><text x="1118" y="491" font-size="24" font-weight="400" fill="#182841">生成：当前策略自行续写</text><text x="1118" y="531" font-size="24" font-weight="400" fill="#182841">反馈：冻结 RM 对新回答打分</text><text x="1118" y="571" font-size="24" font-weight="400" fill="#182841">约束：不要过度偏离参考策略</text><text x="1118" y="611" font-size="24" font-weight="400" fill="#182841">更新：生成策略 θ 与价值模型 ψ</text><text x="1118" y="651" font-size="24" font-weight="400" fill="#182841">目标：较高奖励且控制行为漂移</text>
<line x1="508" y1="532" x2="565" y2="532" stroke="#67778c" stroke-width="3" marker-end="url(#arr)"/>
<line x1="1024" y1="532" x2="1081" y2="532" stroke="#67778c" stroke-width="3" marker-end="url(#arr)"/>
<text x="64" y="825" font-size="29" font-weight="700" fill="#182841">数据量的单位也不同</text>
<text x="64" y="872" font-size="26" font-weight="400" fill="#182841">12,725 个 SFT 训练提示    ·    33,207 个 RM 训练提示    ·    31,144 个 PPO 训练提示</text>
<text x="64" y="919" font-size="25" font-weight="400" fill="#182841">RM 每个提示有 4—9 份候选，最多产生 6—36 个成对比较；提示数不等于偏好对数</text>
<text x="64" y="1003" font-size="22" font-weight="400" fill="#54657b">依据：[1] §3.1—3.5、表6；此处只统一讲解样本形式，实际三套提示集并不相同</text>
</g></svg>