<rect x="65" y="910" width="1470" height="54" rx="18" fill="#7550ad"/><rect x="65" y="937" width="1470" height="27" fill="#7550ad"/>
<text x="87" y="947" font-size="26" font-weight="700" fill="white">读实验的边界</text>
<text x="87" y="1003" font-size="23" font-weight="400" fill="#152642">LAMBADA few-shot 86.4%；SuperGLUE 71.8；WiC 49.4%，能力并不均匀</text>
<text x="87" y="1038" font-size="23" font-weight="400" fill="#152642">测试污染需独立审计；本篇没有比较全部预训练目标，也没有训练RLHF助手</text>
<text x="65" y="1125" font-size="20" font-weight="400" fill="#526079">来源：GPT-3 §2–5，表2.1–2.2、3.2、3.8，附录A–C  |  arXiv:2005.14165v4</text>
</g></svg>