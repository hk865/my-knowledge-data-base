<text x="65" y="808" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="normal" fill="#334155" text-anchor="start">实际配置：每块 4 token，最多选 512 个完整块；未完成的末块额外保留。</text>
<text x="40" y="880" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#64748b" text-anchor="start">依据 Qwen3.8-Next §2.1.2；仅示意索引与读取，省略多头、归一化、RoPE 与训练损失。</text>
