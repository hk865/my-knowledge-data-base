<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc">
<title id="title">QSA：索引小块，再读取块内token</title><desc id="desc">原创QSA机制图，玩具示例含16个已完成历史token，每4个一块，选2块。索引压缩后选块，主注意力读取选中块内原token。实际模型最多选512完整块，另保留未完成尾块。</desc>
