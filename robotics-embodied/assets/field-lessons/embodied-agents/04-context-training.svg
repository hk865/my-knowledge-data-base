<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840"><defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2469a5"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#258163"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8853a4"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b67824"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516578"/></marker>
</defs><rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif;fill:#172b42} .sub{fill:#516578}</style>
<text x="44" y="58" font-size="34" font-weight="700" text-anchor="start" style="fill:#172b42">行为变化不一定是参数学习</text>
<text x="44" y="99" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">明确记录什么变了：输入上下文 外部记忆 还是神经网络权重</text>
<text x="45" y="157" font-size="27" font-weight="700" text-anchor="start" style="fill:#172b42">执行链  参数θ保持相同</text>
<rect x="45" y="190" width="300" height="165" rx="16" fill="#eef8f1" stroke="#258163" stroke-width="2"/>
<text x="65" y="229" font-size="25" font-weight="700" text-anchor="start" style="fill:#172b42">新的观察或经验</text>
<text x="65" y="269" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">O20显示空夹</text>
<text x="65" y="300" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">检索到重新定位技能</text>
<rect x="425" y="190" width="365" height="165" rx="16" fill="#edf5fb" stroke="#2469a5" stroke-width="2"/>
<text x="445" y="229" font-size="25" font-weight="700" text-anchor="start" style="fill:#172b42">构造新的上下文 xₜ</text>
<text x="445" y="269" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">任务 + 当前证据 + 记忆</text>
<text x="445" y="300" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">将信息送给同一个模型</text>
<rect x="890" y="190" width="500" height="165" rx="16" fill="#edf5fb" stroke="#2469a5" stroke-width="2"/>
<text x="910" y="229" font-size="25" font-weight="700" text-anchor="start" style="fill:#172b42">得到不同决策并执行</text>
<text x="910" y="269" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">πθ(下一操作 | xₜ)</text>
<text x="910" y="300" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">选择重新观察 不是继续携物</text>
<text x="910" y="331" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">没有loss和优化器参与这次更新</text>
<polyline points="345,275 425,275" fill="none" stroke="#258163" stroke-width="3" stroke-dasharray="0" marker-end="url(#green)"/>
<polyline points="790,275 890,275" fill="none" stroke="#2469a5" stroke-width="3" stroke-dasharray="0" marker-end="url(#blue)"/>
<text x="45" y="467" font-size="27" font-weight="700" text-anchor="start" style="fill:#172b42">学习链  数据与目标产生θ′</text>
<rect x="45" y="500" width="300" height="165" rx="16" fill="#f5eef9" stroke="#8853a4" stroke-width="2"/>
<text x="65" y="539" font-size="25" font-weight="700" text-anchor="start" style="fill:#172b42">构造可训练样本</text>
<text x="65" y="579" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">输入 x 与审核目标 y</text>
<text x="65" y="610" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">或轨迹与环境回报 R</text>
<rect x="425" y="500" width="365" height="165" rx="16" fill="#f5eef9" stroke="#8853a4" stroke-width="2"/>
<text x="445" y="539" font-size="25" font-weight="700" text-anchor="start" style="fill:#172b42">前向预测并计算损失</text>
<text x="445" y="579" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">SFT：目标token负对数概率</text>
<text x="445" y="610" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">RL：优势影响选择概率</text>
<text x="445" y="641" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">规则反馈不必本身可微</text>
<rect x="890" y="500" width="500" height="165" rx="16" fill="#f5eef9" stroke="#8853a4" stroke-width="2"/>
<text x="910" y="539" font-size="25" font-weight="700" text-anchor="start" style="fill:#172b42">反向传播并更新指定参数</text>
<text x="910" y="579" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">梯度 ∂L/∂θ → 优化器 → θ′</text>
<text x="910" y="610" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">可只更新高层 保持低层VLA冻结</text>
<text x="910" y="641" font-size="21" font-weight="400" text-anchor="start" style="fill:#516578">新参数在下一次执行中发挥作用</text>
<polyline points="345,585 425,585" fill="none" stroke="#8853a4" stroke-width="3" stroke-dasharray="0" marker-end="url(#purple)"/>
<polyline points="790,585 890,585" fill="none" stroke="#8853a4" stroke-width="3" stroke-dasharray="8" marker-end="url(#purple)"/>
<text x="45" y="790" font-size="20" font-weight="400" text-anchor="start" style="fill:#516578">整理技能包或编辑记忆也能改善行为；若没有参数更新链，就不要把它写成SFT或RL。</text>
</svg>