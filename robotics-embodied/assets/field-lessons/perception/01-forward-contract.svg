<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker></defs><rect width="1280" height="690" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#162235"><text x="42" y="45" font-size="28" fill="#162235" font-weight="700" text-anchor="start">图 1  一次感知前向处理究竟传递什么</text><rect x="42" y="100" width="255" height="180" rx="10" fill="#f1f5f9" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="132" font-size="22" fill="#162235" font-weight="700" text-anchor="start">传感器包</text><text x="58" y="164" font-size="19" fill="#162235" font-weight="400" text-anchor="start">RGB：H × W × 3</text><text x="58" y="193" font-size="19" fill="#162235" font-weight="400" text-anchor="start">深度：H × W，米</text><text x="58" y="222" font-size="19" fill="#162235" font-weight="400" text-anchor="start">时间戳 + 坐标系名</text><text x="58" y="251" font-size="19" fill="#162235" font-weight="400" text-anchor="start">相机内参 K</text><rect x="365" y="100" width="255" height="180" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="381" y="132" font-size="22" fill="#162235" font-weight="700" text-anchor="start">图像内的预测</text><text x="381" y="164" font-size="19" fill="#162235" font-weight="400" text-anchor="start">卷积/视觉编码器</text><text x="381" y="193" font-size="19" fill="#162235" font-weight="400" text-anchor="start">类别与概率</text><text x="381" y="222" font-size="19" fill="#162235" font-weight="400" text-anchor="start">像素掩码 M(u,v)</text><text x="381" y="251" font-size="19" fill="#162235" font-weight="400" text-anchor="start">输出仍在图像上</text><rect x="688" y="100" width="255" height="180" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="704" y="132" font-size="22" fill="#162235" font-weight="700" text-anchor="start">几何还原</text><text x="704" y="164" font-size="19" fill="#162235" font-weight="400" text-anchor="start">有效掩码内取深度</text><text x="704" y="193" font-size="19" fill="#162235" font-weight="400" text-anchor="start">像素 → 相机三维点</text><text x="704" y="222" font-size="19" fill="#162235" font-weight="400" text-anchor="start">剔除边界与离群点</text><text x="704" y="251" font-size="19" fill="#162235" font-weight="400" text-anchor="start">输入 K、深度单位</text><path d="M297,190 L355,190" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M620,190 L678,190" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="688" y="365" width="255" height="180" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="704" y="397" font-size="22" fill="#162235" font-weight="700" text-anchor="start">变换与关联</text><text x="704" y="429" font-size="19" fill="#162235" font-weight="400" text-anchor="start">用采集时刻的 T</text><text x="704" y="458" font-size="19" fill="#162235" font-weight="400" text-anchor="start">相机系 → 地图系</text><text x="704" y="487" font-size="19" fill="#162235" font-weight="400" text-anchor="start">匹配上一时刻对象</text><text x="704" y="516" font-size="19" fill="#162235" font-weight="400" text-anchor="start">估计位置与速度</text><rect x="365" y="365" width="255" height="180" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="381" y="397" font-size="22" fill="#162235" font-weight="700" text-anchor="start">可供动作模块使用</text><text x="381" y="429" font-size="19" fill="#162235" font-weight="400" text-anchor="start">对象 ID：17</text><text x="381" y="458" font-size="19" fill="#162235" font-weight="400" text-anchor="start">杯子：0.91</text><text x="381" y="487" font-size="19" fill="#162235" font-weight="400" text-anchor="start">位置 + 协方差</text><text x="381" y="516" font-size="19" fill="#162235" font-weight="400" text-anchor="start">采集时间 + 有效期</text><rect x="42" y="365" width="255" height="180" rx="10" fill="#fff5e8" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="397" font-size="22" fill="#162235" font-weight="700" text-anchor="start">下游继续判断</text><text x="58" y="429" font-size="19" fill="#162235" font-weight="400" text-anchor="start">抓取：表面和朝向？</text><text x="58" y="458" font-size="19" fill="#162235" font-weight="400" text-anchor="start">导航：可通行区域？</text><text x="58" y="487" font-size="19" fill="#162235" font-weight="400" text-anchor="start">低置信度：再观察</text><text x="58" y="516" font-size="19" fill="#162235" font-weight="400" text-anchor="start">过期观测：不直接用</text><path d="M815,280 L815,355" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M688,450 L630,450" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M365,450 L307,450" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><text x="1000" y="140" font-size="19" fill="#162235" font-weight="400" text-anchor="start">固定标定参数</text><text x="1000" y="174" font-size="19" fill="#162235" font-weight="400" text-anchor="start">不是神经权重</text><text x="1000" y="208" font-size="19" fill="#162235" font-weight="400" text-anchor="start"></text><text x="1000" y="242" font-size="19" fill="#162235" font-weight="400" text-anchor="start">运行时主要更新</text><text x="1000" y="276" font-size="19" fill="#162235" font-weight="400" text-anchor="start">图像预测和对象状态</text><text x="1000" y="310" font-size="19" fill="#162235" font-weight="400" text-anchor="start"></text><text x="1000" y="344" font-size="19" fill="#162235" font-weight="400" text-anchor="start">神经权重默认冻结</text><text x="42" y="625" font-size="23" fill="#162235" font-weight="700" text-anchor="start">所有箭头都要对齐时间、坐标与单位；“杯子”标签本身没有米制位置</text></g></svg>