<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker></defs><rect width="1280" height="700" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#162235"><text x="42" y="45" font-size="28" fill="#162235" font-weight="700" text-anchor="start">图 4  同一物体的坐标与时间不能混用</text><rect x="40" y="115" width="350" height="172" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="56" y="147" font-size="22" fill="#162235" font-weight="700" text-anchor="start">t₀ = 10.00 s 的相机观测</text><text x="56" y="179" font-size="19" fill="#162235" font-weight="400" text-anchor="start">像素 (u,v) = (370,240)</text><text x="56" y="208" font-size="19" fill="#162235" font-weight="400" text-anchor="start">Z = 2.0 m；fx = fy = 500 px</text><text x="56" y="237" font-size="19" fill="#162235" font-weight="400" text-anchor="start">主点 (cx,cy) = (320,240)</text><text x="56" y="266" font-size="19" fill="#162235" font-weight="400" text-anchor="start">相机点 pC = (0.20,0,2.0) m</text><rect x="485" y="115" width="340" height="172" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="501" y="147" font-size="22" fill="#162235" font-weight="700" text-anchor="start">使用 t₀ 的相机姿态</text><text x="501" y="179" font-size="19" fill="#162235" font-weight="400" text-anchor="start">RMC：相机轴转成地图轴</text><text x="501" y="208" font-size="19" fill="#162235" font-weight="400" text-anchor="start">tMC = (1.0,0.5,0.8) m</text><text x="501" y="237" font-size="19" fill="#162235" font-weight="400" text-anchor="start">pM = RMC pC + tMC</text><text x="501" y="266" font-size="19" fill="#162235" font-weight="400" text-anchor="start">结果 pM = (3.0,0.3,0.8) m</text><path d="M390,201 L475,201" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><text x="432.5" y="189.0" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">几何链</text><rect x="910" y="115" width="330" height="172" rx="10" fill="#fff5e8" stroke="#9aacbc" stroke-width="1.5"/><text x="926" y="147" font-size="22" fill="#162235" font-weight="700" text-anchor="start">t₁ = 10.10 s 再使用</text><text x="926" y="179" font-size="19" fill="#162235" font-weight="400" text-anchor="start">机器人沿地图 x 前进 0.1 m</text><text x="926" y="208" font-size="19" fill="#162235" font-weight="400" text-anchor="start">静止杯子的 pM 不变</text><text x="926" y="237" font-size="19" fill="#162235" font-weight="400" text-anchor="start">新的基座相对位置应重算</text><text x="926" y="266" font-size="19" fill="#162235" font-weight="400" text-anchor="start">不能把旧相机点当当前点</text><path d="M825,201 L900,201" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M105,438 L1168,438" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><text x="105" y="414" font-size="21" fill="#162235" font-weight="400" text-anchor="start">10.00 s</text><text x="575" y="414" font-size="21" fill="#162235" font-weight="400" text-anchor="start">10.05 s</text><text x="1050" y="414" font-size="21" fill="#162235" font-weight="400" text-anchor="start">10.10 s</text><circle cx="110" cy="438" r="6" fill="#2563eb"/><text x="110" y="482" font-size="20" fill="#162235" font-weight="400" text-anchor="middle">图像采集</text><circle cx="600" cy="438" r="6" fill="#2563eb"/><text x="600" y="482" font-size="20" fill="#162235" font-weight="400" text-anchor="middle">网络计算结束</text><circle cx="1120" cy="438" r="6" fill="#2563eb"/><text x="1120" y="482" font-size="20" fill="#162235" font-weight="400" text-anchor="middle">控制读取</text><rect x="90" y="536" width="1090" height="108" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="106" y="568" font-size="22" fill="#162235" font-weight="700" text-anchor="start">时间检查也影响安全</text><text x="106" y="600" font-size="19" fill="#162235" font-weight="400" text-anchor="start">延迟 = 0.10 s；若相对速度为 1 m/s，仅时间错配就能产生约 0.10 m 的位置误差</text></g></svg>