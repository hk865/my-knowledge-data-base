<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker></defs><rect width="1280" height="650" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#162235"><text x="42" y="45" font-size="28" fill="#162235" font-weight="700" text-anchor="start">图 3  监督分割的损失和梯度在哪条链上</text><rect x="42" y="115" width="230" height="120" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="147" font-size="22" fill="#162235" font-weight="700" text-anchor="start">训练图像 I</text><text x="58" y="179" font-size="19" fill="#162235" font-weight="400" text-anchor="start">例如：480 × 640 × 3</text><rect x="340" y="115" width="245" height="120" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="356" y="147" font-size="22" fill="#162235" font-weight="700" text-anchor="start">网络 fθ</text><text x="356" y="179" font-size="19" fill="#162235" font-weight="400" text-anchor="start">共享编码器 + 像素头</text><rect x="653" y="115" width="250" height="120" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="669" y="147" font-size="22" fill="#162235" font-weight="700" text-anchor="start">像素概率 pθ</text><text x="669" y="179" font-size="19" fill="#162235" font-weight="400" text-anchor="start">每个像素 C 个类别</text><rect x="970" y="115" width="265" height="120" rx="10" fill="#fff0e5" stroke="#9aacbc" stroke-width="1.5"/><text x="986" y="147" font-size="22" fill="#162235" font-weight="700" text-anchor="start">分割损失 Lseg</text><text x="986" y="179" font-size="19" fill="#162235" font-weight="400" text-anchor="start">与逐像素真值 y 比较</text><path d="M272,174 L330,174" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M585,174 L643,174" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M903,174 L960,174" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="970" y="310" width="265" height="116" rx="10" fill="#f1f5f9" stroke="#9aacbc" stroke-width="1.5"/><text x="986" y="342" font-size="22" fill="#162235" font-weight="700" text-anchor="start">人工标注 y</text><text x="986" y="374" font-size="19" fill="#162235" font-weight="400" text-anchor="start">例：此像素是杯子</text><path d="M1103,310 L1103,245" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M970,267 L790,267" fill="none" stroke="#c2410c" stroke-width="2.3" marker-end="url(#r)" /><text x="880.0" y="255.0" font-size="18" fill="#c2410c" font-weight="400" text-anchor="middle">∂L / ∂logits</text><path d="M755,290 L482,290" fill="none" stroke="#c2410c" stroke-width="2.3" marker-end="url(#r)" /><text x="618.5" y="278.0" font-size="18" fill="#c2410c" font-weight="400" text-anchor="middle">链式法则 → ∂L / ∂θ</text><rect x="340" y="355" width="420" height="120" rx="10" fill="#fff0e5" stroke="#9aacbc" stroke-width="1.5"/><text x="356" y="387" font-size="22" fill="#162235" font-weight="700" text-anchor="start">参数更新</text><text x="356" y="419" font-size="19" fill="#162235" font-weight="400" text-anchor="start">θ ← θ − η ∇θ L</text><text x="356" y="448" font-size="19" fill="#162235" font-weight="400" text-anchor="start">只更新参与此损失的可训练参数</text><path d="M482,310 L482,345" fill="none" stroke="#c2410c" stroke-width="2.3" marker-end="url(#r)" /><path d="M340,412 L310,412" fill="none" stroke="#c2410c" stroke-width="2.3" marker-end="url(#r)" /><path d="M310,412 L310,85 L465,85" fill="none" stroke="#c2410c" stroke-width="3" /><path d="M465,85 L465,105" fill="none" stroke="#c2410c" stroke-width="2.3" marker-end="url(#r)" /><text x="42" y="548" font-size="22" fill="#162235" font-weight="700" text-anchor="start">推理阶段：I → fθ → 概率/掩码；通常没有 y、没有损失、没有这条橙色反传线</text><text x="42" y="591" font-size="21" fill="#162235" font-weight="400" text-anchor="start">标定 K、外参 T 和离散目标关联默认不由这个分割损失更新</text></g></svg>