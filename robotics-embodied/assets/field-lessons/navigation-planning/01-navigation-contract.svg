<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker></defs><rect width="1280" height="720" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#162235"><text x="42" y="45" font-size="28" fill="#162235" font-weight="700" text-anchor="start">图 1  从语言目标到真实移动的接口链</text><rect x="42" y="110" width="260" height="150" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="142" font-size="22" fill="#162235" font-weight="700" text-anchor="start">语义任务</text><text x="58" y="174" font-size="19" fill="#162235" font-weight="400" text-anchor="start">“去厨房的桌边”</text><text x="58" y="203" font-size="19" fill="#162235" font-weight="400" text-anchor="start">地图区域/对象查询</text><text x="58" y="232" font-size="19" fill="#162235" font-weight="400" text-anchor="start">可能需要先搜索</text><rect x="365" y="110" width="260" height="150" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="381" y="142" font-size="22" fill="#162235" font-weight="700" text-anchor="start">几何目标集合</text><text x="381" y="174" font-size="19" fill="#162235" font-weight="400" text-anchor="start">地图系位置与朝向</text><text x="381" y="203" font-size="19" fill="#162235" font-weight="400" text-anchor="start">可停车 + 可观察</text><text x="381" y="232" font-size="19" fill="#162235" font-weight="400" text-anchor="start">终止条件和误差容限</text><rect x="690" y="110" width="260" height="150" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="706" y="142" font-size="22" fill="#162235" font-weight="700" text-anchor="start">全局规划</text><text x="706" y="174" font-size="19" fill="#162235" font-weight="400" text-anchor="start">输入：当前位置、地图</text><text x="706" y="203" font-size="19" fill="#162235" font-weight="400" text-anchor="start">搜索/采样/优化</text><text x="706" y="232" font-size="19" fill="#162235" font-weight="400" text-anchor="start">输出：路径或轨迹</text><path d="M302,185 L355,185" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M625,185 L680,185" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="690" y="370" width="260" height="170" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="706" y="402" font-size="22" fill="#162235" font-weight="700" text-anchor="start">局部规划与控制</text><text x="706" y="434" font-size="19" fill="#162235" font-weight="400" text-anchor="start">新障碍 + 当前状态</text><text x="706" y="463" font-size="19" fill="#162235" font-weight="400" text-anchor="start">运动模型预测短期结果</text><text x="706" y="492" font-size="19" fill="#162235" font-weight="400" text-anchor="start">选当前速度 v、ω</text><text x="706" y="521" font-size="19" fill="#162235" font-weight="400" text-anchor="start">检查可行性与制动</text><rect x="365" y="370" width="260" height="170" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="381" y="402" font-size="22" fill="#162235" font-weight="700" text-anchor="start">底层驱动执行</text><text x="381" y="434" font-size="19" fill="#162235" font-weight="400" text-anchor="start">左右轮速度/转矩</text><text x="381" y="463" font-size="19" fill="#162235" font-weight="400" text-anchor="start">编码器反馈</text><text x="381" y="492" font-size="19" fill="#162235" font-weight="400" text-anchor="start">实际运动未必等于指令</text><rect x="42" y="370" width="260" height="170" rx="10" fill="#fff5e8" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="402" font-size="22" fill="#162235" font-weight="700" text-anchor="start">观察执行结果</text><text x="58" y="434" font-size="19" fill="#162235" font-weight="400" text-anchor="start">更新位姿与障碍物</text><text x="58" y="463" font-size="19" fill="#162235" font-weight="400" text-anchor="start">验证是否到达目标</text><text x="58" y="492" font-size="19" fill="#162235" font-weight="400" text-anchor="start">堵路则等待/改道</text><text x="58" y="521" font-size="19" fill="#162235" font-weight="400" text-anchor="start">定位失效则暂停</text><path d="M820,260 L820,360" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M690,455 L635,455" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M365,455 L312,455" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M170,540 L170,605 L1015,605 L1015,455 L960,455" fill="none" stroke="#334155" stroke-width="3" /><path d="M980,455 L960,455" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><text x="1010" y="135" font-size="19" fill="#162235" font-weight="400" text-anchor="start">路径：只说经过哪里</text><text x="1010" y="166" font-size="19" fill="#162235" font-weight="400" text-anchor="start"></text><text x="1010" y="197" font-size="19" fill="#162235" font-weight="400" text-anchor="start">轨迹：还说何时到达</text><text x="1010" y="228" font-size="19" fill="#162235" font-weight="400" text-anchor="start"></text><text x="1010" y="259" font-size="19" fill="#162235" font-weight="400" text-anchor="start">控制：此刻怎么驱动</text><text x="1010" y="290" font-size="19" fill="#162235" font-weight="400" text-anchor="start"></text><text x="1010" y="321" font-size="19" fill="#162235" font-weight="400" text-anchor="start">完成：需要再次验证</text><text x="42" y="665" font-size="22" fill="#162235" font-weight="700" text-anchor="start">数据契约贯穿全链：坐标系、时间、单位、本体尺寸、运动约束、成功/失败条件</text></g></svg>