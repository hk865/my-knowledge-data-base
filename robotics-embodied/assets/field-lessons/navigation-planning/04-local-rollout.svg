<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker></defs><rect width="1280" height="760" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#162235"><text x="42" y="45" font-size="28" fill="#162235" font-weight="700" text-anchor="start">图 4  局部控制先预测候选 再只执行第一小步</text><circle cx="120" cy="360" r="24" fill="#dbeafe"/><text x="55" y="405" font-size="20" fill="#162235" font-weight="400" text-anchor="start">当前机器人</text><rect x="550" y="285" width="100" height="145" rx="8" fill="#64748b"/><text x="550" y="470" font-size="20" fill="#162235" font-weight="400" text-anchor="start">障碍物</text><path d="M145,360 L650,360" fill="none" stroke="#c2410c" stroke-width="4" /><text x="300" y="335" font-size="21" fill="#c2410c" font-weight="400" text-anchor="start">A：碰撞 → 剔除</text><path d="M145,350 C290,195 435,180 550,215 C655,250 705,260 755,250" fill="none" stroke="#15803d" stroke-width="4" /><text x="230" y="160" font-size="21" fill="#15803d" font-weight="400" text-anchor="start">B：可行，归一化代价 1.9</text><path d="M145,375 C295,550 470,605 635,555 C700,535 740,500 760,470" fill="none" stroke="#2563eb" stroke-width="4" /><text x="270" y="610" font-size="21" fill="#2563eb" font-weight="400" text-anchor="start">C：可行，归一化代价 2.4</text><rect x="850" y="105" width="380" height="165" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="866" y="137" font-size="22" fill="#162235" font-weight="700" text-anchor="start">控制候选必须可到达</text><text x="866" y="169" font-size="19" fill="#162235" font-weight="400" text-anchor="start">速度/角速度边界</text><text x="866" y="198" font-size="19" fill="#162235" font-weight="400" text-anchor="start">加速度限制</text><text x="866" y="227" font-size="19" fill="#162235" font-weight="400" text-anchor="start">本体足迹不碰撞</text><text x="866" y="256" font-size="19" fill="#162235" font-weight="400" text-anchor="start">必要制动余量</text><rect x="850" y="325" width="380" height="140" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="866" y="357" font-size="22" fill="#162235" font-weight="700" text-anchor="start">选择 B 的第一步</text><text x="866" y="389" font-size="19" fill="#162235" font-weight="400" text-anchor="start">只执行 u₀=(v₀,ω₀)</text><text x="866" y="418" font-size="19" fill="#162235" font-weight="400" text-anchor="start">不是盲目执行整段预测</text><text x="866" y="447" font-size="19" fill="#162235" font-weight="400" text-anchor="start">如 Δt=0.1 s 后重新观察</text><path d="M1040,270 L1040,315" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="850" y="520" width="380" height="140" rx="10" fill="#fff5e8" stroke="#9aacbc" stroke-width="1.5"/><text x="866" y="552" font-size="22" fill="#162235" font-weight="700" text-anchor="start">下一轮重新计算</text><text x="866" y="584" font-size="19" fill="#162235" font-weight="400" text-anchor="start">新状态、新障碍、新时刻</text><text x="866" y="613" font-size="19" fill="#162235" font-weight="400" text-anchor="start">重新滚动预测</text><text x="866" y="642" font-size="19" fill="#162235" font-weight="400" text-anchor="start">旧的候选可以全部改变</text><path d="M1040,465 L1040,510" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><text x="42" y="715" font-size="21" fill="#162235" font-weight="700" text-anchor="start">碰撞是可行性约束；进度、贴近路线、平滑等在可行候选之间比较。示意曲线非实测轨迹。</text></g></svg>