<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker></defs><rect width="1280" height="730" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#162235"><text x="42" y="45" font-size="28" fill="#162235" font-weight="700" text-anchor="start">图 3  RRT* 扩展新节点后怎样重选连接</text><path d="M100,420 L285,215 L615,270 L725,110" fill="none" stroke="#64748b" stroke-width="3" /><path d="M100,420 L410,440" fill="none" stroke="#334155" stroke-width="3" /><path d="M285,215 L615,270" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="7 5"/><path d="M420,429 L596,286" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><text x="508.0" y="345.5" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">新边 1.1</text><circle cx="100" cy="420" r="20" fill="#dbeafe"/><text x="100" y="427" font-size="19" fill="#162235" font-weight="400" text-anchor="middle">起点</text><circle cx="285" cy="215" r="20" fill="#dbeafe"/><text x="285" y="222" font-size="19" fill="#162235" font-weight="400" text-anchor="middle">a</text><circle cx="410" cy="440" r="20" fill="#bbf7d0"/><text x="410" y="447" font-size="19" fill="#162235" font-weight="400" text-anchor="middle">n</text><circle cx="615" cy="270" r="20" fill="#dbeafe"/><text x="615" y="277" font-size="19" fill="#162235" font-weight="400" text-anchor="middle">q</text><circle cx="725" cy="110" r="20" fill="#dbeafe"/><text x="725" y="117" font-size="19" fill="#162235" font-weight="400" text-anchor="middle">r</text><text x="235" y="166" font-size="20" fill="#162235" font-weight="400" text-anchor="start">g(a)=4.0</text><text x="390" y="490" font-size="20" fill="#162235" font-weight="400" text-anchor="start">g(n)=5.2</text><text x="565" y="370" font-size="21" fill="#162235" font-weight="700" text-anchor="start">g(q): 7.0 → 6.3</text><text x="660" y="72" font-size="20" fill="#162235" font-weight="400" text-anchor="start">g(r): 8.0 → 7.3</text><rect x="850" y="95" width="380" height="170" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="866" y="127" font-size="22" fill="#162235" font-weight="700" text-anchor="start">先得到新节点 n</text><text x="866" y="159" font-size="19" fill="#162235" font-weight="400" text-anchor="start">采样 q_rand</text><text x="866" y="188" font-size="19" fill="#162235" font-weight="400" text-anchor="start">找附近节点并尝试延伸</text><text x="866" y="217" font-size="19" fill="#162235" font-weight="400" text-anchor="start">检查整条边碰撞</text><text x="866" y="246" font-size="19" fill="#162235" font-weight="400" text-anchor="start">从可行邻居选总代价最小的父节点</text><rect x="850" y="330" width="380" height="175" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="866" y="362" font-size="22" fill="#162235" font-weight="700" text-anchor="start">再尝试重连旧节点 q</text><text x="866" y="394" font-size="19" fill="#162235" font-weight="400" text-anchor="start">新路线总代价 = 5.2 + 1.1</text><text x="866" y="423" font-size="19" fill="#162235" font-weight="400" text-anchor="start">6.3 &lt; 原来的 7.0</text><text x="866" y="452" font-size="19" fill="#162235" font-weight="400" text-anchor="start">改 q 的父节点为 n</text><text x="866" y="481" font-size="19" fill="#162235" font-weight="400" text-anchor="start">同步更新后代 r 的累计代价</text><path d="M1040,265 L1040,320" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="45" y="555" width="1185" height="120" rx="10" fill="#f1f5f9" stroke="#9aacbc" stroke-width="1.5"/><text x="61" y="587" font-size="22" fill="#162235" font-weight="700" text-anchor="start">树在变好 网络没有因此被训练</text><text x="61" y="619" font-size="19" fill="#162235" font-weight="400" text-anc