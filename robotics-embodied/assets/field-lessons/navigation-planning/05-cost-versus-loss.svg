<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker></defs><rect width="1280" height="730" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#162235"><text x="42" y="45" font-size="28" fill="#162235" font-weight="700" text-anchor="start">图 5  导航代价和学习损失更新的是不同对象</text><text x="42" y="100" font-size="24" fill="#162235" font-weight="700" text-anchor="start">离线监督训练：从示范学一个条件策略</text><rect x="42" y="140" width="250" height="135" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="172" font-size="22" fill="#162235" font-weight="700" text-anchor="start">训练样本</text><text x="58" y="204" font-size="19" fill="#162235" font-weight="400" text-anchor="start">图像 o、语言 ℓ</text><text x="58" y="233" font-size="19" fill="#162235" font-weight="400" text-anchor="start">历史 h、专家动作 a*</text><rect x="355" y="140" width="250" height="135" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="371" y="172" font-size="22" fill="#162235" font-weight="700" text-anchor="start">可训练策略 πθ</text><text x="371" y="204" font-size="19" fill="#162235" font-weight="400" text-anchor="start">动作概率 πθ(a|o,ℓ,h)</text><text x="371" y="233" font-size="19" fill="#162235" font-weight="400" text-anchor="start">θ 是共享网络权重</text><rect x="670" y="140" width="255" height="135" rx="10" fill="#fff0e5" stroke="#9aacbc" stroke-width="1.5"/><text x="686" y="172" font-size="22" fill="#162235" font-weight="700" text-anchor="start">交叉熵损失</text><text x="686" y="204" font-size="19" fill="#162235" font-weight="400" text-anchor="start">L = −log πθ(a*|o,ℓ,h)</text><text x="686" y="233" font-size="19" fill="#162235" font-weight="400" text-anchor="start">与专家动作比较</text><rect x="990" y="140" width="250" height="135" rx="10" fill="#fff0e5" stroke="#9aacbc" stroke-width="1.5"/><text x="1006" y="172" font-size="22" fill="#162235" font-weight="700" text-anchor="start">更新参数</text><text x="1006" y="204" font-size="19" fill="#162235" font-weight="400" text-anchor="start">θ ← θ − η∇θL</text><text x="1006" y="233" font-size="19" fill="#162235" font-weight="400" text-anchor="start">影响之后许多任务</text><path d="M292,205 L345,205" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M605,205 L660,205" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M925,205 L980,205" fill="none" stroke="#c2410c" stroke-width="2.3" marker-end="url(#r)" /><path d="M1110,275 L1110,322 L480,322" fill="none" stroke="#c2410c" stroke-width="3" /><path d="M480,322 L480,285" fill="none" stroke="#c2410c" stroke-width="2.3" marker-end="url(#r)" /><text x="42" y="405" font-size="24" fill="#162235" font-weight="700" text-anchor="start">在线局部规划：为此刻选择可执行动作</text><rect x="42" y="445" width="250" height="135" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="477" font-size="22" fill="#162235" font-weight="700" text-anchor="start">当前状态与地图</text><text x="58" y="509" font-size="19" fill="#162235" font-weight="400" text-anchor="start">机器人位置、速度</text><text x="58" y="538" font-size="19" fill="#162235" font-weight="400" text-anchor="start">障碍与路径参照</text><rect x="355" y="445" width="250" height="135" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="371" y="477" font-size="22" fill="#162235" font-weight="700" text-anchor="start">候选控制序列 U</text><text x="371" y="509" font-size="19" fill="#162235" font-weight="400" text-anchor="start">运动模型前向预测</text><text x="371" y="538" font-size="19" fill="#162235" font-weight="400" text-anchor="start">生成短期状态轨迹</text><rect x="670" y="445" width="255" height="135" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="686" y="477" font-size="22" fill="#162235" font-weight="700" text-anchor="start">规划代价 J(U)</text><text x="686" y="509" font-size="19" fill="#162235" font-weight="400" text-anchor="start">先满足硬约束</text><text x="686" y="538" font-size="19" fill="#162235" font-weight="400" text-anchor="start">再比较路线与平滑性</text><rect x="990" y="445" width="250" height="135" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="1006" y="477" font-size="22" fill="#162235" font-weight="700" text-anchor="start">选中并执行</text><text x="1006" y="509" font-size="19" fill="#162235" font-weight="400" text-anchor="start">U* = argmin J(U)</text><text x="1006" y="538" font-size="19" fill="#162235" font-weight="400" text-anchor="start">只执行第一步</text><path d="M292,510 L345,510" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M605,510 L660,510" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M925,510 L980,510" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><text x="42" y="658" font-size="23" fill="#162235" font-weight="700" text-anchor="start">下排更新当前候选、轨迹和动作；即便用梯度优化 U，也不等于上排训练 θ</text></g></svg>