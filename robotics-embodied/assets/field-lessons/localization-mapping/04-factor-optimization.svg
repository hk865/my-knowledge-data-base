<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker></defs><rect width="1280" height="740" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#162235"><text x="42" y="45" font-size="28" fill="#162235" font-weight="700" text-anchor="start">图 4  图优化把多个时刻的解释一起调整</text><circle cx="120" cy="240" r="42" fill="#dbeafe"/><text x="120" y="248" font-size="26" fill="#162235" font-weight="400" text-anchor="middle">T₀</text><circle cx="410" cy="240" r="42" fill="#dbeafe"/><text x="410" y="248" font-size="26" fill="#162235" font-weight="400" text-anchor="middle">T₁</text><circle cx="700" cy="240" r="42" fill="#dbeafe"/><text x="700" y="248" font-size="26" fill="#162235" font-weight="400" text-anchor="middle">T₂</text><rect x="253" y="228" width="24" height="24" fill="#64748b"/><path d="M162,240 L253,240 M277,240 L368,240" fill="none" stroke="#334155" stroke-width="3" /><text x="265" y="200" font-size="20" fill="#162235" font-weight="400" text-anchor="middle">相邻运动</text><rect x="543" y="228" width="24" height="24" fill="#64748b"/><path d="M452,240 L543,240 M567,240 L658,240" fill="none" stroke="#334155" stroke-width="3" /><text x="555" y="200" font-size="20" fill="#162235" font-weight="400" text-anchor="middle">相邻运动</text><circle cx="410" cy="90" r="27" fill="#bbf7d0"/><text x="410" y="98" font-size="22" fill="#162235" font-weight="400" text-anchor="middle">m</text><path d="M145,205 L390,103 M410,198 L410,117 M675,205 L433,103" fill="none" stroke="#15803d" stroke-width="2" /><text x="472" y="95" font-size="20" fill="#162235" font-weight="400" text-anchor="start">同一地图点 m 的多次观测</text><path d="M120,282 L120,350 L700,350 L700,282" fill="none" stroke="#c2410c" stroke-width="3" /><text x="410" y="387" font-size="20" fill="#c2410c" font-weight="400" text-anchor="middle">回环：较早与较晚位姿间的新约束</text><text x="46" y="438" font-size="19" fill="#162235" font-weight="400" text-anchor="start">圆：待估计变量；方块/连线：测量关系</text><rect x="855" y="90" width="375" height="140" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="871" y="122" font-size="22" fill="#162235" font-weight="700" text-anchor="start">构造残差 r(X)</text><text x="871" y="154" font-size="19" fill="#162235" font-weight="400" text-anchor="start">X 包含选中的位姿和地图点</text><text x="871" y="183" font-size="19" fill="#162235" font-weight="400" text-anchor="start">预测测量 − 实际测量</text><text x="871" y="212" font-size="19" fill="#162235" font-weight="400" text-anchor="start">按协方差加权</text><rect x="855" y="305" width="375" height="140" rx="10" fill="#fff5e8" stroke="#9aacbc" stroke-width="1.5"/><text x="871" y="337" font-size="22" fill="#162235" font-weight="700" text-anchor="start">线性化并求增量</text><text x="871" y="369" font-size="19" fill="#162235" font-weight="400" text-anchor="start">r(X ⊕ Δ) ≈ r(X) + JΔ</text><text x="871" y="398" font-size="19" fill="#162235" font-weight="400" text-anchor="start">解加权最小二乘</text><text x="871" y="427" font-size="19" fill="#162235" font-weight="400" text-anchor="start">Δ 是状态改变量</text><path d="M1040,230 L1040,295" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="855" y="520" width="375" height="140" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="871" y="552" font-size="22" fill="#162235" font-weight="700" text-anchor="start">更新当前轨迹/地图</text><text x="871" y="584" font-size="19" fill="#162235" font-weight="400" text-anchor="start">X ← X ⊕ Δ</text><text x="871" y="613" font-size="19" fill="#162235" font-weight="400" text-anchor="start">重新投影、重新求残差</text><text x="871" y="642" font-size="19" fill="#162235" font-weight="400" text-anchor="start">必要时继续迭代</text><path d="M1040,445 L1040,510" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="45" y="505" width="715" height="155" rx="10" fill="#f1f5f9" stroke="#9aacbc" stroke-width="1.5"/><text x="61" y="537" font-size="22" fill="#162235" font-weight="700" text-anchor="start">本图中的优化对象</text><text x="61" y="569" font-size="19" fill="#162235" font-weight="400" text-anchor="start">T₀、T₁、T₂：不同时刻的相机/机器人位姿</text><text x="61" y="598" font-size="19" fill="#162235" font-weight="400" text-anchor="start">m：当前环境的地图点</text><text x="61" y="627" font-size="19" fill="#162235" font-weight="400" text-anchor="start">即使用导数求解，也没有因此训练视觉网络</text></g></svg>