<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker></defs><rect width="1280" height="670" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#162235"><text x="42" y="45" font-size="28" fill="#162235" font-weight="700" text-anchor="start">图 1  定位滤波是预测与观测修正的循环</text><rect x="42" y="100" width="250" height="155" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="132" font-size="22" fill="#162235" font-weight="700" text-anchor="start">上一次估计</text><text x="58" y="164" font-size="19" fill="#162235" font-weight="400" text-anchor="start">状态 x⁺：位置/速度等</text><text x="58" y="193" font-size="19" fill="#162235" font-weight="400" text-anchor="start">协方差 P⁺：误差大小</text><text x="58" y="222" font-size="19" fill="#162235" font-weight="400" text-anchor="start">带坐标系和时间 t</text><rect x="365" y="100" width="260" height="155" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="381" y="132" font-size="22" fill="#162235" font-weight="700" text-anchor="start">运动预测</text><text x="381" y="164" font-size="19" fill="#162235" font-weight="400" text-anchor="start">运动输入 u、时间差 Δt</text><text x="381" y="193" font-size="19" fill="#162235" font-weight="400" text-anchor="start">x⁻ = f(x⁺,u)</text><text x="381" y="222" font-size="19" fill="#162235" font-weight="400" text-anchor="start">P⁻ = F P⁺ Fᵀ + Q</text><rect x="715" y="100" width="285" height="155" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="731" y="132" font-size="22" fill="#162235" font-weight="700" text-anchor="start">预测观测</text><text x="731" y="164" font-size="19" fill="#162235" font-weight="400" text-anchor="start">当前观测模型 h</text><text x="731" y="193" font-size="19" fill="#162235" font-weight="400" text-anchor="start">ẑ = h(x⁻)</text><text x="731" y="222" font-size="19" fill="#162235" font-weight="400" text-anchor="start">把状态变成传感器读数</text><path d="M292,175 L355,175" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M625,175 L705,175" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="715" y="350" width="285" height="155" rx="10" fill="#fff5e8" stroke="#9aacbc" stroke-width="1.5"/><text x="731" y="382" font-size="22" fill="#162235" font-weight="700" text-anchor="start">观测创新</text><text x="731" y="414" font-size="19" fill="#162235" font-weight="400" text-anchor="start">新测量 z 与噪声 Rz</text><text x="731" y="443" font-size="19" fill="#162235" font-weight="400" text-anchor="start">ν = z − ẑ</text><text x="731" y="472" font-size="19" fill="#162235" font-weight="400" text-anchor="start">检查是否匹配/是否异常</text><path d="M855,255 L855,340" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="365" y="350" width="260" height="155" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="381" y="382" font-size="22" fill="#162235" font-weight="700" text-anchor="start">计算修正</text><text x="381" y="414" font-size="19" fill="#162235" font-weight="400" text-anchor="start">S = H P⁻ Hᵀ + Rz</text><text x="381" y="443" font-size="19" fill="#162235" font-weight="400" text-anchor="start">K = P⁻ Hᵀ S⁻¹</text><text x="381" y="472" font-size="19" fill="#162235" font-weight="400" text-anchor="start">Δx = Kν</text><rect x="42" y="350" width="250" height="155" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="382" font-size="22" fill="#162235" font-weight="700" text-anchor="start">更新后的估计</text><text x="58" y="414" font-size="19" fill="#162235" font-weight="400" text-anchor="start">x⁺ = x⁻ + Δx</text><text x="58" y="443" font-size="19" fill="#162235" font-weight="400" text-anchor="start">P⁺ 也随信息更新</text><text x="58" y="472" font-size="19" fill="#162235" font-weight="400" text-anchor="start">输出给导航/感知</text><path d="M715,425 L635,425" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M365,425 L302,425" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M165,350 L165,265" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><text x="1040" y="140" font-size="19" fill="#162235" font-weight="400" text-anchor="start">⁻：还未用新测量</text><text x="1040" y="177" font-size="19" fill="#162235" font-weight="400" text-anchor="start">⁺：已吸收新测量</text><text x="1040" y="214" font-size="19" fill="#162235" font-weight="400" text-anchor="start"></text><text x="1040" y="251" font-size="19" fill="#162235" font-weight="400" text-anchor="start">ν 是观测差值</text><text x="1040" y="288" font-size="19" fill="#162235" font-weight="400" text-anchor="start">不一定与 x 同维</text><text x="1040" y="325" font-size="19" fill="#162235" font-weight="400" text-anchor="start"></text><text x="1040" y="362" font-size="19" fill="#162235" font-weight="400" text-anchor="start">循环更新的是状态</text><text x="1040" y="399" font-size="19" fill="#162235" font-weight="400" text-anchor="start">不是神经网络权重</text><text x="42" y="593" font-size="22" fill="#162235" font-weight="700" text-anchor="start">Q 表示预测期间新增的不确定性；Rz 表示当前测量噪声；两者都需要合理建模</text></g></svg>