<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker></defs><rect width="1280" height="750" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#162235"><text x="42" y="45" font-size="28" fill="#162235" font-weight="700" text-anchor="start">图 3  误差状态滤波中的两种状态和一次注入</text><rect x="42" y="105" width="350" height="210" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="137" font-size="22" fill="#162235" font-weight="700" text-anchor="start">名义状态 x̂</text><text x="58" y="169" font-size="19" fill="#162235" font-weight="400" text-anchor="start">位置 p̂、速度 v̂</text><text x="58" y="198" font-size="19" fill="#162235" font-weight="400" text-anchor="start">姿态 R̂：合法旋转矩阵</text><text x="58" y="227" font-size="19" fill="#162235" font-weight="400" text-anchor="start">加计零偏 b̂a、陀螺零偏 b̂g</text><text x="58" y="256" font-size="19" fill="#162235" font-weight="400" text-anchor="start">IMU 推进大部分运动</text><text x="58" y="285" font-size="19" fill="#162235" font-weight="400" text-anchor="start">世界重力 g 在本文视为已知</text><rect x="467" y="105" width="345" height="210" rx="10" fill="#eaf2fa" stroke="#9aacbc" stroke-width="1.5"/><text x="483" y="137" font-size="22" fill="#162235" font-weight="700" text-anchor="start">小误差 δx</text><text x="483" y="169" font-size="19" fill="#162235" font-weight="400" text-anchor="start">δp、δv、δθ、δba、δbg</text><text x="483" y="198" font-size="19" fill="#162235" font-weight="400" text-anchor="start">共 15 个局部误差分量</text><text x="483" y="227" font-size="19" fill="#162235" font-weight="400" text-anchor="start">姿态误差 δθ 用弧度</text><text x="483" y="256" font-size="19" fill="#162235" font-weight="400" text-anchor="start">协方差 P 描述这些误差</text><text x="483" y="285" font-size="19" fill="#162235" font-weight="400" text-anchor="start">P⁻ = F P Fᵀ + Q</text><path d="M392,205 L457,205" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><text x="424.5" y="193.0" font-size="18" fill="#334155" font-weight="400" text-anchor="middle">线性化</text><rect x="887" y="105" width="350" height="210" rx="10" fill="#fff5e8" stroke="#9aacbc" stroke-width="1.5"/><text x="903" y="137" font-size="22" fill="#162235" font-weight="700" text-anchor="start">新观测到来</text><text x="903" y="169" font-size="19" fill="#162235" font-weight="400" text-anchor="start">ν = z − h(x̂⁻)</text><text x="903" y="198" font-size="19" fill="#162235" font-weight="400" text-anchor="start">H：观测对小误差的导数</text><text x="903" y="227" font-size="19" fill="#162235" font-weight="400" text-anchor="start">K：按误差与噪声加权</text><text x="903" y="256" font-size="19" fill="#162235" font-weight="400" text-anchor="start">δx̂ = Kν</text><text x="903" y="285" font-size="19" fill="#162235" font-weight="400" text-anchor="start">先得到小修正量</text><path d="M812,205 L877,205" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="690" y="415" width="547" height="185" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="706" y="447" font-size="22" fill="#162235" font-weight="700" text-anchor="start">把误差注入名义状态</text><text x="706" y="479" font-size="19" fill="#162235" font-weight="400" text-anchor="start">位置：p̂ ← p̂ + δp̂</text><text x="706" y="508" font-size="19" fill="#162235" font-weight="400" text-anchor="start">姿态：R̂ ← R̂ Exp([δθ̂]×)</text><text x="706" y="537" font-size="19" fill="#162235" font-weight="400" text-anchor="start">零偏：b̂ ← b̂ + δb̂</text><text x="706" y="566" font-size="19" fill="#162235" font-weight="400" text-anchor="start">旋转通过组合更新，不能逐元素乱加</text><path d="M1060,315 L1060,405" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><rect x="42" y="415" width="545" height="185" rx="10" fill="#eaf8ef" stroke="#9aacbc" stroke-width="1.5"/><text x="58" y="447" font-size="22" fill="#162235" font-weight="700" text-anchor="start">重置误差坐标</text><text x="58" y="479" font-size="19" fill="#162235" font-weight="400" text-anchor="start">δx̂ ← 0；名义状态已经吸收了修正</text><text x="58" y="508" font-size="19" fill="#162235" font-weight="400" text-anchor="start">P ← Greset P Gresetᵀ</text><text x="58" y="537" font-size="19" fill="#162235" font-weight="400" text-anchor="start">保留剩余不确定性，不把 P 清零</text><text x="58" y="566" font-size="19" fill="#162235" font-weight="400" text-anchor="start">下一轮围绕新的名义状态估计小误差</text><path d="M690,505 L597,505" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><path d="M210,415 L210,325" fill="none" stroke="#334155" stroke-width="2.3" marker-end="url(#a)" /><text x="42" y="690" font-size="22" fill="#162235" font-weight="700" text-anchor="start">本文采用右乘/局部旋转误差：R真实 = R̂ Exp([δθ]×)；不能混用左乘公式</text></g></svg>