<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><rect width="100%" height="100%" fill="#f7fafc"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#496780"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#19344c}.t{font-size:25px;font-weight:700}.b{font-size:18px}</style><text x="40" y="48" class="t">具身 Agent 的一轮闭环</text><rect x="40" y="85" width="425" height="128" rx="12" fill="white" stroke="#a9c3d6"/><text x="60" y="116" class="t">1 观察与记忆</text><text x="60" y="150" class="b">当前图像和机器人状态</text><text x="60" y="175" class="b">对象位置 时间 来源 任务进度</text><rect x="535" y="85" width="425" height="128" rx="12" fill="white" stroke="#a9c3d6"/><text x="555" y="116" class="t">2 选择与检查</text><text x="555" y="150" class="b">提出下一步技能</text><text x="555" y="175" class="b">检查当前证据和执行条件</text><rect x="535" y="255" width="425" height="128" rx="12" fill="white" stroke="#a9c3d6"/><text x="555" y="286" class="t">3 执行与控制</text><text x="555" y="320" class="b">调用动作策略或传统控制器</text><text x="555" y="345" class="b">执行有边界的一段动作</text><rect x="40" y="255" width="425" height="128" rx="12" fill="white" stroke="#a9c3d6"/><text x="60" y="286" class="t">4 验证与修订</text><text x="60" y="320" class="b">重新观察实际结果</text><text x="60" y="345" class="b">成功推进 失败恢复 未知再观察</text><path d="M470 145 L527 145" fill="none" stroke="#496780" stroke-width="3" marker-end="url(#a)"/><path d="M745 220 L745 245" fill="none" stroke="#496780" stroke-width="3" marker-end="url(#a)"/><path d="M527 317 L473 317" fill="none" stroke="#496780" stroke-width="3" marker-end="url(#a)"/><path d="M248 250 L248 222" fill="none" stroke="#496780" stroke-width="3" marker-end="url(#a)"/><text x="40" y="432" class="b">原创教学图  箭头传递现场证据与执行结果  不是模型对成功的自我复述</text></svg>
