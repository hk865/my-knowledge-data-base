<text x="67" y="602" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#25344a">异常时暂停或恢复</text>
<text x="67" y="634" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#25344a">高层按事件更新</text>
<path d="M520 553 H395" fill="none" stroke="#708499" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="414" y="530" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#53667d">执行</text>
<rect x="520" y="770" width="875" height="116" rx="14" fill="#f0eafa" stroke="#cad5e1" stroke-width="1.5"/>
<text x="542" y="809" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#25344a">新证据与下次决策</text>
<text x="542" y="848" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#25344a">持握是否稳定？目标是否完成？哪些旧条件已失效？</text>
<path d="M215 650 V828 H510" fill="none" stroke="#708499" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="250" y="803" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#53667d">新观察与执行报告</text>
