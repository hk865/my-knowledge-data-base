<text x="1067" y="499" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#25344a">动作模型与候选</text>
<text x="1067" y="538" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#25344a">子目标 + 观察 → A</text>
