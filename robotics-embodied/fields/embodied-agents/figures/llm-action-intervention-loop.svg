<text x="67" y="243" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#25344a">图像、深度、关节读数</text>
<text x="67" y="275" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#25344a">对象ID、标定、时间戳</text>
<text x="67" y="307" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#25344a">历史执行与当前阶段</text>
<rect x="520" y="165" width="390" height="170" rx="14" fill="#f0eafa" stroke="#cad5e1" stroke-width="1.5"/>
<text x="542" y="204" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#25344a">冻结的通用 LLM / VLM</text>
<text x="542" y="243" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#25344a">理解目标与异常</text>
<text x="542" y="275" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#25344a">选择工具、生成约束</text>
<text x="542" y="307" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#25344a">更新上下文，权重不变</text>
<rect x="1045" y="165" width="350" height="170" rx="14" fill="#e8f2ff" stroke="#cad5e1" stroke-width="1.5"/>
<text x="1067" y="204" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#25344a">工具与结构化规格</text>
<text x="1067" y="243" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#25344a">几何、目标、禁入区域</text>
<text x="1067" y="275" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#25344a">评分 / 奖励程序</text>
<text x="1067" y="307" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#25344a">数据来源与单位约定</text>
