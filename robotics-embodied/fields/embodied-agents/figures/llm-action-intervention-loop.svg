<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc"><title id="title">冻结的大模型怎样介入动作闭环</title><desc id="desc">六个模块形成闭环。冻结大模型通过结构化目标和工具调用影响动作候选，工具可提供筛选或采样引导，物理执行后新证据回到高层。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#708499"/></marker></defs>
<rect width="1440" height="940" fill="#fafbfe"/>
