<text x="943" y="530" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#53667d">提案</text>
<rect x="45" y="460" width="340" height="190" rx="14" fill="#fff1dc" stroke="#cad5e1" stroke-width="1.5"/>
<text x="67" y="499" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#25344a">执行有限动作段</text>
<text x="67" y="538" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#25344a">通过检查后进入控制器</text>
