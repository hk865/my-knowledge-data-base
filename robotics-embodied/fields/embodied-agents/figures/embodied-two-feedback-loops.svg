<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">具身 Agent：任务闭环与动作闭环怎样连接</title><desc id="desc">原创接口图：高层选择子任务，中间层检查可行性和证据，底层VLA通过动作队列控制机器人，新观测支撑局部纠正，成功证据支撑高层换任务。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#687d92"/></marker></defs><rect width="100%" height="100%" fill="#fafbfe"/>
<text x="48" y="62" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#24324a">具身 Agent：任务闭环与动作闭环怎样连接</text>
<text x="48" y="111" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#54647b">例：把杯子放进水槽。高层换子任务依据完成证据；底层改动作依据新观测</text>
<rect x="50" y="196" width="390" height="180" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.5"/>
<text x="75" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#24324a">高层：现在做什么</text>
<text x="75" y="287" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">目标、历史、约束</text>
<text x="75" y="322" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">输出：“把杯子放进水槽”</text>
<rect x="565" y="196" width="410" height="180" rx="15" fill="#e7f2ff" stroke="#cbd3df" stroke-width="1.5"/>
<text x="590" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#24324a">接口：此刻能否执行</text>
<text x="590" y="287" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">可行性 / 前置条件</text>
<text x="590" y="322" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">技能调用与终止条件</text>
<rect x="1100" y="196" width="425" height="180" rx="15" fill="#e4f4ee" stroke="#cbd3df" stroke-width="1.5"/>
<text x="1125" y="242" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#24324a">底层：怎样完成动作</text>
<text x="1125" y="287" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">VLA / 技能策略 / 规划器</text>
<text x="1125" y="322" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">按子任务与观测产生动作</text>
<path d="M441 285 H555" fill="none" stroke="#687d92" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M976 285 H1090" fill="none" stroke="#687d92" stroke-width="3" marker-end="url(#arrow)"/>
<text x="456" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#54647b">提案</text>
<text x="993" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#54647b">调用</text>
<rect x="1100" y="543" width="425" height="180" rx="15" fill="#fff0d9" stroke="#cbd3df" stroke-width="1.5"/>
<text x="1125" y="589" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#24324a">机器人与环境</text>
<text x="1125" y="634" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">动作队列 → 跟踪控制器</text>
<text x="1125" y="669" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">抓取、运动、接触改变状态</text>
<path d="M1260 379 V532" fill="none" stroke="#687d92" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1290" y="442" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#54647b">动作块 / 目标值</text>
<path d="M1470 539 H1560 V220 H1534" fill="none" stroke="#687d92" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1320" y="489" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#54647b">新图像 / 状态</text>
<rect x="565" y="543" width="410" height="180" rx="15" fill="#e7f2ff" stroke="#cbd3df" stroke-width="1.5"/>
<text x="590" y="589" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#24324a">证据：实际发生了什么</text>
<text x="590" y="634" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">动作执行结果、观察时间</text>
<text x="590" y="669" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">“杯子在水槽里”的检测</text>
<path d="M1097 632 H985" fill="none" stroke="#687d92" stroke-width="3" marker-end="url(#arrow)"/>
<text x="994" y="607" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#54647b">观察</text>
<rect x="50" y="543" width="390" height="180" rx="15" fill="#f0eafa" stroke="#cbd3df" stroke-width="1.5"/>
<text x="75" y="589" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" fill="#24324a">进度、记忆与恢复</text>
<text x="75" y="634" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">完成 → 选择下一子任务</text>
<text x="75" y="669" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#24324a">失败 / 不确定 → 重看、重试</text>
<path d="M562 632 H450" fill="none" stroke="#687d92" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M235 540 V387" fill="none" stroke="#687d92" stroke-width="3" marker-end="url(#arrow)"/>
<text x="48" y="449" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#54647b">更新高层上下文</text>
<rect x="50" y="774" width="1475" height="68" rx="15" fill="#ffffff" stroke="#cbd3df" stroke-width="1.5"/>
<text x="73" y="818" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#24324a">两种测试：记住过去的线索（Memory）  /  完成所有依赖步骤（Long-Horizon）</text>
<text x="48" y="876" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#54647b">原创接口图 · 综合 SayCan、Inner Monologue、分层 VLA；评测区分见 RoboDojo。逻辑模块不要求各自独立模型</text>
</svg>
