<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img"><title>VLS｜把奖励梯度接进动作生成</title><desc>贯穿任务：把橙子放到挪了位置的绿盘子上 · 原创机制示意，非实验轨迹</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566579"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cc650c"/></marker></defs><rect width="1440" height="860" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Noto Sans, sans-serif"><text x="42" y="52" font-size="30" font-weight="bold" fill="#14283e">VLS｜把奖励梯度接进动作生成</text><text x="42" y="86" font-size="18" font-weight="normal" fill="#59697b">贯穿任务：把橙子放到挪了位置的绿盘子上 · 原创机制示意，非实验轨迹</text><rect x="28" y="112" width="1384" height="219" rx="15" fill="#faf7ff" stroke="#ddd1ee" stroke-width="2"/><text x="48" y="143" font-size="21" font-weight="bold" fill="#765198">① 语义与几何：生成奖励程序，VLM 位于动作求导图之外</text><rect x="48" y="164" width="375" height="139" rx="15" fill="#f3edfc" stroke="#ae8ecb" stroke-width="2"/><text x="68" y="197" font-size="23" font-weight="bold" fill="#22364b">场景与关键点</text><text x="68" y="228" font-size="18" font-weight="normal" fill="#22364b">RGB-D + 指令 + 机器人状态</text><text x="68" y="254" font-size="18" font-weight="normal" fill="#22364b">SAM 分割 + DINOv2 特征 + 深度</text><text x="68" y="280" font-size="18" font-weight="normal" fill="#22364b">输出 P：n 个三维点（n × 3）</text><rect x="474" y="164" width="418" height="139" rx="15" fill="#f3edfc" stroke="#ae8ecb" stroke-width="2"/><text x="494" y="197" font-size="23" font-weight="bold" fill="#22364b">VLM：解释目标并生成代码</text><text x="494" y="228" font-size="18" font-weight="normal" fill="#22364b">阶段 1：接近 / 抓橙子</text><text x="494" y="254" font-size="18" font-weight="normal" fill="#22364b">阶段 2：搬运 / 放绿盘子</text><text x="494" y="280" font-size="18" font-weight="normal" fill="#22364b">输出阶段奖励 Rₛ(P, X)</text><rect x="943" y="164" width="420" height="139" rx="15" fill="#fff2df" stroke="#dfac66" stroke-width="2"/><text x="963" y="197" font-size="23" font-weight="bold" fill="#22364b">实例化可微奖励程序</text><text x="963" y="228" font-size="18" font-weight="normal" fill="#22364b">输入：关键点 P 与末端轨迹 X</text><text x="963" y="254" font-size="18" font-weight="normal" fill="#22364b">输出：一个标量奖励 Rₛ</text><text x="963" y="280" font-size="18" font-weight="normal" fill="#22364b">执行张量代码，无需再次询问 VLM</text><path d="M 423 233 L 474 233" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 892 233 L 943 233" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="357" width="1384" height="257" rx="15" fill="#fffaf1" stroke="#ecd3ac" stroke-width="2"/><text x="48" y="390" font-size="21" font-weight="bold" fill="#a75c12">② 当前动作样本的计算图：只对动作求梯度</text><rect x="48" y="414" width="306" height="131" rx="15" fill="#edf4ff" stroke="#82a9d7" stroke-width="2"/><text x="68" y="447" font-size="23" font-weight="bold" fill="#22364b">动作候选 Aᵏ</text><text x="68" y="478" font-size="18" font-weight="normal" fill="#22364b">B × H × d</text><text x="68" y="504" font-size="18" font-weight="normal" fill="#22364b">B 个候选；每个 H 步动作</text><text x="68" y="530" font-size="18" font-weight="normal" fill="#22364b">k 表示去噪进度</text><rect x="403" y="414" width="352" height="131" rx="15" fill="#fff2df" stroke="#dfac66" stroke-width="2"/><text x="423" y="447" font-size="23" font-weight="bold" fill="#22364b">动作 → 末端位置轨迹</text><text x="423" y="478" font-size="18" font-weight="normal" fill="#22364b">反归一化 + 坐标 / 动作适配</text><text x="423" y="504" font-size="18" font-weight="normal" fill="#22364b">X：B × H × 3</text><text x="423" y="530" font-size="18" font-weight="normal" fill="#22364b">保留对动作的导数</text><rect x="805" y="414" width="323" height="131" rx="15" fill="#fff2df" stroke="#dfac66" stroke-width="2"/><text x="825" y="447" font-size="23" font-weight="bold" fill="#22364b">计算 Rₛ(P, X)</text><text x="825" y="478" font-size="18" font-weight="normal" fill="#22364b">例如 −‖终点 − 绿盘子‖²</text><text x="825" y="504" font-size="18" font-weight="normal" fill="#22364b">反向传播得到 ∂Rₛ/∂Aᵏ</text><text x="825" y="530" font-size="18" font-weight="normal" fill="#22364b">代码将修正注入 xyz 分量</text><rect x="1171" y="414" width="192" height="131" rx="15" fill="#fff2df" stroke="#dfac66" stroke-width="2"/><text x="1191" y="447" font-size="23" font-weight="bold" fill="#22364b">引导项 g</text><text x="1191" y="478" font-size="18" font-weight="normal" fill="#22364b">奖励上升方向</text><text x="1191" y="504" font-size="18" font-weight="normal" fill="#22364b">作用于当前样本</text><text x="1191" y="530" font-size="18" font-weight="normal" fill="#22364b">模型参数冻结</text><path d="M 354 478 L 403 478" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 755 478 L 805 478" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1128 478 L 1171 478" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1155 303 L 1155 372 L 970 372 L 970 414" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 5"/><path d="M 1265 545 L 1265 579 L 203 579 L 203 545" fill="none" stroke="#cc650c" stroke-width="3" marker-end="url(#orange)"/><text x="430" y="574" font-size="19" font-weight="normal" fill="#a75c12">梯度回到 Aᵏ；不穿过 VLM，也不更新底座参数</text><rect x="48" y="659" width="386" height="128" rx="15" fill="#edf4ff" stroke="#82a9d7" stroke-width="2"/><text x="68" y="692" font-size="23" font-weight="bold" fill="#22364b">冻结扩散 / 流匹配底座</text><text x="68" y="723" font-size="18" font-weight="normal" fill="#22364b">正常去噪方向 + 奖励引导</text><text x="68" y="749" font-size="18" font-weight="normal" fill="#22364b">候选排斥 + FK 奖励重采样</text><text x="68" y="775" font-size="18" font-weight="normal" fill="#22364b">输出修正后的动作块</text><rect x="527" y="659" width="354" height="128" rx="15" fill="#eaf7f0" stroke="#7bb69a" stroke-width="2"/><text x="547" y="692" font-size="23" font-weight="bold" fill="#22364b">机器人执行动作块</text><text x="547" y="723" font-size="18" font-weight="normal" fill="#22364b">橙子真的抓住了吗？</text><text x="547" y="749" font-size="18" font-weight="normal" fill="#22364b">位置接近与接触成功分开检查</text><text x="547" y="775" font-size="18" font-weight="normal" fill="#22364b">新观测进入反馈环</text><rect x="974" y="659" width="389" height="128" rx="15" fill="#f3edfc" stroke="#ae8ecb" stroke-width="2"/><text x="994" y="692" font-size="23" font-weight="bold" fill="#22364b">反馈与阶段切换</text><text x="994" y="723" font-size="18" font-weight="normal" fill="#22364b">按奖励进展调节引导强度</text><text x="994" y="749" font-size="18" font-weight="normal" fill="#22364b">高低阈值触发 VLM 检查</text><text x="994" y="775" font-size="18" font-weight="normal" fill="#22364b">继续抓取，或切换到放置</text><path d="M 203 614 L 203 659" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 434 723 L 527 723" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 881 723 L 974 723" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><text x="49" y="832" font-size="18" font-weight="normal" fill="#59697b">图示将论文机制与公开代码接口分层呈现；实际动作维度、时域和坐标变换由底座及机器人适配器决定</text></g></svg>