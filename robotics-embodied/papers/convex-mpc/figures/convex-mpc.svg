<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#52647e"/></marker></defs><rect width="1440" height="920" fill="#f6f8fc"/><style>text{font-family:Noto Sans CJK SC,DejaVu Sans,sans-serif;fill:#172b4d} .title{font-size:34px;font-weight:700} .sub{font-size:18px;fill:#52647e} .head{font-size:24px;font-weight:700} .body{font-size:21px} .tiny{font-size:17px;fill:#52647e}</style><text x="52" y="62" class="title">Convex MPC：固定接触安排下，滚动优化支撑脚力</text><text x="52" y="98" class="sub">原创机制图｜凸性来自近似后的线性动力学、二次目标和线性约束；不是对所有步态联合求全局最优</text><rect x="50" y="150" width="410" height="206" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="189" class="head">传感与参考</text><text x="72" y="226" class="body">IMU + 编码器 → 状态估计</text><text x="72" y="257" class="body">操作者 → 速度／偏航／步态</text><text x="72" y="288" class="body">启发式 → 未来落脚点</text><text x="72" y="319" class="body">接触检测处理提前／延后触地</text><rect x="520" y="150" width="440" height="206" rx="16" fill="#eaf2ff" stroke="#76a3e5" stroke-width="2"/><text x="542" y="189" class="head">单刚体近似</text><text x="542" y="226" class="body">x = [欧拉角, p, ω, v, g]</text><text x="542" y="257" class="body">小横滚／俯仰；忽略腿惯性</text><text x="542" y="288" class="body">给定偏航、力臂、接触时序</text><text x="542" y="319" class="body">x(k+1) = A x(k) + B(k) u(k)</text><rect x="1020" y="150" width="370" height="206" rx="16" fill="#eaf7f1" stroke="#68aa8b" stroke-width="2"/><text x="1042" y="189" class="head">有限预测窗 QP</text><text x="1042" y="226" class="body">决策：各步支撑脚 3D 力</text><text x="1042" y="257" class="body">跟踪误差 + 力二次惩罚</text><text x="1042" y="288" class="body">消去状态，凝聚成力变量</text><text x="1042" y="319" class="body">只应用第一步接触力</text><path d="M460 248 L520 248" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M960 248 L1020 248" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="432" width="495" height="175" rx="16" fill="#fff4e3" stroke="#dbac5d" stroke-width="2"/><text x="72" y="471" class="head">约束属于近似模型</text><text x="72" y="508" class="body">支撑脚：法向力上下界</text><text x="72" y="539" class="body">|fx| ≤ μ fz；|fy| ≤ μ fz</text><text x="72" y="570" class="body">摆动脚：f = 0；不是圆形摩擦锥</text><rect x="610" y="432" width="780" height="175" rx="16" fill="#eaf2ff" stroke="#76a3e5" stroke-width="2"/><text x="632" y="471" class="head">不同时间尺度共同闭环</text><text x="632" y="508" class="body">MPC：实验预测更新 25–50 Hz，窗长 0.33–0.5 s</text><text x="632" y="539" class="body">支撑腿：接触力 → 坐标变换 → J 转置 → 力矩</text><text x="632" y="570" class="body">摆动腿：轨迹 PD + 动力学前馈；估计／腿控制 1 kHz</text><path d="M545 516 L576 516 L576 390 L1205 390 L1205 356" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1210 356 L1210 432" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="682" width="610" height="140" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="721" class="head">边界：QP最优 ≠ 真机全局最优</text><text x="72" y="758" class="body">不联合优化接触时序；不含完整关节约束</text><text x="72" y="789" class="body">弱模型、状态误差、打滑和电机饱和仍会失败</text><rect x="720" y="682" width="670" height="140" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="742" y="721" class="head">读实验时保留失败和配置</text><text x="742" y="758" class="body">实机最高 3 m/s；6 m/s 是增大腿速后的仿真</text><text x="742" y="789" class="body">楼梯三次尝试包含失败，不能改写成全成功</text><path d="M1390 527 L1413 527 L1413 125 L246 125 L246 150" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><text x="52" y="886" class="tiny">依据 Di Carlo 等，IROS 2018，§II–V；原创重绘。频率按正文实验设置记录，摘要给出另一概括范围。</text></svg>