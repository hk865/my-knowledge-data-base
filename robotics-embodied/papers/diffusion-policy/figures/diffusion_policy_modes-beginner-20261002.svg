<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#556579"/></marker></defs><rect width="1600" height="780" fill="#f8fafc"/><text x="50" y="62" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#24324a">为什么平均动作可能失效</text><text x="50" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">原创教学示意，位置与轨迹均为解释用构造，不是论文实验数据</text><rect x="45" y="145" width="470" height="470" rx="12" fill="#fff" stroke="#cdd7e3" stroke-width="2"/><text x="65" y="190" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#24324a">两条示范都能到达接触点</text><rect x="217" y="295" width="125" height="90" rx="12" fill="#cbd5e1" stroke="#cdd7e3" stroke-width="2"/><circle cx="280" cy="535" r="12" fill="#2f7dba"/><circle cx="280" cy="240" r="10" fill="#d8903f"/><text x="65" y="583" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#24324a">蓝点是末端；灰块代表需绕开的物体</text><rect x="565" y="145" width="470" height="470" rx="12" fill="#fff" stroke="#cdd7e3" stroke-width="2"/><text x="585" y="190" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#24324a">把两个方向平均</text><rect x="737" y="295" width="125" height="90" rx="12" fill="#cbd5e1" stroke="#cdd7e3" stroke-width="2"/><circle cx="800" cy="535" r="12" fill="#2f7dba"/><circle cx="800" cy="240" r="10" fill="#d8903f"/><text x="585" y="583" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#24324a">蓝点是末端；灰块代表需绕开的物体</text><rect x="1085" y="145" width="470" height="470" rx="12" fill="#fff" stroke="#cdd7e3" stroke-width="2"/><text x="1105" y="190" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#24324a">整段采样可保持同一方向</text><rect x="1257" y="295" width="125" height="90" rx="12" fill="#cbd5e1" stroke="#cdd7e3" stroke-width="2"/><circle cx="1320" cy="535" r="12" fill="#2f7dba"/><circle cx="1320" cy="240" r="10" fill="#d8903f"/><text x="1105" y="583" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#24324a">蓝点是末端；灰块代表需绕开的物体</text><path d="M280 535 C115 505 125 260 280 240" fill="none" stroke="#2f7dba" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 535 C445 505 435 260 280 240" fill="none" stroke="#b179c9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M800 528L800 390" fill="none" stroke="#ca5858" stroke-width="7" marker-end="url(#a)"/><text x="590" y="450" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#a63c3c">平均会撞向物体</text><path d="M1320 535 C1155 505 1165 260 1320 240" fill="none" stroke="#2f7dba" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M1320 535 C1485 505 1475 260 1320 240" fill="none" stroke="#b179c9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9"/><text x="60" y="665" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#24324a">要学的是一组合理路线的分布，而不是把所有正确答案叠成一条平均路线</text><text x="60" y="712" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" fill="#24324a">一次采样可选左绕，另一次可选右绕；联合生成动作块有助于块内不反复换边</text></svg>