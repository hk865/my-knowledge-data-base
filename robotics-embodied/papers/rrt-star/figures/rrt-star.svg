<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#52647e"/></marker></defs><rect width="1440" height="920" fill="#f6f8fc"/><style>text{font-family:Noto Sans CJK SC,DejaVu Sans,sans-serif;fill:#172b4d} .title{font-size:34px;font-weight:700} .sub{font-size:18px;fill:#52647e} .head{font-size:24px;font-weight:700} .body{font-size:21px} .tiny{font-size:17px;fill:#52647e}</style><text x="52" y="62" class="title">RRT*：从快速探索，到选择父节点与局部重连</text><text x="52" y="98" class="sub">原创机制图｜主线解释2011原始算法；2011的RRT*半径证明存在后续审计，不能把空间覆盖直接当成时序可达</text><rect x="50" y="147" width="280" height="170" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="186" class="head">① 采样与延伸</text><text x="72" y="223" class="body">x_rand → 最近节点</text><text x="72" y="254" class="body">Steer最多走 η</text><text x="72" y="285" class="body">整条新边碰撞检测</text><rect x="385" y="147" width="310" height="170" rx="16" fill="#eaf2ff" stroke="#76a3e5" stroke-width="2"/><text x="407" y="186" class="head">② 选择新点父节点</text><text x="407" y="223" class="body">邻域内比较到根总代价</text><text x="407" y="254" class="body">Cost(v) + c(v → new)</text><text x="407" y="285" class="body">几何最近不等于总代价低</text><rect x="750" y="147" width="300" height="170" rx="16" fill="#eaf7f1" stroke="#68aa8b" stroke-width="2"/><text x="772" y="186" class="head">③ 重连已有邻居</text><text x="772" y="223" class="body">经新点更便宜且无碰撞</text><text x="772" y="254" class="body">删除邻居旧父边</text><text x="772" y="285" class="body">保持树，维护子树成本</text><rect x="1105" y="147" width="285" height="170" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="1127" y="186" class="head">④ 继续改进</text><text x="1127" y="223" class="body">更新当前最好路径</text><text x="1127" y="254" class="body">更多时间 → 更多机会</text><text x="1127" y="285" class="body">没有有限步最优保证</text><path d="M330 231 L385 231" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 231 L750 231" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><path d="M1050 231 L1105 231" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="386" width="745" height="429" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="425" class="head">数值示意：成本只是解释，不是论文实验</text><circle cx="170" cy="516" r="35" fill="#dae6fa" stroke="#52647e" stroke-width="2"/><text x="170" y="523" text-anchor="middle" class="body">A</text><text x="170" y="585" text-anchor="middle" class="tiny">到根 6</text><circle cx="170" cy="685" r="35" fill="#dae6fa" stroke="#52647e" stroke-width="2"/><text x="170" y="692" text-anchor="middle" class="body">B</text><text x="170" y="754" text-anchor="middle" class="tiny">到根 3</text><circle cx="490" cy="600" r="35" fill="#d7eee3" stroke="#52647e" stroke-width="2"/><text x="490" y="607" text-anchor="middle" class="body">新点</text><text x="490" y="669" text-anchor="middle" class="tiny">取总代价 5</text><circle cx="692" cy="678" r="35" fill="#d7eee3" stroke="#52647e" stroke-width="2"/><text x="692" y="685" text-anchor="middle" class="body">C</text><text x="692" y="747" text-anchor="middle" class="tiny">旧9 → 新6</text><path d="M205 524 L455 590" stroke="#9ba7b7" stroke-width="3" stroke-dasharray="8 6" fill="none"/><text x="311" y="516" class="body">+1 → 共7</text><path d="M205 675 L455 612" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="665" class="body">+2 → 共5</text><path d="M525 613 L660 663" fill="none" stroke="#52647e" stroke-width="3" marker-end="url(#arrow)"/><text x="595" y="602" class="body">+1</text><text x="79" y="785" class="tiny">选B为父；若新点到C可连，则C改父。图中长度不按比例。</text><rect x="855" y="386" width="535" height="205" rx="16" fill="#eaf2ff" stroke="#76a3e5" stroke-width="2"/><text x="877" y="425" class="head">半径与稀疏度：原始算法</text><text x="877" y="462" class="body">r_n = min{γ(log n / n)^(1/d), η}</text><text x="877" y="493" class="body">半径变小；预期邻居数仍 ∝ log n</text><text x="877" y="524" class="body">固定维度与数据结构条件很重要</text><text x="877" y="555" class="body">PRM* / RRG / RRT* 不可混为一谈</text><rect x="855" y="641" width="535" height="174" rx="16" fill="#fff4e3" stroke="#dbac5d" stroke-width="2"/><text x="877" y="680" class="head">理论审计：还要看样本顺序</text><text x="877" y="717" class="body">2020工作指出原RRT*证明缺口</text><text x="877" y="748" class="body">替代证明使用 1/(d+1) 半径指数</text><text x="877" y="779" class="body">新充分条件 ≠ 原半径已被证伪</text><text x="52" y="886" class="tiny">依据 Karaman与Frazzoli 2011，算法6；Solovey等2020，§III–V。图示由本文独立设计。</text></svg>