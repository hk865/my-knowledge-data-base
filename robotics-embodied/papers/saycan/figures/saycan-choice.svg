<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470"><rect width="100%" height="100%" fill="#f7fafc"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#496780"/></marker></defs><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#19344c}.t{font-size:25px;font-weight:700}.b{font-size:18px}</style><text x="40" y="48" class="t">SayCan 技能选择的教学分解</text><rect x="40" y="85" width="425" height="128" rx="12" fill="white" stroke="#a9c3d6"/><text x="60" y="116" class="t">1 目标与语言评分</text><text x="60" y="150" class="b">任务：收拾桌子</text><text x="60" y="175" class="b">候选技能的语言分数 L</text><rect x="535" y="85" width="425" height="128" rx="12" fill="white" stroke="#a9c3d6"/><text x="555" y="116" class="t">2 当前状态与可行性</text><text x="555" y="150" class="b">机器人距桌子是否足够近</text><text x="555" y="175" class="b">技能成功估计 C</text><rect x="535" y="255" width="425" height="128" rx="12" fill="white" stroke="#a9c3d6"/><text x="555" y="286" class="t">3 组合与执行</text><text x="555" y="320" class="b">S = L × C</text><text x="555" y="345" class="b">选择技能并交给低层执行</text><rect x="40" y="255" width="425" height="128" rx="12" fill="white" stroke="#a9c3d6"/><text x="60" y="286" class="t">4 状态更新</text><text x="60" y="320" class="b">动作后状态发生变化</text><text x="60" y="345" class="b">在新状态下继续选择</text><path d="M470 145 L527 145" fill="none" stroke="#496780" stroke-width="3" marker-end="url(#a)"/><path d="M745 220 L745 245" fill="none" stroke="#496780" stroke-width="3" marker-end="url(#a)"/><path d="M527 317 L473 317" fill="none" stroke="#496780" stroke-width="3" marker-end="url(#a)"/><path d="M248 250 L248 222" fill="none" stroke="#496780" stroke-width="3" marker-end="url(#a)"/><text x="40" y="432" class="b">教学数字：走近桌子 0.4×0.9=0.36  抓杯子 0.6×0.1=0.06</text></svg>
