<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img"><title>VLA-Pilot｜黑盒奖励驱动动作候选演化</title><desc>贯穿任务：左手固定袋口，右手拉拉链 · 原创机制示意，示例数值用于解释搜索</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#566579"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#cc650c"/></marker></defs><rect width="1440" height="860" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, Noto Sans, sans-serif"><text x="42" y="52" font-size="30" font-weight="bold" fill="#14283e">VLA-Pilot｜黑盒奖励驱动动作候选演化</text><text x="42" y="86" font-size="18" font-weight="normal" fill="#59697b">贯穿任务：左手固定袋口，右手拉拉链 · 原创机制示意，示例数值用于解释搜索</text><rect x="40" y="132" width="416" height="147" rx="15" fill="#f3edfc" stroke="#ae8ecb" stroke-width="2"/><text x="60" y="165" font-size="23" font-weight="bold" fill="#22364b">① GPT-4o：生成目标奖励</text><text x="60" y="196" font-size="18" font-weight="normal" fill="#22364b">图像 + 指令 + 末端 / 物体关键点</text><text x="60" y="222" font-size="18" font-weight="normal" fill="#22364b">EPS-CoT：任务与空间关系 → 评分代码</text><text x="60" y="248" font-size="18" font-weight="normal" fill="#22364b">输出 R(a; c)，允许阈值和条件分支</text><rect x="512" y="132" width="399" height="147" rx="15" fill="#edf4ff" stroke="#82a9d7" stroke-width="2"/><text x="532" y="165" font-size="23" font-weight="bold" fill="#22364b">② 冻结 VLA：生成初始候选</text><text x="532" y="196" font-size="18" font-weight="normal" fill="#22364b">DiVLA / RDT-1B 条件扩散采样</text><text x="532" y="222" font-size="18" font-weight="normal" fill="#22364b">A⁰：M × H × d</text><text x="532" y="248" font-size="18" font-weight="normal" fill="#22364b">实验 M = 32 个候选</text><rect x="969" y="132" width="430" height="147" rx="15" fill="#fff2df" stroke="#dfac66" stroke-width="2"/><text x="989" y="165" font-size="23" font-weight="bold" fill="#22364b">③ 奖励代码：批量评分</text><text x="989" y="196" font-size="18" font-weight="normal" fill="#22364b">输入 M 个方案，输出 M 个分数</text><text x="989" y="222" font-size="18" font-weight="normal" fill="#22364b">搜索只查询 R(a; c) 的数值</text><text x="989" y="248" font-size="18" font-weight="normal" fill="#22364b">不求 ∂R/∂a，不更新模型权重</text><path d="M 456 205 L 486 205 L 486 306 L 1184 306 L 1184 279" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 911 205 L 969 205" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="349" width="1384" height="260" rx="15" fill="#fffaf1" stroke="#ecd3ac" stroke-width="2"/><text x="49" y="382" font-size="21" font-weight="bold" fill="#a75c12">④ 内层进化搜索：实验使用 10 轮；每轮产生新的动作候选</text><rect x="49" y="405" width="300" height="145" rx="15" fill="#fff2df" stroke="#dfac66" stroke-width="2"/><text x="69" y="438" font-size="23" font-weight="bold" fill="#22364b">按分数抽取父代</text><text x="69" y="469" font-size="18" font-weight="normal" fill="#22364b">qᵢ ∝ exp(τRᵢ)</text><text x="69" y="495" font-size="18" font-weight="normal" fill="#22364b">有放回抽 M 个精英</text><text x="69" y="521" font-size="18" font-weight="normal" fill="#22364b">高分者获得更多后代</text><rect x="397" y="405" width="302" height="145" rx="15" fill="#fff2df" stroke="#dfac66" stroke-width="2"/><text x="417" y="438" font-size="23" font-weight="bold" fill="#22364b">少量加噪：探索邻域</text><text x="417" y="469" font-size="18" font-weight="normal" fill="#22364b">ẽ = √ᾱ · e + √(1−ᾱ) · ε</text><text x="417" y="495" font-size="18" font-weight="normal" fill="#22364b">保留父代信息，加入变化</text><text x="417" y="521" font-size="18" font-weight="normal" fill="#22364b">截断步数决定探索幅度</text><rect x="747" y="405" width="337" height="145" rx="15" fill="#edf4ff" stroke="#82a9d7" stroke-width="2"/><text x="767" y="438" font-size="23" font-weight="bold" fill="#22364b">冻结 VLA：部分去噪</text><text x="767" y="469" font-size="18" font-weight="normal" fill="#22364b">从中间噪声水平继续生成</text><text x="767" y="495" font-size="18" font-weight="normal" fill="#22364b">利用已学动作先验</text><text x="767" y="521" font-size="18" font-weight="normal" fill="#22364b">形成新候选集合 Aᵏ</text><rect x="1132" y="405" width="230" height="145" rx="15" fill="#fff2df" stroke="#dfac66" stroke-width="2"/><text x="1152" y="438" font-size="23" font-weight="bold" fill="#22364b">再次评分</text><text x="1152" y="469" font-size="18" font-weight="normal" fill="#22364b">R(Aᵏ; c)</text><text x="1152" y="495" font-size="18" font-weight="normal" fill="#22364b">重复选择与变异</text><text x="1152" y="521" font-size="18" font-weight="normal" fill="#22364b">最后取最高分方案</text><path d="M 349 478 L 397 478" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 699 478 L 747 478" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1084 478 L 1132 478" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1184 306 L 1184 325 L 18 325 L 18 478 L 49 478" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1246 550 L 1246 581 L 199 581 L 199 550" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><text x="519" y="577" font-size="18" font-weight="normal" fill="#a75c12">改变候选集合，而不仅是给原候选排序</text><rect x="49" y="657" width="366" height="130" rx="15" fill="#eaf7f0" stroke="#7bb69a" stroke-width="2"/><text x="69" y="690" font-size="23" font-weight="bold" fill="#22364b">⑤ 执行最佳动作块</text><text x="69" y="721" font-size="18" font-weight="normal" fill="#22364b">右手接近并拉动拉链头</text><text x="69" y="747" font-size="18" font-weight="normal" fill="#22364b">左手维持袋口稳定</text><text x="69" y="773" font-size="18" font-weight="normal" fill="#22364b">获得真实执行后的观测</text><rect x="505" y="657" width="450" height="130" rx="15" fill="#f3edfc" stroke="#ae8ecb" stroke-width="2"/><text x="525" y="690" font-size="23" font-weight="bold" fill="#22364b">⑥ 执行反思：修正目标与动作</text><text x="525" y="721" font-size="18" font-weight="normal" fill="#22364b">原始动作 + 执行动作 + 新观测 + 历史</text><text x="525" y="747" font-size="18" font-weight="normal" fill="#22364b">GPT-4o 判断引导结果，必要时重写 R</text><text x="525" y="773" font-size="18" font-weight="normal" fill="#22364b">失败则重试，直至成功或达到重试上限</text><rect x="1045" y="657" width="317" height="130" rx="15" fill="#f1f4f7" stroke="#b4bfcd" stroke-width="2"/><text x="1065" y="690" font-size="23" font-weight="bold" fill="#22364b">要分别检查的结果</text><text x="1065" y="721" font-size="18" font-weight="normal" fill="#22364b">奖励变高：代理目标改善</text><text x="1065" y="747" font-size="18" font-weight="normal" fill="#22364b">SOA：到达目标点附近</text><text x="1065" y="773" font-size="18" font-weight="normal" fill="#22364b">MSR：真正完成操作任务</text><path d="M 1362 478 L 1390 478 L 1390 630 L 232 630 L 232 657" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 415 723 L 505 723" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><path d="M 955 723 L 1045 723" fill="none" stroke="#566579" stroke-width="3" marker-end="url(#arrow)"/><text x="49" y="832" font-size="18" font-weight="normal" fill="#59697b">内层搜索尚未执行的动作；外层依靠真实执行反馈。接近拉链头并不保证夹住、正确受力或完成拉链任务</text></g></svg>