<svg style="font-family: Noto Sans CJK SC, sans-serif; fill: #142a43" xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#6c8294"/></marker></defs><rect width="1440" height="900" fill="#f8fbfd"/>
<text x="55" y="63" font-size="34" font-weight="700">Engram：按 N-gram 哈希查表，门控后加回残差流</text>
<text x="55" y="103" font-size="21" fill="#596d80">原创机制图 · 以 "Alexander the Great" 中的 "Great" 为例；维度取 Engram-27B（示例数值）</text>
<text x="55" y="160" font-size="25" font-weight="700">A  地址：只由输入 token 决定</text>
<rect x="55" y="190" width="300" height="150" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="77" y="228" font-size="21">token ID</text>
<text x="77" y="262" font-size="19" fill="#596d80">→ 规范 ID（小写、NFKC）</text>
<text x="77" y="294" font-size="19" fill="#596d80">有效词表缩小 23%</text>
<rect x="430" y="190" width="380" height="150" rx="14" fill="#fff0cc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="452" y="228" font-size="21">后缀 N-gram</text>
<text x="452" y="262" font-size="19">2-gram：(the, great)</text>
<text x="452" y="294" font-size="19">3-gram：(alexander, the, great)</text>
<rect x="885" y="190" width="500" height="150" rx="14" fill="#fde4e4" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="907" y="228" font-size="21">多头哈希：2 阶 × 8 头 = 16 张子表</text>
<text x="907" y="262" font-size="19" fill="#596d80">每张约 226 万行（素数），每行 80 维</text>
<text x="907" y="294" font-size="19" fill="#596d80">拼接得 eₜ，1280 维；两层合计约 5.8B 参数</text>
<path d="M355,265 L430,265" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<path d="M810,265 L885,265" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<text x="55" y="410" font-size="25" font-weight="700">B  读取：当前隐藏状态决定放行多少</text>
<rect x="55" y="440" width="300" height="130" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="77" y="478" font-size="21">隐藏状态 hₜ</text>
<text x="77" y="512" font-size="19" fill="#596d80">已经过前面的注意力层</text>
<text x="77" y="544" font-size="19" fill="#596d80">mHC 的每条流各有一个</text>
<rect x="430" y="440" width="420" height="130" rx="14" fill="#dff4ed" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="452" y="478" font-size="21">kₜ = W_K eₜ，vₜ = W_V eₜ</text>
<text x="452" y="512" font-size="19">αₜ = σ(RMSNorm(hₜ)·RMSNorm(kₜ)/√d)</text>
<text x="452" y="544" font-size="18" fill="#596d80">点积项 2 → α ≈ 0.88；−2 → α ≈ 0.12</text>
<rect x="925" y="440" width="460" height="130" rx="14" fill="#fff0cc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="947" y="478" font-size="21">αₜvₜ → 短因果卷积（零初始化）</text>
<text x="947" y="512" font-size="19" fill="#596d80">H ← H + Y，再进注意力与 MoE</text>
<text x="947" y="544" font-size="19" fill="#596d80">27B 放在第 2、15 层（共 30 层）</text>
<path d="M355,505 L430,505" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<path d="M850,505 L925,505" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<polyline points="1135,340 1135,400 640,400 640,440" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<text x="55" y="640" font-size="25" font-weight="700">C  系统：地址先于计算确定，可以预取</text>
<rect x="55" y="670" width="640" height="190" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="77" y="708" font-size="21">MoE：选专家要等隐藏状态算出</text>
<text x="77" y="742" font-size="19" fill="#596d80">路由依赖运行时的 hₜ，专家权重须驻留显存</text>
<text x="77" y="776" font-size="19" fill="#596d80">（V4 的前 3 个 MoE 层改为按 token ID 哈希路由）</text>
<rect x="745" y="670" width="640" height="190" rx="14" fill="#dff4ed" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="767" y="708" font-size="21">Engram：表放主机内存，边算前层边取</text>
<text x="767" y="742" font-size="19" fill="#596d80">每 token 每层只取 1280 个数（BF16 约 2.5 KiB）</text>
<text x="767" y="776" font-size="19" fill="#596d80">100B 表：吞吐降 1.9%（4B）、2.8%（8B）</text>
<text x="767" y="810" font-size="19" fill="#596d80">V4.1-Flash：196B 表，RL 采样时改为常驻显存</text>
</svg>
