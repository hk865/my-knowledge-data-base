<svg style="font-family: Noto Sans CJK SC, sans-serif; fill: #142a43" xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#6c8294"/></marker></defs><rect width="1440" height="960" fill="#f8fbfd"/>
<text x="55" y="63" font-size="34" font-weight="700">Transformer：三种注意力共享同一个算子</text>
<text x="55" y="103" font-size="21" fill="#596d80">原创机制图 · 读图顺序：左侧编码器 → 中部解码器 → 右侧训练与生成；按原论文 post-LN 绘制</text>
<rect x="55" y="160" width="320" height="85" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="77" y="198" font-size="23" fill="#142a43" font-weight="400">源序列 x + 位置编码</text>
<rect x="55" y="295" width="320" height="150" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="77" y="333" font-size="21" fill="#142a43" font-weight="400">编码器 × 6</text>
<text x="77" y="366" font-size="21" fill="#142a43" font-weight="400">全序列 self-attention</text>
<text x="77" y="399" font-size="21" fill="#142a43" font-weight="400">Add + Norm → FFN</text>
<text x="77" y="432" font-size="21" fill="#142a43" font-weight="400">→ Add + Norm</text>
<rect x="55" y="495" width="320" height="95" rx="14" fill="#dff4ed" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="77" y="533" font-size="21" fill="#142a43" font-weight="400">编码记忆 Z</text>
<text x="77" y="566" font-size="21" fill="#142a43" font-weight="400">每个源位置保留一个向量</text>
<path d="M215,245 L215,295" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<path d="M215,445 L215,495" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<rect x="465" y="160" width="370" height="85" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="487" y="198" font-size="23" fill="#142a43" font-weight="400">目标右移 y&lt;t + 位置编码</text>
<rect x="465" y="295" width="370" height="125" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="487" y="333" font-size="21" fill="#142a43" font-weight="400">因果 self-attention</text>
<text x="487" y="366" font-size="21" fill="#142a43" font-weight="400">Q / K / V 来自目标序列</text>
<text x="487" y="399" font-size="21" fill="#142a43" font-weight="400">未来位置分数设为 −∞</text>
<rect x="465" y="470" width="370" height="105" rx="14" fill="#dff4ed" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="487" y="508" font-size="21" fill="#142a43" font-weight="400">cross-attention</text>
<text x="487" y="541" font-size="21" fill="#142a43" font-weight="400">Q 来自目标，K / V 来自 Z</text>
<rect x="465" y="625" width="370" height="95" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="487" y="663" font-size="21" fill="#142a43" font-weight="400">FFN 前馈子层</text>
<text x="487" y="696" font-size="21" fill="#142a43" font-weight="400">每个子层都有残差与 post-LN</text>
<path d="M650,245 L650,295" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<path d="M650,420 L650,470" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<path d="M650,575 L650,625" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<path d="M375,540 L465,525" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<text x="490" y="755" font-size="20" fill="#596d80" font-weight="400">解码器重复 6 次，再投影到词表</text>
<rect x="925" y="160" width="460" height="205" rx="14" fill="#fff0cc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="947" y="198" font-size="23" fill="#142a43" font-weight="400">核心算子</text>
<text x="947" y="233" font-size="23" fill="#142a43" font-weight="400">softmax(QKᵀ / √dₖ + mask) V</text>
<text x="947" y="268" font-size="23" fill="#142a43" font-weight="400">多头：独立投影 → 拼接 → Wᴼ</text>
<text x="947" y="303" font-size="23" fill="#142a43" font-weight="400">注意力混合位置；FFN变换通道</text>
<rect x="925" y="420" width="460" height="145" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="947" y="458" font-size="22" fill="#142a43" font-weight="400">训练：teacher forcing</text>
<text x="947" y="492" font-size="22" fill="#142a43" font-weight="400">已知整段目标，同时算各位置损失</text>
<text x="947" y="526" font-size="22" fill="#142a43" font-weight="400">并行计算不允许看未来标签</text>
<rect x="925" y="620" width="460" height="150" rx="14" fill="#dff4ed" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="947" y="658" font-size="22" fill="#142a43" font-weight="400">推理：逐 token 生成</text>
<text x="947" y="692" font-size="22" fill="#142a43" font-weight="400">预测 → 追加 token → 再预测</text>
<text x="947" y="726" font-size="22" fill="#142a43" font-weight="400">KV缓存是工程延伸，仍随长度增长</text>
<rect x="55" y="785" width="780" height="85" rx="14" fill="#fde8e7" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="77" y="823" font-size="20" fill="#142a43" font-weight="400">短路径 ≠ 低复杂度：全局交互 O(L²d)，单层位置间路径 O(1)</text>
<text x="55" y="910" font-size="18" fill="#596d80" font-weight="400">依据：Attention Is All You Need v7，§3、图1–2、表1；KV缓存文字是本解读的工程连接，不冒充论文贡献</text>
</svg>