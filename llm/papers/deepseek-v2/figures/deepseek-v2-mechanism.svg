<svg style="font-family: Noto Sans CJK SC, sans-serif; fill: #142a43" xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#6c8294"/></marker></defs><rect width="1440" height="960" fill="#f8fbfd"/>
<text x="55" y="63" font-size="34" font-weight="700">DeepSeek-V2：MLA 压缩 KV，MoE 稀疏使用 FFN</text>
<text x="55" y="103" font-size="21" fill="#596d80">原创机制图 · 两个模块分别优化注意力缓存和前馈计算；模型仍保留因果 softmax attention</text>
<text x="55" y="165" font-size="25" fill="#142a43" font-weight="700">A  MLA：为每个历史 token 缓存小潜变量</text>
<rect x="55" y="205" width="200" height="85" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="77" y="243" font-size="23" fill="#142a43" font-weight="400">隐向量 hₜ</text>
<rect x="345" y="205" width="415" height="140" rx="14" fill="#dff4ed" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="367" y="243" font-size="22" fill="#142a43" font-weight="400">低秩压缩 cₜᴷⱽ（512维）</text>
<text x="367" y="277" font-size="22" fill="#142a43" font-weight="400">内容 Key / Value 共享潜变量</text>
<text x="367" y="311" font-size="22" fill="#142a43" font-weight="400">上投影可吸收到 Q / 输出投影</text>
<rect x="875" y="205" width="510" height="140" rx="14" fill="#fff0cc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="897" y="243" font-size="22" fill="#142a43" font-weight="400">历史缓存：cⱼᴷⱽ + kⱼᴿ</text>
<text x="897" y="277" font-size="22" fill="#142a43" font-weight="400">每 token 每层 512 + 64 = 576 元素</text>
<text x="897" y="311" font-size="22" fill="#142a43" font-weight="400">仍需遍历历史，缓存总量仍为 O(L)</text>
<path d="M255,247 L345,247" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<path d="M760,275 L875,275" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<rect x="345" y="390" width="415" height="110" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="367" y="428" font-size="22" fill="#142a43" font-weight="400">独立 RoPE 分支 kₜᴿ（64维）</text>
<text x="367" y="462" font-size="22" fill="#142a43" font-weight="400">将位置旋转与内容低秩投影解耦</text>
<polyline points="155,290 155,445 345,445" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<polyline points="760,445 1125,445 1125,345" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<text x="55" y="565" font-size="25" fill="#142a43" font-weight="700">B  DeepSeekMoE：相同 token 只走部分专家</text>
<rect x="55" y="605" width="200" height="85" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="77" y="643" font-size="23" fill="#142a43" font-weight="400">MLA 输出 uₜ</text>
<rect x="345" y="575" width="415" height="85" rx="14" fill="#dff4ed" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="367" y="613" font-size="23" fill="#142a43" font-weight="400">2 个共享专家始终计算</text>
<rect x="345" y="715" width="415" height="115" rx="14" fill="#e5f1fc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="367" y="753" font-size="22" fill="#142a43" font-weight="400">Router → 160 个路由专家中选 6</text>
<text x="367" y="787" font-size="22" fill="#142a43" font-weight="400">单 token 最多发送到 3 个设备</text>
<rect x="875" y="625" width="510" height="135" rx="14" fill="#fff0cc" stroke="#b7c9d7" stroke-width="1.5"/>
<text x="897" y="663" font-size="22" fill="#142a43" font-weight="400">共享输出 + 加权路由输出 + 残差</text>
<text x="897" y="697" font-size="22" fill="#142a43" font-weight="400">总参数 236B，单 token 激活 21B</text>
<text x="897" y="731" font-size="22" fill="#142a43" font-weight="400">激活参数少 ≠ 所有权重只占 21B 显存</text>
<polyline points="255,646 300,646 300,617 345,617" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<polyline points="255,646 300,646 300,773 345,773" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<path d="M760,617 L875,667" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<path d="M760,773 L875,718" fill="none" stroke="#6c8294" stroke-width="3" marker-end="url(#a)"/>
<text x="55" y="910" font-size="18" fill="#596d80" font-weight="400">依据：DeepSeek-V2 v5，§2、§3.1.2与附录C；维度为V2主模型，非V2-Lite；非按原图复制</text>
</svg>