<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#67778c"/></marker></defs>
<rect width="1600" height="1050" fill="#f7f9fc"/>
<g font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif">
<text x="64" y="68" font-size="38" font-weight="700" fill="#182841">SFT 学一句话的概率 RM 学两句话的相对分数</text>
<text x="64" y="114" font-size="23" font-weight="400" fill="#54657b">数值均为教学假设。SFT 更新会写答案的模型；RM 更新会比较答案的模型。</text>
<rect x="64" y="164" width="705" height="548" rx="16" fill="white" stroke="#315bba" stroke-width="2"/><rect x="64" y="164" width="705" height="54" rx="16" fill="#315bba"/><rect x="64" y="190" width="705" height="28" fill="#315bba"/><text x="86" y="201" font-size="27" font-weight="700" fill="#fff">SFT 示例 目标回答分成三个假想 token</text><text x="86" y="260" font-size="24" font-weight="400" fill="#182841">训练前正确 token 概率：0.50、0.80、0.60</text><text x="86" y="300" font-size="24" font-weight="400" fill="#182841">整句概率 = 0.50 × 0.80 × 0.60 = 0.240</text><text x="86" y="340" font-size="24" font-weight="400" fill="#182841">负对数似然 = −ln(0.240) = 1.427</text><text x="86" y="380" font-size="24" font-weight="400" fill="#182841">训练后正确 token 概率：0.70、0.85、0.80</text><text x="86" y="420" font-size="24" font-weight="400" fill="#182841">整句概率 = 0.476；损失 = 0.742</text><text x="86" y="460" font-size="24" font-weight="400" fill="#182841">每一步给模型的前缀都是正确示范前缀</text><text x="86" y="500" font-size="24" font-weight="400" fill="#182841">这叫 teacher forcing</text><text x="86" y="540" font-size="24" font-weight="400" fill="#182841">损失下降说明更会模仿该示范的措辞</text><text x="86" y="580" font-size="24" font-weight="400" fill="#182841">不能单独证明答案更真实或更受人喜欢</text>
<rect x="831" y="164" width="705" height="548" rx="16" fill="white" stroke="#7853ad" stroke-width="2"/><rect x="831" y="164" width="705" height="54" rx="16" fill="#7853ad"/><rect x="831" y="190" width="705" height="28" fill="#7853ad"/><text x="853" y="201" font-size="27" font-weight="700" fill="#fff">RM 示例 人已选择 y_w 优于 y_l</text><text x="853" y="260" font-size="24" font-weight="400" fill="#182841">r_w = 1.2；r_l = 0.2；分数差 Δ = 1.0</text><text x="853" y="300" font-size="24" font-weight="400" fill="#182841">偏好概率 = σ(1.0) ≈ 0.731</text><text x="853" y="340" font-size="24" font-weight="400" fill="#182841">损失 = −ln(0.731) ≈ 0.313</text><text x="853" y="380" font-size="24" font-weight="400" fill="#182841">如果错误地打成 r_w = 0.2；r_l = 1.2</text><text x="853" y="420" font-size="24" font-weight="400" fill="#182841">偏好概率降到 0.269；损失升到 1.313</text><text x="853" y="460" font-size="24" font-weight="400" fill="#182841">梯度让较好回答相对升分、较差回答降分</text><text x="853" y="500" font-size="24" font-weight="400" fill="#182841">两边都加 100，分数差与损失都不变</text><text x="853" y="540" font-size="24" font-weight="400" fill="#182841">所以奖励分不是百分制成绩</text><text x="853" y="580" font-size="24" font-weight="400" fill="#182841">也不是“73.1% 概率事实正确”</text>
<text x="64" y="782" font-size="30" font-weight="700" fill="#182841">两种训练回答了不同问题</text>
<text x="64" y="837" font-size="27" font-weight="400" fill="#182841">SFT：这个好示范里的下一个 token 应该是什么？</text>
<text x="64" y="887" font-size="27" font-weight="400" fill="#182841">RM：面对这个问题，人更愿意收到哪一个候选回答？</text>
<text x="64" y="937" font-size="27" font-weight="400" fill="#087e83">后面的 PPO 才会把 RM 的判断变成生成行为的改变</text>
<text x="64" y="1005" font-size="22" font-weight="400" fill="#54657b">依据：[1] §3.5、式1；概率分解与小算例为本文教学推导</text>
</g></svg>