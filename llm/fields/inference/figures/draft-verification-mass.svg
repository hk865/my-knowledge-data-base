<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650"><rect width="1320" height="650" fill="#f8fbff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="48" font-size="31" fill="#18324f">接受已有的概率质量，再把缺口补回去</text><text x="40" y="158" font-size="25" fill="#18324f">草稿 D</text><rect x="235" y="120" width="540.0" height="70" fill="#4389c9"/><text x="475.0" y="163" font-size="23" fill="#132c42">A 0.6</text><rect x="775.0" y="120" width="90.0" height="70" fill="#eab344"/><text x="790.0" y="163" font-size="23" fill="#132c42">B 0.1</text><rect x="865.0" y="120" width="270.0" height="70" fill="#67b58e"/><text x="970.0" y="163" font-size="23" fill="#132c42">C 0.3</text><text x="40" y="288" font-size="25" fill="#18324f">接受部分</text><rect x="235" y="250" width="450.0" height="70" fill="#4389c9"/><text x="430.0" y="293" font-size="23" fill="#132c42">A 0.5</text><rect x="685.0" y="250" width="90.0" height="70" fill="#eab344"/><text x="700.0" y="293" font-size="23" fill="#132c42">B 0.1</text><rect x="775.0" y="250" width="180.0" height="70" fill="#67b58e"/><text x="835.0" y="293" font-size="23" fill="#132c42">C 0.2</text><rect x="955.0" y="250" width="180" height="70" fill="#fff4df" stroke="#ca8d21" stroke-dasharray="6 4"/><text x="970.0" y="293" font-size="23" fill="#18324f">拒绝 0.2</text><text x="40" y="418" font-size="25" fill="#18324f">最终输出</text><rect x="235" y="380" width="450.0" height="70" fill="#4389c9"/><text x="430.0" y="423" font-size="23" fill="#132c42">A 0.5</text><rect x="685.0" y="380" width="270.0" height="70" fill="#eab344"/><text x="790.0" y="423" font-size="23" fill="#132c42">B 0.3</text><rect x="955.0" y="380" width="180.0" height="70" fill="#67b58e"/><text x="1015.0" y="423" font-size="23" fill="#132c42">C 0.2</text><text x="40" y="515" font-size="25" fill="#18324f">目标 T = (0.5, 0.3, 0.2)；拒绝分支只需为 B 补回 0.2</text><text x="40" y="560" font-size="22" fill="#18324f">若拒绝后直接按 T 重抽，则得到 (0.6, 0.16, 0.24)，反而破坏目标分布</text><text x="40" y="610" font-size="20" fill="#18324f">原创人工算例，非模型实测。横条长度表示概率质量，三个候选合计为 1</text></g></svg>