<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="650" viewBox="0 0 1320 650"><rect width="1320" height="650" fill="#f8fbff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="48" font-size="31" fill="#18324f">先提出候选，再计算同一前缀下的目标概率</text><rect x="40" y="90" width="370" height="190" rx="16" fill="#e6f2ff" stroke="#bdcddd"/><text x="60" y="127" font-size="25" fill="#18324f">1 小模型写 K 个候选</text><text x="60" y="167" font-size="20" fill="#18324f">已接受前缀 → 草稿序列</text><text x="60" y="198" font-size="20" fill="#18324f">同时保留每步草稿概率 D</text><text x="60" y="229" font-size="20" fill="#18324f">候选还不是最终输出</text><rect x="475" y="90" width="370" height="190" rx="16" fill="#e6f6ef" stroke="#bdcddd"/><text x="495" y="127" font-size="25" fill="#18324f">2 目标模型批量前向</text><text x="495" y="167" font-size="20" fill="#18324f">已知候选前缀可并行计分</text><text x="495" y="198" font-size="20" fill="#18324f">得到 K+1 组条件概率 T</text><text x="495" y="229" font-size="20" fill="#18324f">这里没有反向传播更新</text><rect x="910" y="90" width="370" height="190" rx="16" fill="#fff3d8" stroke="#bdcddd"/><text x="930" y="127" font-size="25" fill="#18324f">3 从左到右检验</text><text x="930" y="167" font-size="20" fill="#18324f">按 min(1, T/D) 接受</text><text x="930" y="198" font-size="20" fill="#18324f">概率来自同一个条件前缀</text><text x="930" y="229" font-size="20" fill="#18324f">不是给整句话打好坏分</text><text x="420" y="195" font-size="40" fill="#18324f">→</text><text x="855" y="195" font-size="40" fill="#18324f">→</text><rect x="100" y="350" width="515" height="180" rx="16" fill="#fff0ed" stroke="#bdcddd"/><text x="120" y="387" font-size="25" fill="#18324f">出现首个拒绝</text><text x="120" y="427" font-size="20" fill="#18324f">保留前面已经接受的token</text><text x="120" y="458" font-size="20" fill="#18324f">按归一化 max(T−D,0) 补一个</text><text x="120" y="489" font-size="20" fill="#18324f">旧后缀失效；从新前缀继续</text><rect x="705" y="350" width="515" height="180" rx="16" fill="#eef0ff" stroke="#bdcddd"/><text x="725" y="387" font-size="25" fill="#18324f">K 个候选全部接受</text><text x="725" y="427" font-size="20" fill="#18324f">从最后的目标分布再抽一个</text><text x="725" y="458" font-size="20" fill="#18324f">这一轮可推进 K+1 个位置</text><text x="725" y="489" font-size="20" fill="#18324f">更新前缀后继续下一轮</text><text x="42" y="606" font-size="24" fill="#18324f">保真指输出分布一致；不保证随机运行逐字相同，也不保证内容事实正确</text></g></svg>