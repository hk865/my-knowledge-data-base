<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#42637c"/></marker></defs><rect width="1600" height="1080" fill="#f7fafc"/>
<text x="60" y="68" font-family="Noto Sans CJK SC, sans-serif" font-size="36" fill="#102e46" font-weight="700">DDPM：一次随机噪声训练，千步反向链生成</text>
<text x="60" y="110" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#526777" font-weight="400">Denoising Diffusion Probabilistic Models · arXiv:2006.11239v2 · 原版为像素空间无条件图像生成</text>
<text x="60" y="170" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#203849" font-weight="700">固定正向过程 q：逐步丢掉信息，不训练去加噪</text>
<rect x="60" y="210" width="330" height="150" rx="16" fill="#e8f2fb" stroke="#aac7df" stroke-width="2"/>
<text x="82" y="250" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#203849" font-weight="700">x₀ 真实图像</text>
<text x="82" y="288" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">H × W × C</text>
<text x="82" y="321" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">像素缩放到 [-1, 1]</text>
<rect x="455" y="210" width="430" height="150" rx="16" fill="#e8f2fb" stroke="#aac7df" stroke-width="2"/>
<text x="477" y="250" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#203849" font-weight="700">xₜ 带噪图像</text>
<text x="477" y="288" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">√ᾱₜ x₀ + √(1-ᾱₜ) ε</text>
<text x="477" y="321" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">ε ~ N(0, I)</text>
<rect x="1025" y="210" width="330" height="150" rx="16" fill="#e8f2fb" stroke="#aac7df" stroke-width="2"/>
<text x="1047" y="250" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#203849" font-weight="700">xT 近似纯噪声</text>
<text x="1047" y="288" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">T = 1000</text>
<text x="1047" y="321" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">β: 0.0001 → 0.02</text>
<path d="M390,285 L455,285" fill="none" stroke="#42637c" stroke-width="3" marker-end="url(#a)"/>
<path d="M885,285 L1025,285" fill="none" stroke="#42637c" stroke-width="3" marker-end="url(#a)"/>
<text x="1380" y="270" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">αₜ=1-βₜ</text>
<text x="1380" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">ᾱₜ=∏αₛ</text>
<line x1="60" y1="390" x2="1540" y2="390" stroke="#cfdae2"/>
<text x="60" y="440" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#203849" font-weight="700">训练：随机抽一个 t，不必展开整条反向链</text>
<rect x="60" y="475" width="365" height="175" rx="16" fill="#e8f2fb" stroke="#aac7df" stroke-width="2"/>
<text x="82" y="515" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#203849" font-weight="700">采样一个训练任务</text>
<text x="82" y="553" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">抽 x₀、t、ε</text>
<text x="82" y="586" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">闭式构造 xₜ</text>
<text x="82" y="619" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">监督就是本次抽到的 ε</text>
<rect x="490" y="475" width="475" height="175" rx="16" fill="#e8f2fb" stroke="#aac7df" stroke-width="2"/>
<text x="512" y="515" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#203849" font-weight="700">共享 U-Net  εθ(xₜ, t)</text>
<text x="512" y="553" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">输入图像张量与时间嵌入</text>
<text x="512" y="586" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">预测同形状噪声张量</text>
<text x="512" y="619" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">卷积 + 多尺度 + 16×16注意力</text>
<rect x="1030" y="475" width="500" height="175" rx="16" fill="#fff1dc" stroke="#d8bd8f" stroke-width="2"/>
<text x="1052" y="515" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#203849" font-weight="700">Lsimple = E ||ε - εθ||²</text>
<text x="1052" y="553" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">只更新网络 θ</text>
<text x="1052" y="586" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">丢掉原ELBO逐步权重</text>
<text x="1052" y="619" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">更好样本 ≠ 更好似然</text>
<path d="M425,562 L490,562" fill="none" stroke="#42637c" stroke-width="3" marker-end="url(#a)"/>
<path d="M965,562 L1030,562" fill="none" stroke="#42637c" stroke-width="3" marker-end="url(#a)"/>
<line x1="60" y1="690" x2="1540" y2="690" stroke="#cfdae2"/>
<text x="60" y="738" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#203849" font-weight="700">推理：从新噪声开始，反复调用同一个网络</text>
<rect x="60" y="775" width="300" height="160" rx="16" fill="#e8f2fb" stroke="#aac7df" stroke-width="2"/>
<text x="82" y="815" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#203849" font-weight="700">xT ~ N(0,I)</text>
<text x="82" y="853" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">没有真实 x₀</text>
<text x="82" y="886" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">没有训练噪声标签</text>
<rect x="430" y="775" width="650" height="160" rx="16" fill="#e8f2fb" stroke="#aac7df" stroke-width="2"/>
<text x="452" y="815" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#203849" font-weight="700">预测 εθ → 计算反向均值 → 加随机噪声</text>
<text x="452" y="853" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">xₜ₋₁ = μθ(xₜ,t) + σₜ z</text>
<text x="452" y="886" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">t = T, …, 1；最后一步 z = 0</text>
<rect x="1150" y="775" width="380" height="160" rx="16" fill="#edf5ec" stroke="#aacba7" stroke-width="2"/>
<text x="1172" y="815" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#203849" font-weight="700">得到新图像 x₀</text>
<text x="1172" y="853" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">1000 次网络评估</text>
<text x="1172" y="886" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#203849" font-weight="400">全部像素一起更新</text>
<path d="M360,855 L430,855" fill="none" stroke="#42637c" stroke-width="3" marker-end="url(#a)"/>
<path d="M1080,855 L1150,855" fill="none" stroke="#42637c" stroke-width="3" marker-end="url(#a)"/>
<text x="70" y="990" font-family="Noto Sans CJK SC, sans-serif" font-size="23" fill="#526777" font-weight="400">概念边界：xₜ虽称 latent，却与图像同维；原版没有 VAE 压缩、文本条件或动作动力学</text>
<text x="60" y="1040" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#657885" font-weight="400">原创教学图 · 结构与实验配置来自所标注论文；非原图复刻 · 2026-09-30</text></svg>