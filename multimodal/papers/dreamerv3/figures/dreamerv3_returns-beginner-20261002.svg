<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#556579"/></marker></defs><rect width="1600" height="740" fill="#f8fafc"/><text x="50" y="62" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" fill="#24324a">短期想象如何连接长期奖励</text><text x="50" y="105" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">教学算例：λ-return用模型奖励和critic估值共同构造学习目标</text><rect x="50" y="160" width="430" height="220" rx="12" fill="#e8f2fd" stroke="#cdd7e3" stroke-width="2"/><text x="72" y="202" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">模型想象的这一小步</text><text x="72" y="244" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">即时奖励 r_t = 1</text><text x="72" y="278" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">下个状态仍继续 c_t = 1</text><text x="72" y="312" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">折扣 γ = 0.9（演算用）</text><text x="72" y="346" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">混合比例 λ = 0.5（演算用）</text><rect x="585" y="160" width="430" height="220" rx="12" fill="#eeeafa" stroke="#cdd7e3" stroke-width="2"/><text x="607" y="202" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">下个状态的两种估计</text><text x="607" y="244" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">critic估值 v(s_(t+1)) = 4</text><text x="607" y="278" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">继续向后计算 R_(t+1) = 6</text><text x="607" y="312" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">各占一半：0.5×4 + 0.5×6</text><text x="607" y="346" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">得到折扣前后续估计 5</text><rect x="1120" y="160" width="430" height="220" rx="12" fill="#e4f3eb" stroke="#cdd7e3" stroke-width="2"/><text x="1142" y="202" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24324a">这一状态的回报目标</text><text x="1142" y="244" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">R_t = 1 + 0.9×1×5</text><text x="1142" y="278" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">      = 5.5</text><text x="1142" y="312" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">若此处终止 c_t = 0</text><text x="1142" y="346" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#24324a">则 R_t = 1</text><path d="M490 260L570 260" fill="none" stroke="#556579" stroke-width="3" marker-end="url(#a)"/><path d="M1025 260L1105 260" fill="none" stroke="#556579" stroke-width="3" marker-end="url(#a)"/><text x="60" y="466" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#24324a">critic学着预测这个目标；actor学着更常选择能产生高回报的动作</text><text x="60" y="522" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">没有actor的好动作，模型只会预测；没有可靠模型，actor可能被虚假的奖励误导</text><text x="60" y="607" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#66758c">论文实际默认 γ = 0.997、λ = 0.95；这里改成易算数字，仅帮助理解</text><text x="60" y="660" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#24324a">长远结果仍被critic近似，因此15步想象不等于只关心15步以内的奖励</text></svg>