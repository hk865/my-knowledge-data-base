<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2365ad"/></marker></defs><rect width="1280" height="700" fill="#fff"/>
<text x="40" y="58" fill="#18334f" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="start">CLIP 读实验前先分清三个问题</text>
<text x="40" y="98" fill="#66788a" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">同一个图像编码器，可以搭配完全不同的下游评价协议；分数不能串用</text>
<rect x="40" y="155" width="280" height="125" rx="12" fill="#f7fafc" stroke="#167b67" stroke-width="2"/>
<text x="180.0" y="225.5" fill="#167b67" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">零样本分类</text>
<path d="M330 217L385 217" fill="none" stroke="#2365ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="405" y="155" width="830" height="125" rx="12" fill="#f7fafc" stroke="#167b67" stroke-width="2"/>
<text x="820.0" y="191.5" fill="#167b67" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">类别文字 → 文本塔 → 类别权重</text>
<text x="820.0" y="225.5" fill="#167b67" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">目标任务训练标签：不用于拟合分类头</text>
<text x="820.0" y="259.5" fill="#167b67" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">考察：已有图文对齐能否直接迁移</text>
<rect x="40" y="325" width="280" height="125" rx="12" fill="#f7fafc" stroke="#2365ad" stroke-width="2"/>
<text x="180.0" y="395.5" fill="#2365ad" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">冻结特征的线性探针</text>
<path d="M330 387L385 387" fill="none" stroke="#2365ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="405" y="325" width="830" height="125" rx="12" fill="#f7fafc" stroke="#2365ad" stroke-width="2"/>
<text x="820.0" y="361.5" fill="#2365ad" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">带标签图像 → 固定图像塔 → 训练线性分类头</text>
<text x="820.0" y="395.5" fill="#2365ad" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">编码器不更新；分类头使用目标任务训练标签</text>
<text x="820.0" y="429.5" fill="#2365ad" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">考察：图像特征里有没有容易读出的类别信息</text>
<rect x="40" y="495" width="280" height="125" rx="12" fill="#f7fafc" stroke="#b86412" stroke-width="2"/>
<text x="180.0" y="565.5" fill="#b86412" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle">分布变化下的稳健性</text>
<path d="M330 557L385 557" fill="none" stroke="#2365ad" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="405" y="495" width="830" height="125" rx="12" fill="#f7fafc" stroke="#b86412" stroke-width="2"/>
<text x="820.0" y="531.5" fill="#b86412" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">常规测试集 → 画风、拍摄条件或来源变化的测试集</text>
<text x="820.0" y="565.5" fill="#b86412" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">需同时说明使用零样本还是拟合后的分类头</text>
<text x="820.0" y="599.5" fill="#b86412" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">考察：原来的成功能否在新分布下保留</text>
<text x="40" y="671" fill="#66788a" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">原创教学图；评价协议依据 CLIP v1 §3.1–3.3；不是三种不同的预训练算法</text>
</svg>