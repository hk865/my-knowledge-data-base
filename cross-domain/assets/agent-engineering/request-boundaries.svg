<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840"><rect width="1320" height="840" fill="#f8fbff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="40" y="50" font-size="33" fill="#20364e">一次工具调用：需要分别检查哪些问题？</text><rect x="40" y="95" width="1240" height="95" rx="15" fill="#e8f1fd" stroke="#bfccda"/><text x="62" y="134" font-size="26" fill="#20364e">1  任务与输入</text><text x="275" y="151" font-size="24" fill="#20364e">谁提出目标？外部内容是数据，还是有权改变任务的指令？</text><rect x="40" y="215" width="1240" height="95" rx="15" fill="#e6f5ec" stroke="#bfccda"/><text x="62" y="254" font-size="26" fill="#20364e">2  身份与授权</text><text x="275" y="271" font-size="24" fill="#20364e">哪个会话 / 工作负载，对哪个资源，执行什么操作？</text><rect x="40" y="335" width="1240" height="95" rx="15" fill="#fff0d5" stroke="#bfccda"/><text x="62" y="374" font-size="26" fill="#20364e">3  执行隔离</text><text x="275" y="391" font-size="24" fill="#20364e">进程能访问哪些文件、系统接口、网络与凭据？</text><rect x="40" y="455" width="1240" height="95" rx="15" fill="#f0eaff" stroke="#bfccda"/><text x="62" y="494" font-size="26" fill="#20364e">4  资源管理</text><text x="275" y="511" font-size="24" fill="#20364e">CPU、内存、运行时长和并发占用是否有边界？</text><rect x="40" y="575" width="1240" height="95" rx="15" fill="#e5f4f6" stroke="#bfccda"/><text x="62" y="614" font-size="26" fill="#20364e">5  结果与集成</text><text x="275" y="631" font-size="24" fill="#20364e">结果是否满足目标？证据能否追溯？谁负责合并与冲突？</text><text x="40" y="740" font-size="25" fill="#20364e">互补边界：容器、权限策略、资源配额、测试各自只回答其中一部分</text><text x="40" y="790" font-size="22" fill="#20364e">原创教学示意；不是通用固定架构、实施配置或安全认证</text></g></svg>