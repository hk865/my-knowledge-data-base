<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">边沿时间与传播延迟</title><desc id="d">同一走线传播延迟为0.5纳秒，慢边沿10纳秒和快边沿0.2纳秒的对照，示意不按比例绘制。</desc><rect width="1200" height="680" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#172638"><text x="50" y="60" font-size="30" font-weight="bold">低频翻转，也可能需要高速互连设计</text><text x="50" y="98" font-size="19">比较一次跳变的边沿时间，与变化走完整根线的传播时间</text><rect x="45" y="135" width="1110" height="185" rx="16" fill="#e5f2fa"/><text x="70" y="172" font-size="23">慢边沿 · 10 ns</text><path d="M80 264 H125 L250 210 H310" fill="none" stroke="#1673a5" stroke-width="5"/><text x="80" y="300" font-size="18">输出渐变</text><path d="M350 234 H840" stroke="#1673a5" stroke-width="8"/><path d="M840 223 L862 234 L840 245" fill="#1673a5"/><text x="470" y="214" font-size="20">同一走线 · 单程 0.5 ns</text><text x="890" y="235" font-size="22">接收端</text><text x="470" y="277" font-size="20">延迟 / 边沿 = 0.05</text><rect x="45" y="345" width="1110" height="185" rx="16" fill="#fff0dd"/><text x="70" y="382" font-size="23">快边沿 · 0.2 ns</text><path d="M80 474 H180 L188 420 H310" fill="none" stroke="#b76a08" stroke-width="5"/><text x="80" y="510" font-size="18">输出迅速跳变</text><path d="M350 444 H840" stroke="#b76a08" stroke-width="8"/><path d="M840 433 L862 444 L840 455" fill="#b76a08"/><text x="470" y="424" font-size="20">同一走线 · 单程 0.5 ns</text><text x="890" y="445" font-size="22">接收端</text><text x="470" y="487" font-size="20">延迟 / 边沿 = 2.5</text><text x="60" y="582" font-size="22">设计问题：变化何时到达？在哪里反射？回流走哪条路？</text><text x="60" y="624" font-size="18" fill="#536579">原创示意与示例数值，非实测波形；形状未按时间比例绘制</text></g></svg>
