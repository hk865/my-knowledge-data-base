<text x="62" y="185" font-size="17">目标：保留带时区输入的语义</text>
<text x="62" y="212" font-size="17">基线：当前提交 C1</text>
<text x="62" y="239" font-size="17">接口、依赖、验收条件和证据入口</text>
<rect x="466" y="120" width="475" height="143" rx="14" fill="#eaf1fa" stroke="#7f9ec2" stroke-width="1.5"/>
<text x="486" y="154" font-size="21" font-weight="700">局部架构图</text>
<text x="486" y="185" font-size="17">任务 → 接口层 → 时间解析模块 → 回归测试</text>
<text x="486" y="212" font-size="17">边表示真实调用或验证依赖</text>
<text x="486" y="239" font-size="17">模块变更 → 找到需要重新核查的旧结论</text>
<rect x="980" y="120" width="298" height="143" rx="14" fill="#eaf1fa" stroke="#7f9ec2" stroke-width="1.5"/>
<text x="1000" y="154" font-size="21" font-weight="700">共享范围</text>
<text x="1000" y="185" font-size="17">谁能读写这份记忆</text>
<text x="1000" y="212" font-size="17">版本何时对其他任务可见</text>
<text x="1000" y="239" font-size="17">不同结论保留各自证据</text>
