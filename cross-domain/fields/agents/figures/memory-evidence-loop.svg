<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
<title id="title">Agent 工程记忆：任务与局部架构引导检索，当前执行决定能否复用</title>
<desc id="desc">原创教学流程图。旧失败在代码版本和环境下形成证据记录，按新任务与局部模块关系检索；核对当前代码并重跑测试后，才能复用结论或标记失效。此图是教学提案，并非任何论文的完整架构。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#536579" stroke-width="1.5"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#26775e" stroke-width="1.5"/></marker></defs>
<rect width="1320" height="760" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Noto Serif CJK SC, sans-serif" fill="#15283b">
<text x="42" y="52" font-size="28" font-weight="700">经验进入下一次行动，要经过当前证据</text>
<text x="42" y="85" font-size="17" fill="#526476">原创教学设计 · 示例：时间解析测试 · 箭头表示信息流，不表示实验增益</text>

<rect x="42" y="120" width="385" height="143" rx="14" fill="#eaf1fa" stroke="#7f9ec2" stroke-width="1.5"/>
