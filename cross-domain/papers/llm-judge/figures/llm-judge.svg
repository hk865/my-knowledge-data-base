<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#536477"/></marker></defs>
<rect width="1400" height="930" fill="#f7fafc"/>
<g font-family="Noto Sans CJK SC, Noto Sans, sans-serif" fill="#162b3e">
<text x="48" y="62" font-size="34" font-weight="bold">LLM-as-a-Judge：评价模型，也校准裁判</text>
<text x="48" y="103" font-size="19" font-weight="normal">MT-Bench / Chatbot Arena ｜ 原创重绘：§2–4、附录 D.3 ｜ 评测流程，不是被评模型的训练结构</text>
<rect x="48" y="158" width="390" height="162" rx="14" fill="white" stroke="#2663a5" stroke-width="2"/>
<text x="70" y="198" font-size="24" font-weight="bold" fill="#2663a5">问题来源</text>
<text x="70" y="236" font-size="20" font-weight="normal">MT-Bench：80题 × 2轮</text>
<text x="70" y="267" font-size="20" font-weight="normal">Arena：用户自拟匿名对战</text>
<text x="70" y="298" font-size="20" font-weight="normal">保留题目和各自完整历史</text>
<rect x="506" y="158" width="360" height="162" rx="14" fill="white" stroke="#2663a5" stroke-width="2"/>
<text x="528" y="198" font-size="24" font-weight="bold" fill="#2663a5">被评模型</text>
<text x="528" y="236" font-size="20" font-weight="normal">同一问题 → 候选回答</text>
<text x="528" y="267" font-size="20" font-weight="normal">A、B 身份向评审隐藏</text>
<text x="528" y="298" font-size="20" font-weight="normal">多轮历史不能互相串用</text>
<rect x="934" y="158" width="418" height="162" rx="14" fill="white" stroke="#2663a5" stroke-width="2"/>
<text x="956" y="198" font-size="24" font-weight="bold" fill="#2663a5">裁判输入</text>
<text x="956" y="236" font-size="20" font-weight="normal">候选答案 + 评分标准</text>
<text x="956" y="267" font-size="20" font-weight="normal">数学等任务可给独立参考</text>
<text x="956" y="298" font-size="20" font-weight="normal">锁定裁判版本与提示</text>
<polyline points="438,238 500,238" fill="none" stroke="#536477" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="866,238 928,238" fill="none" stroke="#536477" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="421" width="390" height="164" rx="14" fill="white" stroke="#17705e" stroke-width="2"/>
<text x="70" y="461" font-size="24" font-weight="bold" fill="#17705e">人类对照</text>
<text x="70" y="499" font-size="20" font-weight="normal">独立偏好票 A / B / tie</text>
<text x="70" y="530" font-size="20" font-weight="normal">同题多评审可计算人际一致</text>
<text x="70" y="561" font-size="20" font-weight="normal">人群与任务分布限定结论</text>
<rect x="506" y="421" width="360" height="164" rx="14" fill="white" stroke="#17705e" stroke-width="2"/>
<text x="528" y="461" font-size="24" font-weight="bold" fill="#17705e">统计与校准</text>
<text x="528" y="499" font-size="20" font-weight="normal">Agreement：同题判决一致</text>
<text x="528" y="530" font-size="20" font-weight="normal">S1：含平局、不一致作平局</text>
<text x="528" y="561" font-size="20" font-weight="normal">S2：只保留非平局</text>
<rect x="934" y="421" width="418" height="164" rx="14" fill="white" stroke="#2663a5" stroke-width="2"/>
<text x="956" y="461" font-size="24" font-weight="bold" fill="#2663a5">裁判输出</text>
<text x="956" y="499" font-size="20" font-weight="normal">成对：交换顺序再评一次</text>
<text x="956" y="530" font-size="20" font-weight="normal">或单答：每轮 1–10 分</text>
<text x="956" y="561" font-size="20" font-weight="normal">输出理由不能替代正确性</text>
<polyline points="1143,320 1143,415" fill="none" stroke="#536477" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="934,502 872,502" fill="none" stroke="#536477" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="438,502 500,502" fill="none" stroke="#536477" stroke-width="3" marker-end="url(#arrow)"/>
<text x="48" y="657" font-size="24" font-weight="bold" fill="#17705e">结果必须带统计口径</text>
<text x="48" y="699" font-size="23" font-weight="normal">MT-Bench 首轮 GPT-4 vs 人类：S1 = 66%（1343票）；S2 = 85%（859票）</text>
<text x="48" y="741" font-size="22" font-weight="normal">位置偏差 / 冗长偏差 / 候选答案污染 / 裁判版本漂移，均可能改变评测结果</text>
<text x="48" y="815" font-size="22" font-weight="bold" fill="#b66a17">主实验无训练损失；附录 F 才额外探索 Arena 偏好票训练三分类裁判</text>
<text x="48" y="860" font-size="19" font-weight="normal">来源：Table 5，p8；§3.3–3.5；附录 F。图中箭头表示数据流，无梯度回传。</text>
</g></svg>