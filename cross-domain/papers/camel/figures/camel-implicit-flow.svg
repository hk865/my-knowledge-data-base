<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-label="同一个秘密，可以沿两种路径泄漏"><title>同一个秘密，可以沿两种路径泄漏</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#47627e"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bd7028"/></marker></defs><rect width="1400" height="780" fill="#f7fafc"/><text x="50" y="53" fill="#173249" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start">同一个秘密，可以沿两种路径泄漏</text><text x="50" y="91" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">示例：机密字段 h ∈ {0, 1}；观察一次事件最多区分两个状态</text><rect x="50" y="145" width="595" height="385" rx="14" fill="#fff" stroke="#b6c6d2" stroke-width="2"/><text x="72" y="183" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">直接流：秘密出现在参数里</text><rect x="750" y="145" width="600" height="385" rx="14" fill="#fff" stroke="#b6c6d2" stroke-width="2"/><text x="772" y="183" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">隐式流：秘密决定是否执行</text><rect x="95" y="230" width="225" height="130" rx="14" fill="#fff1df" stroke="#dcb278" stroke-width="2"/><text x="117" y="268" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">h = 1</text><text x="117" y="306" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">私密值</text><rect x="365" y="230" width="235" height="130" rx="14" fill="#fbecea" stroke="#cd9189" stroke-width="2"/><text x="387" y="268" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">外部请求</text><text x="387" y="306" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">参数：h</text><path d="M320 295L363 295" stroke="#bd7028" stroke-width="3" fill="none" marker-end="url(#o)"/><text x="95" y="425" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="23" font-weight="400" text-anchor="start">参数依赖 h → 策略可阻止</text><rect x="795" y="230" width="510" height="95" rx="14" fill="#fff1df" stroke="#dcb278" stroke-width="2"/><text x="817" y="268" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">条件：if h == 1</text><rect x="910" y="380" width="395" height="110" rx="14" fill="#fbecea" stroke="#cd9189" stroke-width="2"/><text x="932" y="418" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">固定外部请求</text><text x="932" y="456" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">正文不含 h</text><path d="M1105 325L1105 378" stroke="#47627e" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M820 326L820 432L908 432" stroke="#bd7028" stroke-width="3" fill="none" marker-end="url(#o)" stroke-dasharray="8 6"/><text x="832" y="355" fill="#ad6020" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">STRICT</text><rect x="50" y="575" width="595" height="115" rx="14" fill="#fff" stroke="#b6c6d2" stroke-width="2"/><text x="72" y="613" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">接收方直接读取参数</text><text x="72" y="651" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">h=0 收到 0；h=1 收到 1</text><rect x="750" y="575" width="600" height="115" rx="14" fill="#fff" stroke="#b6c6d2" stroke-width="2"/><text x="772" y="613" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">接收方观察是否收到请求</text><text x="772" y="651" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">h=0 无请求；h=1 有请求 → 泄漏 1 bit</text><text x="63" y="730" fill="#36566f" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start">直接依赖约束参数；隐式依赖还必须覆盖分支条件、异常等对执行的影响</text><text x="50" y="755" fill="#647d90" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">原创教学图 · 箭头表示关系与证据流；示例值不代表生产配置</text></svg>