<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-label="CaMeL：计划不接收原始工具内容，调用先检查依赖"><title>CaMeL：计划不接收原始工具内容，调用先检查依赖</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#47627e"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bd7028"/></marker></defs><rect width="1400" height="850" fill="#f7fafc"/><text x="50" y="53" fill="#173249" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="32" font-weight="700" text-anchor="start">CaMeL：计划不接收原始工具内容，调用先检查依赖</text><text x="50" y="91" fill="#4c6476" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">原创日历任务：从会议通知提取参会人，再把设计摘要放进事件</text><rect x="50" y="145" width="315" height="145" rx="14" fill="#eaf2fa" stroke="#82a9cc" stroke-width="2"/><text x="72" y="183" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">可信用户请求</text><text x="72" y="221" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">任务、对象与目标</text><text x="72" y="252" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">例：建立会议事件</text><rect x="440" y="145" width="330" height="145" rx="14" fill="#eaf2fa" stroke="#82a9cc" stroke-width="2"/><text x="462" y="183" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">P-LLM：生成程序</text><text x="462" y="221" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">工具签名 + 用户请求</text><text x="462" y="252" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">变量连接 + 预定结构</text><rect x="875" y="145" width="475" height="145" rx="14" fill="#eaf2fa" stroke="#82a9cc" stroke-width="2"/><text x="897" y="183" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">受限解释器</text><text x="897" y="221" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">按程序求值与运行</text><text x="897" y="252" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">保留变量、来源和依赖</text><path d="M365 218L438 218" stroke="#47627e" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M770 218L873 218" stroke="#47627e" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="50" y="375" width="315" height="155" rx="14" fill="#fff1df" stroke="#dcb278" stroke-width="2"/><text x="72" y="413" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">外部会议通知</text><text x="72" y="451" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">提取时间与参会人</text><text x="72" y="482" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">原文及来源标签</text><rect x="440" y="375" width="330" height="155" rx="14" fill="#fff1df" stroke="#dcb278" stroke-width="2"/><text x="462" y="413" fill="#183b54" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start">Q-LLM：结构化解析</text><text x="462" y="451" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">没有工具调用权</text><text x="462" y="482" fill="#263f52" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start